name: Sixty original Emby movies and episodes on both repaired engines
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths:
      - '.github/workflows/qa-integrated-private-relay.yml'
permissions:
  contents: read
  actions: read
jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Build network and gesture recorder
        run: |
          mkdir qa-private-driver
          python3 qa-private-arm/build_input.py
          sed 's|adb install -r driver.apk|cp driver.apk "$GITHUB_WORKSPACE/qa-private-driver/driver.apk"|' qa-source-trace/build-driver.sh > "$RUNNER_TEMP/driver.sh"
          bash "$RUNNER_TEMP/driver.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: private-input-driver, path: qa-private-driver/, retention-days: 5}
  private_source:
    needs: driver
    name: Film and episode sample shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: {shard: [0, 1]}
    env:
      QA_SHARD: ${{ matrix.shard }}
      QA_PROBE_LABELS: m-000,m-001,m-002,m-003,m-004,m-005,m-006,m-007,m-008,m-009,m-010,m-011,m-012,m-013,m-014,m-015,m-016,m-017,m-018,m-019,m-020,m-021,m-022,m-023,m-024,m-025,m-026,m-027,m-028,m-029,m-030,m-031,e-000,e-001,e-002,e-003,e-004,e-005,e-006,e-007,e-008,e-009,e-010,e-011,e-012,e-013,e-014,e-015,e-016,e-017,e-018,e-019,e-020,e-021,e-022,e-023,e-024,e-025,e-026,e-027
      QA_OPEN_DIAGNOSTIC_SECONDS: 60
      QA_BENCHMARK_LABELS: m-029,e-027
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Prepare one-use decryption key and emulator
        run: |
          set -euo pipefail
          umask 077
          mkdir -p private-key private-results preview
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/qa-private.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/qa-private.pem" -pubout -out private-key/public.pem
          curl --noproxy "*" --fail --silent --show-error --max-time 12 https://api.ipify.org -o private-key/egress-ip.txt
          python3 -c 'import ipaddress,pathlib; ip=ipaddress.ip_address(pathlib.Path("private-key/egress-ip.txt").read_text().strip()); assert ip.version==4 and ip.is_global'
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil python3-cryptography ffmpeg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: private-input-driver, path: driver}
      - name: Boot native ARM64 emulator before issuing short-lived media locations
        run: bash qa-arm-dual/redroid.sh
      - name: Publish only the public half of this runner's key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relay-sourcekey-${{ github.run_id }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: private-key/
          retention-days: 1
      - name: Verify the same preview and wait for its encrypted film locations
        env: {API_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          build=43846299305
          expected=1a6e6a3e3a4672f5717a0de8be5de5a995afdeb8
          for i in $(seq 1 260); do
            artifact=$(curl -fsSL -H "Authorization: Bearer $API_TOKEN" "$api/actions/runs/$build/artifacts" | jq -r '.artifacts[] | select(.name=="candidate-test-input" and .expired==false) | .id' | head -1)
            if [[ "$artifact" =~ ^[0-9]+$ ]]; then break; fi
            sleep 10
          done
          test -n "$artifact"
          curl -fsSL -H "Authorization: Bearer $API_TOKEN" "$api/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/preview.zip"
          unzip -q "$RUNNER_TEMP/preview.zip" -d preview
          (cd preview && sha256sum -c apk.sha256)
          grep -Fx "app=$expected" preview/provenance.txt
          for i in $(seq 1 500); do
            http=$(curl -sSL -o "$RUNNER_TEMP/envelope.json" -w '%{http_code}' -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/vnd.github.raw+json' "$api/contents/qa-private-arm-input/$GITHUB_RUN_ID-$QA_SHARD-$GITHUB_RUN_ATTEMPT.json?ref=codex%2Ftwo-engines-cloud-seek-20261113")
            if [[ "$http" = 200 ]]; then break; fi
            sleep 4
          done
          test "$http" = 200
          chmod 600 "$RUNNER_TEMP/envelope.json"
      - name: Verify original bytes and both engines through the temporary source relay
        run: |
          test "$GITHUB_ACTIONS" = true
          (cd preview && sha256sum -c apk.sha256)
          adb root || true
          adb wait-for-device
          adb install -r -g preview/composeApp-release.apk
          adb install -r driver/driver.apk
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000
          adb shell wm dismiss-keyguard
          touch /tmp/yfuse-tree-active
          timeout --signal=TERM --kill-after=30s 55m /usr/bin/python3 qa-private-relay/cloud.py
      - name: Clear one-use private playback session
        if: always()
        run: |
          if command -v adb >/dev/null; then timeout 15 adb shell pm clear com.yfuse || true; fi
          rm -f "$RUNNER_TEMP/qa-private.pem" "$RUNNER_TEMP/envelope.json"
      - name: Retain numeric playback measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: relay-source-results-${{ github.run_id }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: private-results
          retention-days: 7
