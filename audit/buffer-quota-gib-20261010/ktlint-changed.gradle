gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':phoneShared')
    ['runKtlintFormatOverAndroidMainSourceSet', 'runKtlintCheckOverAndroidMainSourceSet'].each { taskName ->
        p.tasks.named(taskName).configure { t ->
            t.setSource(p.rootProject.files(changedSources))
            t.doFirst {
                assert t.source.files.size() == changedSources.size()
                println("Checking ${t.source.files.size()} changed Kotlin files")
            }
        }
    }
}
