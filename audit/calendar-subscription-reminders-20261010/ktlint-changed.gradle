def changedSources = [
    "composeApp/src/commonMain/kotlin/com/yfuse/core/data/CalendarFollowStore.kt",
    "composeApp/src/commonMain/kotlin/com/yfuse/core/data/OfficialAiringScheduleCatalog.kt",
    "composeApp/src/androidMain/kotlin/com/yfuse/feature/calendar/CalendarReminderWorker.kt",
    "composeApp/src/commonTest/kotlin/com/yfuse/core/data/CalendarFollowStoreTest.kt",
    "composeApp/src/commonTest/kotlin/com/yfuse/core/data/CalendarReminderSubscriptionTest.kt",
    "composeApp/src/commonTest/kotlin/com/yfuse/core/data/OfficialAiringScheduleCatalogTest.kt",
    "composeApp/src/commonMain/kotlin/com/yfuse/feature/calendar/CalendarScreen.kt"
]

gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':phoneShared')
    ['runKtlintFormatOverAndroidMainSourceSet', 'runKtlintCheckOverAndroidMainSourceSet'].each { taskName ->
        p.tasks.named(taskName).configure { t ->
            t.setSource(p.rootProject.files(changedSources))
            t.doFirst {
                assert t.source.files.size() == changedSources.size()
                println("Checking ${t.source.files.size()} changed Kotlin files")
            }
        }
    }
}
