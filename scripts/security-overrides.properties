# Effective Maven dependency versions forced by the root Gradle resolution strategy.
# The supply-chain scanner reads the same file so the SBOM reflects what the build actually resolves.
# Every pin is an exact coordinate (group:name) forced to one version; the root build script no
# longer carries inline version rules, so a new artifact of a pinned family must be added here.
org.bouncycastle\:bcprov-jdk18on=1.84
org.bouncycastle\:bcpg-jdk18on=1.84
org.bouncycastle\:bcpkix-jdk18on=1.84
org.bouncycastle\:bcutil-jdk18on=1.84
# Build-tool dependencies: ktlint logging and the Kotlin Swift export classpath.
ch.qos.logback\:logback-core=1.5.38
ch.qos.logback\:logback-classic=1.5.38
org.slf4j\:slf4j-api=2.0.17
io.opentelemetry\:opentelemetry-api=1.62.0
io.opentelemetry\:opentelemetry-context=1.62.0
# Netty 4.1.137.Final fixes the fragmented TLS ClientHello SNI routing bypass. These are the
# io.netty artifacts the Android build classpaths resolve (AGP/gRPC tooling).
io.netty\:netty-buffer=4.1.137.Final
io.netty\:netty-codec=4.1.137.Final
io.netty\:netty-codec-http=4.1.137.Final
io.netty\:netty-codec-http2=4.1.137.Final
io.netty\:netty-codec-socks=4.1.137.Final
io.netty\:netty-common=4.1.137.Final
io.netty\:netty-handler=4.1.137.Final
io.netty\:netty-handler-proxy=4.1.137.Final
io.netty\:netty-resolver=4.1.137.Final
io.netty\:netty-transport=4.1.137.Final
io.netty\:netty-transport-native-unix-common=4.1.137.Final
# Protobuf versions before 3.25.5 allow unbounded recursion while parsing unknown fields. The
# build classpaths already resolve the 4.28.3 line (CVE-2024-7254 fixed in 4.28.2+); the pin keeps
# a transitive 3.x request from ever winning. Add protobuf-javalite / protobuf-kotlin-lite here
# the day a module starts resolving them.
com.google.protobuf\:protobuf-java=4.28.3
com.google.protobuf\:protobuf-kotlin=4.28.3
# Wire versions before 6.3.0 allow malformed groups to escape the documented decode failure path.
com.squareup.wire\:wire-runtime=6.3.0
com.squareup.wire\:wire-runtime-jvm=6.3.0
