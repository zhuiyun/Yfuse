<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yfuse Cast Receiver</title>
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  </head>
  <body>
    <style>
      html, body { margin: 0; background: #080d17; color: #eef0f3; font-family: system-ui, sans-serif; }
      cast-media-player {
        --background-color: #080d17;
        --progress-color: #90b4ff;
        --font-family: system-ui, sans-serif;
      }
      #yfuse-error {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 12px; background: rgba(8, 13, 23, 0.96); color: #fff;
        font-family: system-ui, sans-serif; z-index: 10;
      }
      #yfuse-error[hidden] { display: none; }
      #yfuse-error .title { font-size: 40px; font-weight: 600; }
      #yfuse-error .detail { font-size: 24px; color: #bac7dc; max-width: 70vw; text-align: center; }
    </style>
    <cast-media-player></cast-media-player>
    <div id="yfuse-error" hidden>
      <div class="title">播放遇到问题</div>
      <div class="detail" id="yfuse-error-detail"></div>
    </div>
    <script src="receiver.js"></script>
  </body>
</html>
