name: Apply requested UI fixes

on:
  push:
    branches:
      - fix/glass-splash-player-controls-20260813
    paths:
      - scripts/apply_requested_ui_fixes.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/glass-splash-player-controls-20260813
          fetch-depth: 1

      - name: Apply focused UI fixes
        run: python3 scripts/apply_requested_ui_fixes.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh

      - name: Compile Android
        run: ./gradlew :composeApp:compileDebugKotlinAndroid --no-daemon

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composeApp/src
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 1
          fi
          git commit -m 'fix: sync glass splash and player controls'
          git push origin HEAD:fix/glass-splash-player-controls-20260813
