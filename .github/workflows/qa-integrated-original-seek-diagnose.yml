name: Diagnose stalled YCore original ranges over origin and identical loopback bytes
'on':
  push:
    branches:
    - codex/two-engines-cloud-seek-20261113
    paths:
    - .github/workflows/qa-integrated-original-seek-diagnose.yml
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    name: YCore original range control ${{ matrix.path }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        path:
        - origin
        - loopback
    env:
      QA_ENGINE: YCore
      QA_ORIGINAL_PATH: ${{ matrix.path }}
      QA_CAPTURE_FAILURE: 'true'
      QA_RANGE_CONTROL: 'true'
      QA_ORIGINAL_ID: blender-8533ea43-4271-4a57-9694-e9d0b35e1aa1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: candidate-test-input
        path: preview
        run-id: 43994190617
        github-token: ${{ github.token }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: arm-input-driver
        path: qa-driver
        run-id: 43838817605
        github-token: ${{ github.token }}
    - name: Verify identical candidate and prepare original file checks
      run: 'set -euo pipefail

        mkdir -p results

        (cd preview && sha256sum -c apk.sha256)

        grep -Fx "app=8a47d4fa983adaa222fb8b59fee380523ff54a0a" preview/provenance.txt

        cp preview/provenance.txt preview/apk.sha256 results/

        sudo apt-get update -qq

        sudo apt-get install -y ffmpeg python3-pil

        '
    - name: Boot cloud ARM64 Android
      run: bash qa-arm-dual/redroid.sh
    - name: Reproduce twelve starts and backward seeks, preserving the first failure
      run: 'set -euo pipefail

        test "$GITHUB_ACTIONS" = true

        adb install -r -g preview/composeApp-release.apk

        adb install -r qa-driver/driver.apk

        adb shell wm size 720x1280

        adb shell wm density 260

        adb shell settings put secure immersive_mode_confirmations confirmed

        adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000

        adb shell wm dismiss-keyguard

        touch /tmp/yfuse-tree-active

        /usr/bin/python3 qa-arm-matrix/engine.py "$QA_ENGINE"

        /usr/bin/python3 qa-arm-original/reproduce_seek.py

        '
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: original-startup-control-${{ matrix.path }}
        path: results/
        retention-days: 10
