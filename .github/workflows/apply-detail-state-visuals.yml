name: Apply detail selected-state visual polish

on:
  push:
    branches:
      - fix/playback-diagnostics-20260823
    paths:
      - .github/workflows/apply-detail-state-visuals.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/playback-diagnostics-20260823
          fetch-depth: 2

      - name: Apply selected-state visual polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          actions = "composeApp/src/commonMain/kotlin/com/yfuse/feature/detail/DetailActions.kt"
          replace_once(
              actions,
              "    val palette = LocalPalette.current\n    val fill =\n",
              "    val palette = LocalPalette.current\n"
              "    val opaqueAccent = accent.copy(alpha = 1f)\n"
              "    val activeSurface =\n"
              "        if (palette.isDark) {\n"
              "            lerp(opaqueAccent, Color.Black, 0.28f)\n"
              "        } else {\n"
              "            lerp(opaqueAccent, Color.White, 0.22f)\n"
              "        }\n"
              "    val activeForeground =\n"
              "        if (palette.isDark) {\n"
              "            lerp(opaqueAccent, Color.White, 0.32f)\n"
              "        } else {\n"
              "            lerp(opaqueAccent, Color.Black, 0.48f)\n"
              "        }\n"
              "    val activeBorder =\n"
              "        if (palette.isDark) {\n"
              "            lerp(opaqueAccent, Color.White, 0.14f).copy(alpha = 0.82f)\n"
              "        } else {\n"
              "            lerp(opaqueAccent, Color.Black, 0.12f).copy(alpha = 0.78f)\n"
              "        }\n"
              "    val fill =\n",
          )
          replace_once(
              actions,
              "            active -> accent.copy(alpha = if (palette.isDark) 0.28f else 0.18f)",
              "            active -> activeSurface.copy(alpha = if (palette.isDark) 0.52f else 0.62f)",
          )
          replace_once(
              actions,
              "            active -> accent.copy(alpha = 0.48f)",
              "            active -> activeBorder",
          )
          replace_once(
              actions,
              "                        accent.copy(alpha = 0.22f)",
              "                        activeSurface.copy(alpha = if (palette.isDark) 0.64f else 0.74f)",
          )
          replace_once(
              actions,
              "                    if (active) accent.copy(alpha = 0.46f) else palette.border,",
              "                    if (active) activeBorder else palette.border,",
          )
          replace_once(
              actions,
              "                    color = if (active) accent else palette.body,",
              "                    color = if (active) activeForeground else palette.body,",
          )
          replace_once(
              actions,
              "                    tint = if (active) accent else palette.body,",
              "                    tint = if (active) activeForeground else palette.body,",
          )
          replace_once(
              actions,
              "            color = if (active) accent else palette.text,",
              "            color = if (active) activeForeground else palette.text,",
          )
          replace_once(
              actions,
              "        if (active) {\n            Box(Modifier.size(6.dp).clip(CircleShape).background(accent))\n        }\n",
              "",
          )

          episodes = "composeApp/src/commonMain/kotlin/com/yfuse/feature/detail/DetailEpisodes.kt"
          replace_once(
              episodes,
              "import androidx.compose.ui.graphics.Color\n",
              "import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.lerp\n",
          )
          replace_once(
              episodes,
              "    val palette = LocalPalette.current\n    val watching = (episode.playedPercentage ?: 0.0) > 0.0\n",
              "    val palette = LocalPalette.current\n"
              "    val opaqueAccent = accent.copy(alpha = 1f)\n"
              "    val selectedSurface =\n"
              "        if (palette.isDark) {\n"
              "            lerp(opaqueAccent, Color.Black, 0.30f)\n"
              "        } else {\n"
              "            lerp(opaqueAccent, Color.White, 0.42f)\n"
              "        }\n"
              "    val selectedEdge =\n"
              "        if (palette.isDark) {\n"
              "            lerp(opaqueAccent, Color.White, 0.12f).copy(alpha = 0.88f)\n"
              "        } else {\n"
              "            lerp(opaqueAccent, Color.Black, 0.10f).copy(alpha = 0.82f)\n"
              "        }\n"
              "    val selectedText =\n"
              "        if (palette.isDark) {\n"
              "            lerp(opaqueAccent, Color.White, 0.28f)\n"
              "        } else {\n"
              "            lerp(opaqueAccent, Color.Black, 0.38f)\n"
              "        }\n"
              "    val watching = (episode.playedPercentage ?: 0.0) > 0.0\n",
          )
          replace_once(
              episodes,
              "                        selected && palette.isDark -> Color.White.copy(alpha = 0.10f)\n                        selected -> Color.White.copy(alpha = 0.42f)",
              "                        selected && palette.isDark -> selectedSurface.copy(alpha = 0.38f)\n                        selected -> selectedSurface.copy(alpha = 0.52f)",
          )
          replace_once(
              episodes,
              "                    Modifier.border(1.25.dp, accent.copy(alpha = 0.58f), GlassShapes.card)",
              "                    Modifier.border(1.5.dp, selectedEdge, GlassShapes.card)",
          )
          replace_once(
              episodes,
              "                color = if (selected || watching) accent else palette.sub2,",
              "                color =\n                    when {\n                        selected -> selectedText\n                        watching -> accent\n                        else -> palette.sub2\n                    },",
          )
          PY

      - name: Commit polish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            composeApp/src/commonMain/kotlin/com/yfuse/feature/detail/DetailActions.kt \
            composeApp/src/commonMain/kotlin/com/yfuse/feature/detail/DetailEpisodes.kt
          git diff --cached --quiet && { echo "No changes produced"; exit 1; }
          git commit -m "fix: strengthen detail selected states"
          git push origin HEAD:fix/playback-diagnostics-20260823
