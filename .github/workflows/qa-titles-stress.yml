name: Movie and episode playback after rail gesture fix
on:
  push:
    branches: [codex/cloud-playback-resilience-20261113]
    paths: ['.github/workflows/qa-titles-stress.yml','qa-titles-stress/**']
permissions: {contents: read, actions: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bb06bdfa1718a7dcecb58ba727cf9c9bb3f2d86e
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Verify native inputs and build the release candidate
        env: {API_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          app_sha=$(git rev-parse HEAD)
          test "$app_sha" = "bb06bdfa1718a7dcecb58ba727cf9c9bb3f2d86e"
          native_sha=224c838b53dff9f323f830ae64bfbc310288dd20
          git cat-file -e "$native_sha^{commit}"
          git worktree add --detach "$RUNNER_TEMP/native-parent" "$native_sha"
          artifact=14008644829
          curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/actions/artifacts/$artifact" | jq -e --arg n "ycore-source-$native_sha-43362570869-1" '.name==$n and .expired==false and .workflow_run.id==43362570869' > /dev/null
          curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/actions/artifacts/$artifact/zip" -o "$RUNNER_TEMP/native.zip"
          mkdir "$RUNNER_TEMP/native-in"
          unzip -q "$RUNNER_TEMP/native.zip" -d "$RUNNER_TEMP/native-in"
          (
            cd "$RUNNER_TEMP/native-parent"
            export YCORE_NATIVE_AAR_PATH="$RUNNER_TEMP/native-in/ycore-native.aar"
            export YCORE_SOURCE_RECEIPT="$RUNNER_TEMP/native-in/source-build.json"
            export YCORE_SOURCE_COMMIT="$native_sha" SOURCE_COMMIT="$native_sha"
            export YCORE_SOURCE_AAR_SHA256=$(sha256sum "$YCORE_NATIVE_AAR_PATH" | cut -d' ' -f1)
            export YCORE_SOURCE_PROVENANCE_SHA256=$(sha256sum "$RUNNER_TEMP/native-in/NATIVE-SOURCES.txt" | cut -d' ' -f1)
            python3 scripts/prepare-playback-inputs.py
          )
          mkdir -p composeApp/libs
          for item in ycore-native.aar ycore-native.aar.sha256 ycore-native.sources.txt; do
            cp "$RUNNER_TEMP/native-parent/composeApp/libs/$item" "composeApp/libs/$item"
            cmp "$RUNNER_TEMP/native-parent/composeApp/libs/$item" "composeApp/libs/$item"
          done
          (cd composeApp/libs && sha256sum -c ycore-native.aar.sha256)
          printf 'Android application test with standalone native artifact %s from %s; independent source toolchain checked by TV quality gates on %s.\n' "$artifact" "$native_sha" "$app_sha" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$app_sha"
          git diff --exit-code -- .
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0'
          ./gradlew :composeApp:assembleRelease :phoneShared:testAndroidHostTest --tests 'com.yfuse.feature.player.SeekScrubTiersTest' --tests 'com.yfuse.core2.android.ScrubByteWindowTest' -PyfuseIncludeMdk=false -PyfusePlaybackProfile=ycore-senplayer -PyfuseNativeOnlyRuntime=true -PallowDebugSigning=true '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8' --no-daemon
          mkdir preview
          cp composeApp/build/outputs/apk/release/composeApp-release.apk preview/
          printf '%s\n' "$GITHUB_SHA bb06bdfa1718a7dcecb58ba727cf9c9bb3f2d86e" > preview/source.txt
          printf 'app=%s\nnative_built_from=%s\nsource_artifact=%s\n' "$app_sha" "$native_sha" "$artifact" > preview/provenance.txt
          (cd preview && sha256sum composeApp-release.apk > apk.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: candidate-test-input, path: preview, retention-days: 7}
  volume:
    needs: build
    name: Real media seek shard ${{ matrix.shard }} API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - {shard: 0, api: 35, image: '35'}
          - {shard: 1, api: 36, image: '36'}
          - {shard: 2, api: 35, image: '35'}
          - {shard: 3, api: 36, image: '36'}
          - {shard: 4, api: 35, image: '35'}
          - {shard: 5, api: 36, image: '36'}
          - {shard: 6, api: 35, image: '35'}
          - {shard: 7, api: 36, image: '36'}
          - {shard: 8, api: 35, image: '35'}
          - {shard: 9, api: 36, image: '36'}
          - {shard: 10, api: 35, image: '35'}
          - {shard: 11, api: 36, image: '36'}
          - {shard: 12, api: 35, image: '35'}
          - {shard: 13, api: 36, image: '36'}
          - {shard: 14, api: 35, image: '35'}
          - {shard: 15, api: 36, image: '36'}
          - {shard: 16, api: 35, image: '35'}
          - {shard: 17, api: 36, image: '36'}
          - {shard: 18, api: 35, image: '35'}
          - {shard: 19, api: 36, image: '36'}
          - {shard: 20, api: 35, image: '35'}
          - {shard: 21, api: 36, image: '36'}
          - {shard: 22, api: 35, image: '35'}
          - {shard: 23, api: 36, image: '36'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: candidate-test-input, path: preview}
      - name: Verify APK identity and select the picture-verifying input driver
        run: |
          set -euo pipefail
          mkdir -p results
          (cd preview && sha256sum -c apk.sha256)
          cp preview/source.txt preview/apk.sha256 preview/provenance.txt results/
          cp qa-titles-stress/Driver.java qa-volume/input-driver.java
          cp qa-titles-stress/test.py qa-volume/test.py
      - name: Enable hardware acceleration and install fixture tools
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
          /usr/bin/python3 qa-titles-stress/prepare.py ${{ matrix.shard }} 24
      - name: Use current SDK manager on Android 17
        if: matrix.api == 37
        run: sudo mv "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/old-cmdline-tools"
      - name: Run the release preview on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.image }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash qa-volume/run.sh ${{ matrix.shard }}
      - name: Keep per-gesture observations regardless of verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'title-volume-${{ matrix.shard }}', path: results/, retention-days: 10}
