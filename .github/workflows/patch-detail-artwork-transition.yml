name: Patch detail artwork transition

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/detail-artwork-transition-20260822'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out detail branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/detail-artwork-transition-20260822
          fetch-depth: 0

      - name: Apply unified detail colour and resume-time changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str, flags=0) -> str:
              out, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex match, found {count}")
              return out

          # ------------------------------------------------------------------
          # Main Emby/Jellyfin detail: use the same real sampled page colour as Home/Library.
          detail_path = Path('composeApp/src/commonMain/kotlin/com/yfuse/feature/detail/DetailScreen.kt')
          detail = detail_path.read_text()
          detail = detail.replace('import androidx.compose.ui.graphics.Brush\n', '')
          detail = detail.replace('import com.yfuse.core.designsystem.ArtworkAccent\n', '')
          detail = detail.replace('import com.yfuse.core.designsystem.heroPanelBrush\n', '')
          detail = detail.replace('import com.yfuse.core.designsystem.heroSurface\n', '')
          anchor = 'import com.yfuse.core.designsystem.ActionToast\n'
          additions = (
              'import com.yfuse.core.designsystem.ArtworkPageTheme\n'
              'import com.yfuse.core.designsystem.HeroPageFade\n'
          )
          if additions not in detail:
              detail = replace_once(detail, anchor, anchor + additions, 'DetailScreen design imports')
          anchor = 'import com.yfuse.core.designsystem.rememberAnimatedArtworkAccent\n'
          additions = (
              'import com.yfuse.core.designsystem.rememberArtworkPageColor\n'
              'import com.yfuse.core.designsystem.rememberRetainedArtworkPageColor\n'
          )
          if additions not in detail:
              detail = replace_once(detail, anchor, anchor + additions, 'DetailScreen colour imports')

          detail = replace_once(
              detail,
              '    val palette = LocalPalette.current\n',
              '    val inheritedPalette = LocalPalette.current\n',
              'DetailScreen inherited palette',
          )
          detail = replace_once(
              detail,
              '            darkTheme = palette.isDark,\n',
              '            darkTheme = inheritedPalette.isDark,\n',
              'DetailScreen accent theme',
          )

          start = detail.index('    // 影视详情页 has always coloured its own controls from the poster;')
          end = detail.index('            // A different detail route must always start at its hero.', start)
          new_block = '''    // The page background is fitted to the exact visible lower fade of the resolved hero.
    // Do not retint it for readability: ArtworkPageTheme moves only foreground semantics.
    BoxWithConstraints(Modifier.fillMaxSize()) {
        val density = LocalDensity.current
        val heroHeight =
            when (windowWidthTier(maxWidth)) {
                WindowWidthTier.Compact -> (maxHeight * 0.55f).coerceIn(360.dp, 520.dp)
                WindowWidthTier.Medium -> (maxHeight * 0.52f).coerceIn(420.dp, 600.dp)
                WindowWidthTier.Expanded -> (maxHeight * 0.50f).coerceIn(460.dp, 640.dp)
            }
        val artworkAspectRatio = maxWidth.value / heroHeight.value.coerceAtLeast(1f)
        val artworkFadeFraction =
            (HeroPageFade.value / heroHeight.value.coerceAtLeast(1f)).coerceIn(0.02f, 1f)
        val sampledPageColor =
            rememberArtworkPageColor(
                url = resolvedHeroUrl,
                targetAspectRatio = artworkAspectRatio,
                fadeFraction = artworkFadeFraction,
            )
        val retainedPageColor =
            rememberRetainedArtworkPageColor(
                "detail:${state.server?.id ?: component.serverId}:${component.itemId}",
            )
        LaunchedEffect(sampledPageColor) {
            sampledPageColor?.let(retainedPageColor::update)
        }

        ArtworkPageTheme(
            background = retainedPageColor.value,
            artworkAccent = detailAccent,
        ) {
            val palette = LocalPalette.current
            val detailSurface = retainedPageColor.value ?: palette.background
            val heroHeightPx = with(density) { heroHeight.toPx() }

            // Lift the measured caption and the primary action over the artwork. The artwork
            // itself now alpha-dissolves into detailSurface, so no third tint band is needed.
            var captionLift by remember {
                mutableStateOf(TypicalCaptionHeight + SheetGap + PlayButtonHeroOverlap)
            }

'''
          detail = detail[:start] + new_block + detail[end:]
          detail = replace_once(
              detail,
              '''            Box(
                Modifier
                    .fillMaxSize()
                    .background(detailSurface)
                    .background(ambientBrush),
            )
''',
              '''            Box(
                Modifier
                    .fillMaxSize()
                    .background(detailSurface),
            )
''',
              'DetailScreen root background',
          )
          detail = replace_once(
              detail,
              '                                    .liftOverHero(captionLift)\n                                    .background(panelBrush)\n',
              '                                    .liftOverHero(captionLift)\n',
              'DetailScreen sheet tint removal',
          )
          detail = replace_once(
              detail,
              '                                    label = if (state.playPositionTicks > 0L) "继续观看" else "播放",\n                                    detailLine = playDetailLine,\n',
              '                                    label = if (state.playPositionTicks > 0L) "继续播放" else "播放",\n                                    detailLine = playDetailLine,\n                                    resumeTimeLabel = formatResumePosition(state.playPositionTicks),\n',
              'DetailScreen resume label',
          )
          if any(token in detail for token in ('ambientBrush', 'panelBrush', 'heroSurface(', 'ArtworkAccent(')):
              raise SystemExit('DetailScreen: stale derived page-colour layer remains')
          detail_path.write_text(detail)

          # ------------------------------------------------------------------
          # Hero: remove the image alpha at the lower edge; only a top readability scrim remains.
          hero_path = Path('composeApp/src/commonMain/kotlin/com/yfuse/feature/detail/DetailHero.kt')
          hero = hero_path.read_text()
          hero = hero.replace('import com.yfuse.core.designsystem.heroPanelBrush\n', '')
          hero = hero.replace('import com.yfuse.core.designsystem.heroScrim\n', '')
          anchor = 'import com.yfuse.core.designsystem.cssLinearGradient\n'
          additions = (
              'import com.yfuse.core.designsystem.fadeIntoPage\n'
              'import com.yfuse.core.designsystem.heroTopScrim\n'
          )
          if additions not in hero:
              hero = replace_once(hero, anchor, anchor + additions, 'DetailHero fade imports')
          old_modifier = '''                        .graphicsLayer {
                            val scale =
                                1f +
                                    (Motion.DETAIL_HERO_SCALE_FROM - 1f) * (1f - entrance)
                            scaleX = scale
                            scaleY = scale
                        },
'''
          new_modifier = '''                        .graphicsLayer {
                            val scale =
                                1f +
                                    (Motion.DETAIL_HERO_SCALE_FROM - 1f) * (1f - entrance)
                            scaleX = scale
                            scaleY = scale
                        }.fadeIntoPage(),
'''
          hero = replace_once(hero, old_modifier, new_modifier, 'DetailHero artwork fade')
          hero = replace_once(
              hero,
              '                    .background(heroScrim(surfaceColor)),\n',
              '                    .background(heroTopScrim()),\n',
              'DetailHero top scrim',
          )
          hero = hero.replace(' — see the\n * `start` on [heroPanelBrush] —', ' — the lower artwork alpha itself dissolves into the page —')
          if 'heroScrim(' in hero or 'heroPanelBrush' in hero:
              raise SystemExit('DetailHero: stale detail tint helpers remain')
          hero_path.write_text(hero)

          # ------------------------------------------------------------------
          # Primary play key: resume timestamp is its own right-aligned datum, immediately
          # before the chevron, instead of being lost in the secondary detail line.
          actions_path = Path('composeApp/src/commonMain/kotlin/com/yfuse/feature/detail/DetailActions.kt')
          actions = actions_path.read_text()
          signature = '''    detailLine: String?,
    resolving: Boolean,
'''
          actions = replace_once(
              actions,
              signature,
              '''    detailLine: String?,
    /** Resume position rendered immediately to the left of the navigation chevron. */
    resumeTimeLabel: String?,
    resolving: Boolean,
''',
              'DetailActionDock resume parameter',
          )
          chevron = '''                Icon(
                    AppIcons.ChevronRight,
                    contentDescription = null,
                    tint = Color.White.copy(alpha = 0.72f),
                    modifier = Modifier.size(14.dp),
                )
'''
          replacement = '''                resumeTimeLabel?.let { resumeTime ->
                    Text(
                        resumeTime,
                        style = AppTypography.caption.strong,
                        color = Color.White.copy(alpha = 0.94f),
                        maxLines = 1,
                        modifier = Modifier.padding(start = 8.dp, end = 5.dp),
                    )
                }
                Icon(
                    AppIcons.ChevronRight,
                    contentDescription = null,
                    tint = Color.White.copy(alpha = 0.78f),
                    modifier = Modifier.size(14.dp),
                )
'''
          actions = replace_once(actions, chevron, replacement, 'DetailActionDock resume placement')
          formatter_anchor = '@Composable\ninternal fun DetailActionDock(\n'
          formatter = '''private const val EmbyTicksPerSecond = 10_000_000L

internal fun formatResumePosition(playPositionTicks: Long): String? {
    if (playPositionTicks <= 0L) return null
    val totalSeconds = playPositionTicks / EmbyTicksPerSecond
    val hours = totalSeconds / 3_600L
    val minutes = (totalSeconds % 3_600L) / 60L
    val seconds = totalSeconds % 60L
    return if (hours > 0L) {
        "$hours:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}"
    } else {
        "${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}"
    }
}

@Composable
internal fun DetailActionDock(
'''
          actions = replace_once(actions, formatter_anchor, formatter, 'DetailActions formatter')
          actions_path.write_text(actions)

          # ------------------------------------------------------------------
          # TMDB information detail: same real sampling/dissolve contract, no hard-coded white
          # page or blue-white glass surfaces.
          tmdb_path = Path('composeApp/src/commonMain/kotlin/com/yfuse/feature/home/TmdbInfoScreen.kt')
          tmdb = tmdb_path.read_text()
          tmdb = tmdb.replace('import androidx.compose.ui.platform.LocalDensity\n', '')
          tmdb = tmdb.replace('import com.yfuse.core.designsystem.heroPanelBrush\n', '')
          tmdb = tmdb.replace('import com.yfuse.core.designsystem.heroScrim\n', '')
          tmdb = tmdb.replace('import com.yfuse.core.designsystem.heroSurface\n', '')
          tmdb = tmdb.replace('import com.yfuse.core.designsystem.rememberAnimatedDominantColor\n', '')
          tmdb = replace_once(
              tmdb,
              'import androidx.compose.runtime.Composable\n',
              'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.LaunchedEffect\n',
              'TmdbInfo LaunchedEffect import',
          )
          tmdb = replace_once(
              tmdb,
              'import androidx.compose.runtime.getValue\nimport androidx.compose.runtime.remember\n',
              'import androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\n',
              'TmdbInfo state imports',
          )
          anchor = 'import com.yfuse.core.designsystem.AppTypography\n'
          additions = (
              'import com.yfuse.core.designsystem.ArtworkPageTheme\n'
          )
          if additions not in tmdb:
              tmdb = replace_once(tmdb, anchor, anchor + additions, 'TmdbInfo theme import')
          anchor = 'import com.yfuse.core.designsystem.GlassShapes\n'
          additions = 'import com.yfuse.core.designsystem.HeroPageFade\n'
          if additions not in tmdb:
              tmdb = replace_once(tmdb, anchor, anchor + additions, 'TmdbInfo fade token import')
          anchor = 'import com.yfuse.core.designsystem.liftOverHero\n'
          additions = (
              'import com.yfuse.core.designsystem.fadeIntoPage\n'
              'import com.yfuse.core.designsystem.heroTopScrim\n'
          )
          if additions not in tmdb:
              tmdb = replace_once(tmdb, anchor, additions + anchor, 'TmdbInfo fade helpers')
          anchor = 'import com.yfuse.core.designsystem.pressable\n'
          additions = (
              'import com.yfuse.core.designsystem.rememberAnimatedArtworkAccent\n'
              'import com.yfuse.core.designsystem.rememberArtworkPageColor\n'
              'import com.yfuse.core.designsystem.rememberRetainedArtworkPageColor\n'
          )
          if additions not in tmdb:
              tmdb = replace_once(tmdb, anchor, anchor + additions, 'TmdbInfo colour helpers')

          old_intro = '''    val palette = LocalPalette.current
    val themeAccent = LocalAccentColors.current.accent
    // image.tmdb.org is the primary CDN and media.themoviedb.org the official mirror for
    // when it is unreachable; the dominant-colour probe follows whichever one is showing.
'''
          tmdb = replace_once(
              tmdb,
              old_intro,
              '''    val inheritedPalette = LocalPalette.current
    // image.tmdb.org is the primary CDN and media.themoviedb.org the official mirror for
    // when it is unreachable; sampling follows the image FallbackImage actually resolved.
''',
              'TmdbInfo inherited palette',
          )
          old_accent = '''    val heroUrl = heroUrls.firstOrNull { it != null }
    val accent =
        rememberAnimatedDominantColor(
            heroUrl,
            Brand.Primary, // design-system: brand-identity
        )

'''
          tmdb = replace_once(
              tmdb,
              old_accent,
              '''    val heroUrl = heroUrls.firstOrNull { it != null }
    var resolvedHeroUrl by remember(item.id) { mutableStateOf<String?>(null) }
    val accent =
        rememberAnimatedArtworkAccent(
            url = resolvedHeroUrl ?: heroUrl,
            fallback = Brand.Primary, // design-system: brand-identity
            darkTheme = inheritedPalette.isDark,
            identity = item.id,
        )

''',
              'TmdbInfo artwork accent',
          )
          old_box_prefix = '''    BoxWithConstraints(Modifier.fillMaxSize()) {
        val heroHeight = maxHeight * 0.34f
        val density = LocalDensity.current
        val detailSurface =
            remember(accent, palette.isDark) {
                heroSurface(accent, palette.isDark)
            }
        val panelBrush =
            remember(detailSurface, density) {
                heroPanelBrush(detailSurface, density, height = 220.dp)
            }
        val listState = rememberLazyListState()
        val lightPageReached by rememberScrolledPastHero(listState, heroHeight)
        StatusBarIconStyle(darkIcons = lightPageReached)
        Box(
            Modifier
                .fillMaxSize()
                .background(if (palette.isDark) palette.background else Color.White),
        )

'''
          new_box_prefix = '''    BoxWithConstraints(Modifier.fillMaxSize()) {
        val heroHeight = maxHeight * 0.34f
        val artworkAspectRatio = maxWidth.value / heroHeight.value.coerceAtLeast(1f)
        val artworkFadeFraction =
            (HeroPageFade.value / heroHeight.value.coerceAtLeast(1f)).coerceIn(0.02f, 1f)
        val sampledPageColor =
            rememberArtworkPageColor(
                url = resolvedHeroUrl,
                targetAspectRatio = artworkAspectRatio,
                fadeFraction = artworkFadeFraction,
            )
        val retainedPageColor = rememberRetainedArtworkPageColor("tmdb-detail:${item.id}")
        LaunchedEffect(sampledPageColor) {
            sampledPageColor?.let(retainedPageColor::update)
        }

        ArtworkPageTheme(
            background = retainedPageColor.value,
            artworkAccent = accent,
        ) {
            val palette = LocalPalette.current
            val themeAccent = LocalAccentColors.current.accent
            val pageColor = retainedPageColor.value ?: palette.background
            val listState = rememberLazyListState()
            val lightPageReached by rememberScrolledPastHero(listState, heroHeight)
            StatusBarIconStyle(darkIcons = lightPageReached && !palette.isDark)
            Box(
                Modifier
                    .fillMaxSize()
                    .background(pageColor),
            )

'''
          tmdb = replace_once(tmdb, old_box_prefix, new_box_prefix, 'TmdbInfo page theme')

          # Indent the existing LazyColumn one level because it now lives inside ArtworkPageTheme.
          lazy_start = tmdb.index('\n        LazyColumn(')
          function_tail = '\n    }\n}\n\n@Composable\nprivate fun TmdbSourceStrip'
          lazy_end = tmdb.index(function_tail, lazy_start)
          lazy_segment = tmdb[lazy_start:lazy_end]
          indented = '\n'.join(('    ' + line if line else line) for line in lazy_segment.split('\n'))
          tmdb = tmdb[:lazy_start] + indented + '\n        }' + tmdb[lazy_end:]

          tmdb = replace_once(
              tmdb,
              '''                        urls = heroUrls,
                        contentDescription = item.title,
                        modifier = Modifier.fillMaxSize(),
''',
              '''                        urls = heroUrls,
                        contentDescription = item.title,
                        onResolvedUrl = { resolvedHeroUrl = it },
                        modifier = Modifier.fillMaxSize().fadeIntoPage(),
''',
              'TmdbInfo hero resolved/fade',
          )
          tmdb = replace_once(
              tmdb,
              '                    Box(Modifier.fillMaxSize().background(heroScrim(detailSurface)))\n',
              '                    Box(Modifier.fillMaxSize().background(heroTopScrim()))\n',
              'TmdbInfo top scrim',
          )
          tmdb = tmdb.replace('                        .background(panelBrush)\n', '')
          tmdb = regex_once(
              tmdb,
              r'''                                fill =\n                                    if \(palette\.isDark\) \{\n                                        palette\.glassStrong\n                                    \} else \{\n                                        Color\(0xFFEAF0FA\)\.copy\(alpha = 0\.82f\)\n                                    \},\n                                border =\n                                    if \(palette\.isDark\) \{\n                                        palette\.border\n                                    \} else \{\n                                        Color\.White\.copy\(alpha = 0\.94f\)\n                                    \},''',
              '''                                fill = palette.card2,
                                border = palette.border,''',
              'TmdbInfo summary glass',
          )
          tmdb = replace_once(
              tmdb,
              '.border(2.dp, Color.White, GlassShapes.poster),\n',
              '.border(2.dp, palette.border, GlassShapes.poster),\n',
              'TmdbInfo poster border',
          )
          tmdb = replace_once(
              tmdb,
              '''                                                    .border(
                                                        1.dp,
                                                        Color.White.copy(alpha = 0.88f),
                                                        CircleShape,
                                                    ),
''',
              '''                                                    .border(
                                                        1.dp,
                                                        palette.border,
                                                        CircleShape,
                                                    ),
''',
              'TmdbInfo cast border',
          )
          tmdb = regex_once(
              tmdb,
              r'''                        fill =\n                            if \(palette\.isDark\) \{\n                                Color\.White\.copy\(alpha = 0\.07f\)\n                            \} else \{\n                                Color\(0xFFEFF3FA\)\.copy\(alpha = 0\.72f\)\n                            \},\n                        border =\n                            if \(palette\.isDark\) \{\n                                Color\.White\.copy\(alpha = 0\.20f\)\n                            \} else \{\n                                Color\(0xFFD7DDE9\)\n                            \},''',
              '''                        fill = palette.card2,
                        border = palette.border,''',
              'TmdbInfo source glass',
          )
          tmdb = regex_once(
              tmdb,
              r'''                fill =\n                    if \(palette\.isDark\) \{\n                        Color\.White\.copy\(alpha = 0\.08f\)\n                    \} else \{\n                        Color\.White\.copy\(alpha = 0\.72f\)\n                    \},\n                border = if \(palette\.isDark\) palette\.border else Color\.White\.copy\(alpha = 0\.96f\),''',
              '''                fill = palette.card2,
                border = palette.border,''',
              'TmdbInfo play dock glass',
          )
          if any(token in tmdb for token in ('heroSurface(', 'heroPanelBrush(', 'heroScrim(', 'rememberAnimatedDominantColor(', 'Color(0xFFEAF0FA)', 'Color(0xFFEFF3FA)', 'Color(0xFFD7DDE9)')):
              raise SystemExit('TmdbInfoScreen: stale light/derived surface remains')
          tmdb_path.write_text(tmdb)

          # Formatter behavior is pure and gets a focused regression test.
          test_path = Path('composeApp/src/commonTest/kotlin/com/yfuse/feature/detail/DetailActionFormattingTest.kt')
          test_path.write_text('''package com.yfuse.feature.detail

import kotlin.test.Test
import kotlin.test.assertEquals
import kotlin.test.assertNull

class DetailActionFormattingTest {
    @Test
    fun noProgress_hasNoResumeLabel() {
        assertNull(formatResumePosition(0L))
    }

    @Test
    fun subHourProgress_usesMinuteSecondClock() {
        assertEquals("20:01", formatResumePosition(1_201L * 10_000_000L))
    }

    @Test
    fun hourProgress_usesHourMinuteSecondClock() {
        assertEquals("1:02:03", formatResumePosition(3_723L * 10_000_000L))
    }
}
''')
          PY

          git diff --check
          grep -q 'resumeTimeLabel = formatResumePosition(state.playPositionTicks)' composeApp/src/commonMain/kotlin/com/yfuse/feature/detail/DetailScreen.kt
          grep -q 'modifier = Modifier.fillMaxSize().fadeIntoPage()' composeApp/src/commonMain/kotlin/com/yfuse/feature/home/TmdbInfoScreen.kt
          grep -q 'rememberRetainedArtworkPageColor("tmdb-detail:' composeApp/src/commonMain/kotlin/com/yfuse/feature/home/TmdbInfoScreen.kt
          grep -q 'rememberArtworkPageColor' composeApp/src/commonMain/kotlin/com/yfuse/feature/detail/DetailScreen.kt
          grep -q 'fadeIntoPage()' composeApp/src/commonMain/kotlin/com/yfuse/feature/detail/DetailHero.kt

          rm .github/workflows/patch-detail-artwork-transition.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): unify detail artwork transition and resume time'
          git push origin HEAD:codex/detail-artwork-transition-20260822
