name: Four-hour paired playback background and screen-off activity study
'on':
  push:
    branches:
    - codex/two-engines-cloud-seek-20261113
    paths:
    - .github/workflows/qa-power-long.yml
permissions:
  contents: read
  actions: read
jobs:
  acquire-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Acquire built diagnostic baseline and retain known qualification failures
      env:
        API_TOKEN: ${{ github.token }}
      run: bash qa-power-ui/acquire-baseline.sh 43853752670 eff812329895ae01f7545677110ff12af96de37e
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: power-long-before-input
        path: 'preview/composeApp-release.apk

          preview/provenance.txt

          preview/apk.sha256

          preview/baseline-build-run.json

          preview/baseline-build-jobs.json

          preview/baseline-limit.txt'
        retention-days: 10
  before:
    name: before four-hour ${{ matrix.engine }}
    needs: acquire-before
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 310
    strategy:
      fail-fast: false
      matrix:
        engine:
        - YCore
        - SenPlayer
    env:
      QA_ENGINE: ${{ matrix.engine }}
      QA_EXPECT_QUIET_DIAGNOSTICS: 'false'
      QA_POWER_LONG: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: power-long-before-input
        path: preview
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: arm-input-driver
        path: qa-driver
        run-id: 43838817605
        github-token: ${{ github.token }}
    - name: Verify runtime and prepare evidence tools
      run: 'set -euo pipefail

        mkdir -p results

        # apk.sha256 may also name unrelated build inputs; verify this exact app entry.

        (cd preview && grep ''composeApp-release.apk$'' apk.sha256 | sha256sum -c
        -)

        grep -Fx "app=eff812329895ae01f7545677110ff12af96de37e" preview/provenance.txt

        cp preview/provenance.txt preview/apk.sha256 preview/baseline-build-*.json
        preview/baseline-limit.txt results/

        printf ''qa=%s\nrun=%s\n'' "$GITHUB_SHA" "$GITHUB_RUN_ID" > results/qa-provenance.txt

        sudo apt-get update -qq

        sudo apt-get install -y ffmpeg python3-pil

        '
    - name: Boot disposable cloud ARM64 Android
      run: bash qa-arm-dual/redroid.sh
    - name: Install exact candidate and UI evidence driver
      run: 'set -euo pipefail

        test "$GITHUB_ACTIONS" = true

        adb install -r -g preview/composeApp-release.apk

        adb install -r qa-driver/driver.apk

        adb shell wm size 720x1280

        adb shell wm density 260

        adb shell settings put secure immersive_mode_confirmations confirmed

        adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000

        adb shell wm dismiss-keyguard

        touch /tmp/yfuse-tree-active

        adb shell getprop > results/guest-properties.txt

        docker inspect qa-android --format ''{{.Image}}'' > results/cloud-image.txt

        '
    - name: Observe actual diagnostic work while paused and backgrounded
      run: /usr/bin/python3 qa-power-ui/background.py
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: power-long-before-${{ matrix.engine }}
        path: results/
        retention-days: 14
  acquire-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Acquire built diagnostic baseline and retain known qualification failures
      env:
        API_TOKEN: ${{ github.token }}
      run: bash qa-power-ui/acquire-baseline.sh 43861139887 4dd8f0bae04125bd15497ec0e6d58ca4fda742f3
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: power-long-after-input
        path: 'preview/composeApp-release.apk

          preview/provenance.txt

          preview/apk.sha256

          preview/baseline-build-run.json

          preview/baseline-build-jobs.json

          preview/baseline-limit.txt'
        retention-days: 10
  after:
    name: after four-hour ${{ matrix.engine }}
    needs: acquire-after
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 310
    strategy:
      fail-fast: false
      matrix:
        engine:
        - YCore
        - SenPlayer
    env:
      QA_ENGINE: ${{ matrix.engine }}
      QA_EXPECT_QUIET_DIAGNOSTICS: 'true'
      QA_POWER_LONG: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: power-long-after-input
        path: preview
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: arm-input-driver
        path: qa-driver
        run-id: 43838817605
        github-token: ${{ github.token }}
    - name: Verify runtime and prepare evidence tools
      run: 'set -euo pipefail

        mkdir -p results

        # apk.sha256 may also name unrelated build inputs; verify this exact app entry.

        (cd preview && grep ''composeApp-release.apk$'' apk.sha256 | sha256sum -c
        -)

        grep -Fx "app=4dd8f0bae04125bd15497ec0e6d58ca4fda742f3" preview/provenance.txt

        cp preview/provenance.txt preview/apk.sha256 preview/baseline-build-*.json
        preview/baseline-limit.txt results/

        printf ''qa=%s\nrun=%s\n'' "$GITHUB_SHA" "$GITHUB_RUN_ID" > results/qa-provenance.txt

        sudo apt-get update -qq

        sudo apt-get install -y ffmpeg python3-pil

        '
    - name: Boot disposable cloud ARM64 Android
      run: bash qa-arm-dual/redroid.sh
    - name: Install exact candidate and UI evidence driver
      run: 'set -euo pipefail

        test "$GITHUB_ACTIONS" = true

        adb install -r -g preview/composeApp-release.apk

        adb install -r qa-driver/driver.apk

        adb shell wm size 720x1280

        adb shell wm density 260

        adb shell settings put secure immersive_mode_confirmations confirmed

        adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000

        adb shell wm dismiss-keyguard

        touch /tmp/yfuse-tree-active

        adb shell getprop > results/guest-properties.txt

        docker inspect qa-android --format ''{{.Image}}'' > results/cloud-image.txt

        '
    - name: Observe actual diagnostic work while paused and backgrounded
      run: /usr/bin/python3 qa-power-ui/background.py
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: power-long-after-${{ matrix.engine }}
        path: results/
        retention-days: 14
