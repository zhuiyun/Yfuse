name: Sign Android branch artifact

on:
  push:
    branches:
      - codex/merge-all-sign-20260815
      - codex/android-tv-p0-20260830
      - codex/ycore-sign-20260830
      - codex/glass-navigation-sign-20260905
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
    paths:
      - .github/sign-android-request
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: android-merged-sign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign:
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'codex/merge-all-sign-20260815' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    name: Compile, sign, and verify APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      EXPECTED_ANDROID_CERT_SHA256: 373e36d363965b6c1ae0a68c3db9537831d137ea6c38f094608bf243e7be3e84

    steps:
      - name: Publish workflow start
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "Signing run $GITHUB_RUN_ID is in progress" \
            '{state: "pending", target_url: $target_url, description: $description, context: "yfuse/signed-apk"}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" \
            "platforms;android-36" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Download player engines
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          mkdir -p composeApp/libs
          gh release download native-mpv-b955aa2-yfuse-dolby1-arm64-20260824 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern libmpv-release.aar \
            --dir composeApp/libs \
            --clobber
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
          test -f composeApp/libs/libmpv-release.aar
          test -f composeApp/libs/mdk-sdk/lib/cmake/FindMDK.cmake

      # The Full package carries libmpv and MDK for compatibility and only the isolated GPU
      # companion from YCore, built from the checked-out sources exactly as the quality gates
      # build it, so the signed artifact and the gated one are the same package.
      - name: Build and install current YCore GPU companion
        shell: bash
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/ycore-gpu-companion"
          bash scripts/build-ycore-gpu-companion.sh "$artifacts"
          install -m 0644 "$artifacts/ycore-gpu.aar" composeApp/libs/ycore-gpu.aar
          install -m 0644 "$artifacts/ycore-gpu.aar.sha256" composeApp/libs/ycore-gpu.aar.sha256
          install -m 0644 "$artifacts/NATIVE-SOURCES.txt" composeApp/libs/ycore-gpu.sources.txt

      - name: Configure production signing
        shell: bash
        run: |
          set -euo pipefail
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production secret: $name"
              exit 1
            fi
          done
          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/yfuse-release.jks
          chmod 600 signing/yfuse-release.jks
          {
            printf 'storeFile=signing/yfuse-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
          printf 'tmdb.token=%s\n' "$TMDB_TOKEN" > local.properties
          chmod 600 local.properties

      - name: Verify configured certificate
        shell: bash
        run: |
          set -euo pipefail
          configured_cert="$(
            keytool -list -v \
              -keystore signing/yfuse-release.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              head -n 1 |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"
          expected_cert="$(tr -d ':[:space:]' <<<"$EXPECTED_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$configured_cert" || "$configured_cert" != "$expected_cert" ]]; then
            echo "::error::Production signing certificate does not match the pinned certificate"
            exit 1
          fi

      - name: Check source hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :composeApp:testDebugUnitTest \
            :watchTogetherProtocol:jvmTest \
            :watchTogetherServer:test \
            --no-daemon

      - name: Resolve signed build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          request=".github/sign-android-request"
          source_file="$request"
          if [[ ! -f "$source_file" ]]; then
            source_file="version.properties"
          fi
          version_code="$(awk -F= '$1 == "version_code" || $1 == "VERSION_CODE" { print $2 }' "$source_file")"
          version_name="$(awk -F= '$1 == "version_name" || $1 == "VERSION_NAME" { print $2 }' "$source_file")"
          [[ "$version_code" =~ ^[0-9]+$ ]]
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      # The normal Full package: a native-only release has no MPV/Exo fallback and the build
      # script refuses to sign one as a release.
      # Match the existing production publish-android.yml confirmation for this same SDK.
      - name: Build signed release APK
        run: |
          ./gradlew :composeApp:assembleRelease \
            -PyfuseVersionCode=${{ steps.version.outputs.version_code }} \
            -PyfuseVersionName=${{ steps.version.outputs.version_name }} \
            -PconfirmMdkDistributionRights=true \
            --no-daemon

      - name: Verify and stage signed APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="composeApp/build/outputs/apk/release/composeApp-release.apk"
          metadata="composeApp/build/outputs/apk/release/output-metadata.json"
          test -s "$apk"
          test -s "$metadata"
          entries="$(mktemp)"
          unzip -Z1 "$apk" > "$entries"
          for required in libavcodec.so libavformat.so libmpv.so libmdk.so libycore_gpu.so; do
            if ! grep -Fxq "lib/arm64-v8a/$required" "$entries"; then
              echo "::error::Full package is missing lib/arm64-v8a/$required"
              exit 1
            fi
          done

          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          aapt="$build_tools/aapt"
          test -x "$apksigner"
          test -x "$zipalign"
          test -x "$aapt"

          signer_output="$("$apksigner" verify --verbose --print-certs "$apk")"
          "$zipalign" -c -v 4 "$apk"
          badging="$("$aapt" dump badging "$apk")"
          expected_cert="$(tr -d ':[:space:]' <<<"$EXPECTED_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          normalized_signer_output="$(tr -d ':[:space:]' <<<"$signer_output" | tr '[:upper:]' '[:lower:]')"
          if [[ "$normalized_signer_output" != *"$expected_cert"* ]]; then
            echo "::error::APK signing certificate mismatch"
            printf '%s\n' "$signer_output"
            exit 1
          fi
          actual_cert="$expected_cert"
          grep -Fq "package: name='com.yfuse'" <<<"$badging"

          version_code="$(jq -r '.elements[0].versionCode' "$metadata")"
          version_name="$(jq -r '.elements[0].versionName' "$metadata")"
          grep -Fq "versionCode='$version_code'" <<<"$badging"
          grep -Fq "versionName='$version_name'" <<<"$badging"

          receiver_id="$(awk -F= '$1 == "yfuseCastReceiverApplicationId" { print $2 }' gradle.properties)"
          [[ "$receiver_id" == "E9107559" ]]
          dex_dir="$(mktemp -d)"
          unzip -qq "$apk" 'classes*.dex' -d "$dex_dir"
          if ! strings "$dex_dir"/classes*.dex | grep -F "$receiver_id" >/dev/null; then
            echo "::error::Signed APK does not contain the configured Cast receiver application ID"
            exit 1
          fi

          file_name="Yfuse-${version_code}-${version_name}-signed.apk"
          mkdir -p build/signed-artifact
          cp "$apk" "build/signed-artifact/$file_name"
          sha256sum "build/signed-artifact/$file_name" > build/signed-artifact/SHA256SUMS
          jq -n \
            --arg packageName com.yfuse \
            --arg versionCode "$version_code" \
            --arg versionName "$version_name" \
            --arg certificateSha256 "$actual_cert" \
            --arg commit "$GITHUB_SHA" \
            '{packageName: $packageName, versionCode: $versionCode, versionName: $versionName, certificateSha256: $certificateSha256, commit: $commit, runtime: "full"}' \
            > build/signed-artifact/build-info.json
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yfuse-signed-${{ github.sha }}
          path: build/signed-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Publish workflow result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            description="Signed APK uploaded by run $GITHUB_RUN_ID"
          else
            state=failure
            description="Signing run $GITHUB_RUN_ID failed"
          fi
          payload="$(jq -n \
            --arg state "$state" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg description "$description" \
            '{state: $state, target_url: $target_url, description: $description, context: "yfuse/signed-apk"}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
