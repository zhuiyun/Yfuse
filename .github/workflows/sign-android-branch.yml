name: Sign Android branch artifact

on:
  push:
    branches:
      - codex/ycore-sign-20260830
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-merged-sign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Signing paused for project review
        run: echo 'Signing paused at user request while project review is in progress.'
