name: Repackage current master signed APK

on:
  push:
    branches:
      - codex/ycore-sign-20260830
    paths:
      - .github/workflows/repackage-android-signed.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: android-repackage-current-master
  cancel-in-progress: true

jobs:
  repackage:
    name: Build, sign, and verify current master APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      EXPECTED_ANDROID_CERT_SHA256: 373e36d363965b6c1ae0a68c3db9537831d137ea6c38f094608bf243e7be3e84
      SOURCE_SHA: fbdd4c94443b53e4b89e2439d4273764d403f325
      VERSION_CODE: "190"
      VERSION_NAME: "1.0.28"

    steps:
      - name: Check out exact master source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --check

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" \
            "platforms;android-36" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Install host native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake binutils build-essential cmake curl git gperf libtool \
            ninja-build pkg-config python3 python3-venv unzip wget yasm
          python3 -m venv "$RUNNER_TEMP/yfuse-meson"
          "$RUNNER_TEMP/yfuse-meson/bin/pip" install --disable-pip-version-check \
            "Jinja2==3.1.6" "meson==1.6.1"
          echo "$RUNNER_TEMP/yfuse-meson/bin" >> "$GITHUB_PATH"

      - name: Download player engines
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          mkdir -p composeApp/libs
          gh release download native-mpv-b955aa2-yfuse-dolby1-arm64-20260824 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern libmpv-release.aar \
            --dir composeApp/libs \
            --clobber
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
          test -s composeApp/libs/libmpv-release.aar
          test -f composeApp/libs/mdk-sdk/lib/cmake/FindMDK.cmake

      - name: Build and install source-matched standalone YCore runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-ycore-native.sh --arch arm64
          bash scripts/install-ycore-native.sh .native-build/artifacts

      - name: Configure production signing
        shell: bash
        run: |
          set -euo pipefail
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production secret: $name"
              exit 1
            fi
          done
          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/yfuse-release.jks
          chmod 600 signing/yfuse-release.jks
          {
            printf 'storeFile=signing/yfuse-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties
          printf 'tmdb.token=%s\n' "$TMDB_TOKEN" > local.properties
          chmod 600 local.properties

      - name: Verify configured certificate
        shell: bash
        run: |
          set -euo pipefail
          configured_cert="$(
            keytool -list -v \
              -keystore signing/yfuse-release.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              head -n 1 |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"
          expected_cert="$(tr -d ':[:space:]' <<<"$EXPECTED_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          test -n "$configured_cert"
          test "$configured_cert" = "$expected_cert"

      - name: Build production signed release APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :composeApp:assembleRelease \
            -PyfuseVersionCode="$VERSION_CODE" \
            -PyfuseVersionName="$VERSION_NAME" \
            -PyfuseNativeOnlyRuntime=true \
            -PconfirmNativeOnlyRelease=true \
            --no-daemon

      - name: Verify and stage signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk="composeApp/build/outputs/apk/release/composeApp-release.apk"
          metadata="composeApp/build/outputs/apk/release/output-metadata.json"
          test -s "$apk"
          test -s "$metadata"
          bash scripts/verify-ycore-native-apk.sh "$apk"

          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          zipalign="$build_tools/zipalign"
          aapt="$build_tools/aapt"
          test -x "$apksigner"
          test -x "$zipalign"
          test -x "$aapt"

          signer_output="$("$apksigner" verify --verbose --print-certs "$apk")"
          "$zipalign" -c -v 4 "$apk"
          badging="$("$aapt" dump badging "$apk")"
          expected_cert="$(tr -d ':[:space:]' <<<"$EXPECTED_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          normalized_signer_output="$(tr -d ':[:space:]' <<<"$signer_output" | tr '[:upper:]' '[:lower:]')"
          [[ "$normalized_signer_output" == *"$expected_cert"* ]]
          grep -Fq "package: name='com.yfuse'" <<<"$badging"
          grep -Fq "versionCode='$VERSION_CODE'" <<<"$badging"
          grep -Fq "versionName='$VERSION_NAME'" <<<"$badging"

          receiver_id="$(awk -F= '$1 == "yfuseCastReceiverApplicationId" { print $2 }' gradle.properties)"
          [[ "$receiver_id" == "E9107559" ]]
          dex_dir="$(mktemp -d)"
          unzip -qq "$apk" 'classes*.dex' -d "$dex_dir"
          strings "$dex_dir"/classes*.dex | grep -F "$receiver_id" >/dev/null

          file_name="Yfuse-${VERSION_CODE}-${VERSION_NAME}-system-ycore-signed.apk"
          mkdir -p build/signed-artifact
          cp "$apk" "build/signed-artifact/$file_name"
          sha256sum "build/signed-artifact/$file_name" > build/signed-artifact/SHA256SUMS
          jq -n \
            --arg packageName com.yfuse \
            --arg versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg certificateSha256 "$expected_cert" \
            --arg sourceCommit "$SOURCE_SHA" \
            '{packageName: $packageName, versionCode: $versionCode, versionName: $versionName, certificateSha256: $certificateSha256, sourceCommit: $sourceCommit, runtime: "system-ycore"}' \
            > build/signed-artifact/build-info.json

          base64 --wrap=0 "build/signed-artifact/$file_name" |
            split --bytes=700000 --numeric-suffixes=0 --suffix-length=3 - \
              "build/signed-artifact/${file_name}.b64.part-"

      - name: Publish signed build asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-v${VERSION_NAME}-${SOURCE_SHA:0:8}"
          notes="Production-signed Android build from merged master commit ${SOURCE_SHA}. This is a packaged prerelease artifact, not an in-app update publication."
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Yfuse ${VERSION_NAME} signed build" \
            --notes "$notes" \
            --prerelease \
            build/signed-artifact/*
