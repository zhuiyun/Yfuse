name: Verify predictive back migration

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/predictive-back-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Let PlayerActivity use system predictive back
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('composeApp/src/androidMain/kotlin/com/yfuse/feature/player/PlayerActivity.kt')
          text = path.read_text()
          import_line = 'import androidx.activity.compose.BackHandler\n'
          handler_line = '    BackHandler(onBack = onBack)\n'
          if text.count(import_line) != 1:
              raise SystemExit(f'expected exactly one BackHandler import, found {text.count(import_line)}')
          if text.count(handler_line) != 1:
              raise SystemExit(f'expected exactly one PlayerRoot BackHandler, found {text.count(handler_line)}')
          text = text.replace(import_line, '', 1).replace(handler_line, '', 1)
          path.write_text(text)
          PY

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
          test -f composeApp/libs/libmpv-release.aar
          test -f composeApp/libs/mdk-sdk/lib/cmake/FindMDK.cmake

      - name: Configure app services
        shell: bash
        run: |
          set -euo pipefail
          printf 'tmdb.token=%s\n' "$TMDB_TOKEN" > local.properties

      - name: Compile Android app
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Commit verified player migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add composeApp/src/androidMain/kotlin/com/yfuse/feature/player/PlayerActivity.kt
          git diff --cached --check
          git commit -m 'fix: enable system predictive back in player'
          git push origin HEAD:master
