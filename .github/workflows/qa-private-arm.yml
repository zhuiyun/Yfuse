name: Uncapped film and series source sample on both ARM64 cloud engines
on:
  push:
    branches: [codex/cloud-playback-resilience-20261113]
    paths:
      - '.github/workflows/qa-private-arm.yml'
      - 'qa-private-arm/**'
permissions:
  contents: read
  actions: read
jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Build network and gesture recorder
        run: |
          mkdir qa-private-driver
          sed 's|adb install -r driver.apk|cp driver.apk "$GITHUB_WORKSPACE/qa-private-driver/driver.apk"|' qa-source-trace/build-driver.sh > "$RUNNER_TEMP/driver.sh"
          bash "$RUNNER_TEMP/driver.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: private-input-driver, path: qa-private-driver/, retention-days: 5}
  private_source:
    needs: driver
    name: Film and episode sample shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {shard: [0]}
    env:
      QA_SHARD: ${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Prepare one-use decryption key and emulator
        run: |
          set -euo pipefail
          umask 077
          mkdir -p private-key private-results preview
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/qa-private.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/qa-private.pem" -pubout -out private-key/public.pem
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil python3-cryptography ffmpeg
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: private-input-driver, path: driver}
      - name: Boot native ARM64 emulator before issuing short-lived media locations
        run: bash qa-arm-dual/redroid.sh
      - name: Publish only the public half of this runner's key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm-sourcekey-${{ github.run_id }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: private-key/public.pem
          retention-days: 1
      - name: Verify the same preview and wait for its encrypted film locations
        env: {API_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          curl -fsSL -H "Authorization: Bearer $API_TOKEN" "$api/actions/artifacts/14017387211/zip" > "$RUNNER_TEMP/preview.zip"
          unzip -q "$RUNNER_TEMP/preview.zip" -d preview
          (cd preview && sha256sum -c apk.sha256)
          grep -F bb06bdfa1718a7dcecb58ba727cf9c9bb3f2d86e preview/source.txt
          for i in $(seq 1 500); do
            http=$(curl -sSL -o "$RUNNER_TEMP/envelope.json" -w '%{http_code}' -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/vnd.github.raw+json' "$api/contents/qa-private-arm-input/$GITHUB_RUN_ID-$QA_SHARD-$GITHUB_RUN_ATTEMPT.json?ref=codex%2Fcloud-playback-resilience-20261113")
            if [[ "$http" = 200 ]]; then break; fi
            sleep 4
          done
          test "$http" = 200
          chmod 600 "$RUNNER_TEMP/envelope.json"
      - name: Verify direct reads and attempt real playback through each original engine
        run: |
          test "$GITHUB_ACTIONS" = true
          echo 'b31fe854c9c7b7b765241429055cbc9278a68482d57e50167c5f8699703ce730  preview/composeApp-release.apk' | sha256sum -c
          adb root || true
          adb wait-for-device
          adb install -r -g preview/composeApp-release.apk
          adb install -r driver/driver.apk
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000
          adb shell wm dismiss-keyguard
          touch /tmp/yfuse-tree-active
          /usr/bin/python3 qa-private-arm/test.py
      - name: Retain numeric playback measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm-source-results-${{ github.run_id }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: private-results
          retention-days: 7
