name: Recheck external video recovery repair on exact TS and MP4 failing sequences
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: ['.github/workflows/qa-integrated-first-failure.yml']
permissions: {contents: read, actions: read}
jobs:
  build:
    name: Acquire the qualified identical release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Wait for unit and actual ARM64 qualification
        env: {API_TOKEN: "${{ github.token }}"}
        run: bash qa-integrated/acquire-qualified-candidate.sh 43837990618 01c516e080448587d5225342ccd4aff94a6fed85
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: candidate-test-input, path: preview, retention-days: 7}
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Build diagnostic instrumentation
        run: |
          mkdir qa-driver
          cp qa-arm-matrix/Driver.java qa-volume/input-driver.java
          sed 's|adb install -r driver.apk|cp driver.apk "$GITHUB_WORKSPACE/qa-driver/driver.apk"|' qa-volume/build-driver.sh > "$RUNNER_TEMP/build-qa.sh"
          bash "$RUNNER_TEMP/build-qa.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: first-failure-driver, path: qa-driver/, retention-days: 5}
  diagnose:
    needs: [driver,build]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {lane: 0, title: 45, seed: 12013863, batches: 2, direct: 'false'}
          - {lane: 1, title: 45, seed: 12013863, batches: 2, direct: 'true'}
          - {lane: 2, title: 72, seed: 12004071, batches: 1, direct: 'false'}
          - {lane: 3, title: 72, seed: 12004071, batches: 1, direct: 'true'}
    name: Transport stress lane ${{ matrix.lane }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    env:
      QA_ENGINE: YCore
      QA_SHARD: '13'
      QA_SESSIONS: '40'
      QA_DIRECT_MEDIA: '${{ matrix.direct }}'
      QA_BATCHES: '${{ matrix.batches }}'
      QA_STOP_ON_FAILURE: 'true'
      QA_BATCH_COUNT: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: first-failure-driver, path: qa-driver}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: candidate-test-input, path: preview}
      - name: Verify APK and reproduce the same H264/AAC transport stream
        run: |
          set -euo pipefail
          echo "QA_SEED_BASE=${{ matrix.seed }}" >> "$GITHUB_ENV"
          echo "QA_REPEAT_SESSION=true" >> "$GITHUB_ENV"
          (cd preview && sha256sum -c apk.sha256)
          grep -Fx 'app=01c516e080448587d5225342ccd4aff94a6fed85' preview/provenance.txt
          sudo apt-get -qq update && sudo apt-get install -y ffmpeg python3-pil
          /usr/bin/python3 qa-title-seek-check/prepare.py "${{ matrix.title }}" 86
      - name: Boot cloud ARM64 Android
        run: bash qa-arm-dual/redroid.sh
      - name: Capture the failed open and decoder diagnostics
        run: bash qa-arm-matrix/run.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'first-failure-${{ matrix.lane }}', path: results/, retention-days: 10}
