name: CodeQL

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Kotlin and Java
    runs-on: ubuntu-24.04
    # Native prerequisites may need a cold bootstrap, as in the Android quality job.
    timeout-minutes: 300
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android and player dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -x "$manager"
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" 'platforms;android-37.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          if ! command -v 7z >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh

      # Bootstrap before extraction so the third-party carrier is not the Kotlin coverage.
      - name: Build and install current YCore runtime
        uses: ./.github/actions/build-current-ycore

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual

      # The Kotlin extractor runs inside the Kotlin daemon while the phone and TV shared modules
      # compile the same common sources side by side. With the project's 4 GB the daemon ran out
      # of heap after 48 minutes once those sources grew past 235k lines; the runner has 16 GB.
      - name: Compile phone, TV, protocol, and server Kotlin for extraction
        run: >-
          ./gradlew :composeApp:compileDebugKotlin :tvApp:compileDebugKotlin
          :watchTogetherServer:classes
          --no-daemon --no-build-cache --rerun-tasks -Pkotlin.incremental=false
          -Pkotlin.daemon.jvmargs=-Xmx8g

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:java-kotlin"
