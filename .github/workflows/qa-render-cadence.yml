name: Trace the math callers during fixed-screen playback on one cloud guest
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: [.github/workflows/qa-render-cadence.yml, qa-power-ui/render_cadence.py]
permissions: {contents: read, actions: read}
jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env: {QA_TRACE_MATH_CALLERS: 'true'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Acquire the exact R36 package
        env: {API_TOKEN: '${{ github.token }}'}
        run: bash qa-integrated/acquire-qualified-candidate.sh 44369298786 94ec647fac5132b5f3ee92e1304b98f57084e078
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: arm-input-driver, path: driver, run-id: 44358745639, github-token: '${{ github.token }}'}
      - run: bash qa-arm-dual/redroid.sh
      - name: Measure four full-size playback windows
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil python3-cryptography
          mkdir -p results/cadence
          (cd preview && sha256sum -c apk.sha256)
          cp preview/apk.sha256 preview/provenance.txt results/cadence/
          adb install -r -g preview/composeApp-release.apk
          adb install -r driver/driver.apk
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell wm dismiss-keyguard
          touch /tmp/yfuse-tree-active
          /usr/bin/python3 qa-power-ui/render_cadence.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: full-size-cadence, path: results/cadence/, retention-days: 10}
