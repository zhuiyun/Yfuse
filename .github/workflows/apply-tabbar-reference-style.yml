name: Apply tab bar reference style

on:
  push:
    branches:
      - agent/tabbar-reference-style

permissions:
  contents: write

concurrency:
  group: apply-tabbar-reference-style
  cancel-in-progress: true

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/tabbar-reference-style
          fetch-depth: 1

      - name: Apply tab bar style
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_tabbar_reference_style.py
          git diff --check

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh

      - name: Compile Android
        shell: bash
        run: ./gradlew :composeApp:compileDebugKotlinAndroid --no-daemon

      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            composeApp/src/commonMain/kotlin/com/yfuse/app/App.kt \
            composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/Tokens.kt
          git rm .github/workflows/apply-tabbar-reference-style.yml scripts/apply_tabbar_reference_style.py
          git diff --cached --check
          git commit -m "feat: restyle bottom tab bar"
          git push origin HEAD:agent/tabbar-reference-style
