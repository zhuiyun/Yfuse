name: Trace held thumbnail and paused source reads on the original failing APK
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: [.github/workflows/qa-cache-hold-control.yml]
permissions: {contents: read, actions: read}
jobs:
  observe:
    name: Compare stalled and paced media reads on ${{ matrix.engine }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {engine: [SenPlayer, YCore]}
    env:
      QA_ENGINE: ${{ matrix.engine }}
      QA_CACHE_PAIRED_CONTROLS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arm-input-driver
          run-id: 44438939370
          github-token: ${{ github.token }}
          path: qa-driver
      - name: Verify the exact earlier Android package and create timecoded media
        env: {API_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          bash qa-integrated/acquire-qualified-candidate.sh 44436887249 e6f66482a1b498a650d152eef57c73bb3143f520
          echo '1a7895a33887d6d5e05884716654f3b553933939a83d73a151c7942f87e7eeff  preview/composeApp-release.apk' | sha256sum -c -
          mkdir -p results
          cp preview/apk.sha256 preview/provenance.txt results/
          sudo apt-get -qq update
          sudo apt-get install -y ffmpeg python3-pil python3-numpy fonts-dejavu-core
          /usr/bin/python3 qa-scrub/fixture.py qa-media
          /usr/bin/python3 qa-cache-fixed/boundary.py
      - run: bash qa-arm-dual/redroid.sh
      - name: Hold over buffered and cold targets and compare a paused run without touch
        run: bash qa-cache-fixed/holds.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'origin-read-control-${{ matrix.engine }}', path: results/, retention-days: 10}
