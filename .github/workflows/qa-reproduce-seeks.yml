name: Reproduce unverified progress gestures with picture and player observations
on:
  push:
    branches: [codex/cloud-playback-resilience-20261113]
    paths: ['.github/workflows/qa-reproduce-seeks.yml','qa-seek-reproduce/**']
permissions: {contents: read, actions: read}
jobs:
  volume:
    name: Seek replay ${{ matrix.shard }} - ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {shard: 1, api: 36, image: '36', variant: original}
          - {shard: 1, api: 36, image: '36', variant: instrumented-control}
          - {shard: 22, api: 37, image: '37.0', variant: original}
          - {shard: 22, api: 37, image: '37.0', variant: instrumented-control}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify preview belongs to the tested PR tree
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          get() { curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/$1"; }
          head=2e095fa741a080e340183ec8fc327005756cc8da
          merge=3f867b11d302d1f0f7d1e548716ea47623effd63
          get "git/commits/$merge" > "$RUNNER_TEMP/merge.json"
          test "$(get "git/commits/$head" | jq -r '.tree.sha')" = "$(jq -r '.tree.sha' "$RUNNER_TEMP/merge.json")"
          jq -e --arg h "$head" 'any(.parents[]; .sha == $h)' "$RUNNER_TEMP/merge.json" >/dev/null
          if [[ "${{ matrix.shard }}" == 22 ]]; then
            get "actions/artifacts/14007359626/zip" > "$RUNNER_TEMP/preview.zip"
          else
            get "actions/artifacts/13973342804/zip" > "$RUNNER_TEMP/preview.zip"
            echo "9676ce59940c483c1c356b25b6cc85ff40cf67bd3cb36e465447bc6d0cee0d6f  $RUNNER_TEMP/preview.zip" | sha256sum -c -
          fi
          mkdir preview results
          unzip -q "$RUNNER_TEMP/preview.zip" -d preview
          test -f preview/composeApp-release.apk
          sha256sum preview/composeApp-release.apk > results/apk.sha256
      - name: Enable hardware acceleration and install fixture tools
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
          /usr/bin/python3 qa-volume/fixtures.py ${{ matrix.shard }}
      - name: Use current SDK manager on Android 17
        if: matrix.api == 37
        run: sudo mv "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/old-cmdline-tools"
      - name: Select historical or control input and recording
        run: |
          cp qa-seek-reproduce/Driver.java qa-volume/input-driver.java
          cp qa-seek-reproduce/replay.py qa-volume/test.py
          printf '%s' "${{ matrix.variant }}" > qa-replay-mode
      - name: Run the release preview on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.image }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash qa-volume/run.sh ${{ matrix.shard }}
      - name: Keep per-gesture observations regardless of verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'replay-${{ matrix.shard }}-${{ matrix.variant }}', path: results/, retention-days: 10}
