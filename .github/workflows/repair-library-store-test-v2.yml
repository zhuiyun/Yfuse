name: Repair LibraryStore deterministic failure test

on:
  push:
    branches:
      - fix/playback-diagnostics-20260823
    paths:
      - .github/workflows/repair-library-store-test-v2.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/playback-diagnostics-20260823
          fetch-depth: 0

      - name: Repair server-switch test harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('composeApp/src/commonTest/kotlin/com/yfuse/feature/library/LibraryStoreTest.kt')
          text = path.read_text(encoding='utf-8')

          text = text.replace('import kotlinx.coroutines.runBlocking\n', '', 1)

          old_header = '''    fun serverSwitchUsesOnlyTheSelectedServersCacheAndFreshness() =\n        runBlocking {'''
          new_header = '''    fun serverSwitchUsesOnlyTheSelectedServersCacheAndFreshness() =\n        runTest {'''
          if old_header not in text:
              raise SystemExit('missing runBlocking target header')
          text = text.replace(old_header, new_header, 1)

          marker = '    fun serverSwitchUsesOnlyTheSelectedServersCacheAndFreshness() ='
          if marker not in text:
              raise SystemExit('missing target test marker')
          prefix, target = text.split(marker, 1)

          old_repo = '                    testRepo { throw IOException("offline") },'
          new_repo = '                    testRepo { json("{") },'
          if old_repo not in target:
              raise SystemExit('missing target repo failure harness')
          target = target.replace(old_repo, new_repo, 1)

          old_tail = '''            assertEquals(1_600_000_000_002L, switched.updatedAtEpochMs)\n            store.dispose()\n        }'''
          new_tail = '''            assertEquals(1_600_000_000_002L, switched.updatedAtEpochMs)\n            store.dispose()\n            advanceUntilIdle()\n        }'''
          if old_tail not in target:
              raise SystemExit('missing target test tail')
          target = target.replace(old_tail, new_tail, 1)

          path.write_text(prefix + marker + target, encoding='utf-8')
          PY

          git diff --check
          git diff -- composeApp/src/commonTest/kotlin/com/yfuse/feature/library/LibraryStoreTest.kt

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- composeApp/src/commonTest/kotlin/com/yfuse/feature/library/LibraryStoreTest.kt; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composeApp/src/commonTest/kotlin/com/yfuse/feature/library/LibraryStoreTest.kt
          git commit -m 'test: make library server-switch failure deterministic'
          git push origin HEAD:fix/playback-diagnostics-20260823
