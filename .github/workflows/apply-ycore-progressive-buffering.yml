name: Apply YCore progressive buffering

on:
  push:
    branches:
      - codex/ycore-sign-20260830

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[progressive-buffering-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply progressive buffering patch
        run: python3 scripts/apply-ycore-progressive-buffering.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name yfuse-ci
          git config user.email actions@users.noreply.github.com
          git add composeApp/src/androidMain/kotlin/com/yfuse/core2/android/AndroidTransportMediaDataSource.kt composeApp/src/androidMain/kotlin/com/yfuse/core2/android/AndroidNativeDirectYPlayer.kt
          git commit -m "feat(player): progressive buffering with real buffered progress [player-startup-patched] [progressive-buffering-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
