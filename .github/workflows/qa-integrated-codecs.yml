name: Extended codecs on the enhanced startup and subtitle repair
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: ['.github/workflows/qa-integrated-codecs.yml']
permissions: {contents: read, actions: read}
jobs:
  codecs:
    name: Extended ${{ matrix.engine }} codecs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        engine: [YCore,SenPlayer]
    env:
      QA_ENGINE: ${{ matrix.engine }}
      QA_SHARD: '0'
      QA_SESSIONS: '1'
      QA_BATCHES: '2'
      QA_BATCH_COUNT: '16'
      QA_STOP_ON_FAILURE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Wait for the new runtime qualification
        env: {API_TOKEN: "${{ github.token }}"}
        run: bash qa-integrated/acquire-qualified-candidate.sh 43853752670 eff812329895ae01f7545677110ff12af96de37e
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: arm-input-driver, path: qa-driver, run-id: 43821082631, github-token: '${{ github.token }}'}
      - name: Verify qualified candidate and prepare six video and audio combinations
        run: |
          set -euo pipefail
          mkdir -p results
          (cd preview && sha256sum -c apk.sha256)
          grep -Fx "app=eff812329895ae01f7545677110ff12af96de37e" preview/provenance.txt
          cp preview/provenance.txt preview/apk.sha256 results/
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
          python3 qa-arm-codecs/prepare.py
      - name: Boot cloud ARM64 Android
        run: bash qa-arm-dual/redroid.sh
      - name: Verify six codec opens and 192 real seeks per engine
        run: bash qa-arm-matrix/run.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'codecs-${{ matrix.engine }}', path: results/, retention-days: 10}
