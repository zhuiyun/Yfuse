name: YCore audio repair verification

on:
  push:
    branches: [fix/ycore-audio-output-20260906]
    paths: [.github/workflows/ycore-audio-repair.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Export exact source for repair verification
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ycore-audio-source-${{ github.sha }}
          path: source-snapshot.zip
          retention-days: 3
          if-no-files-found: error
