name: YCore demux audio truth repair verification

on:
  push:
    branches: [fix/ycore-audio-output-20260906]
    paths: [.github/workflows/ycore-audio-repair.yml, .github/repairs/ycore-audio-truth.patch]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ycore-audio-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply audited repair and commit actual source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          patch_file=.github/repairs/ycore-audio-truth.patch
          if [[ -f "$patch_file" ]]; then
            cp "$patch_file" "$RUNNER_TEMP/repair.patch"
            echo 'de1cddd1f3c0773a0eb28d86720eef96679542367d6b7c00b0eb2b8ab6d3829b  '"$RUNNER_TEMP/repair.patch" | sha256sum -c -
            git apply --check "$RUNNER_TEMP/repair.patch"
            git apply "$RUNNER_TEMP/repair.patch"
            git add -N -- composeApp/src
            mapfile -t kotlin_files < <(git diff --name-only -- '*.kt')
            curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/com/pinterest/ktlint/ktlint-cli/1.3.1/ktlint-cli-1.3.1-all.jar -o "$RUNNER_TEMP/ktlint.jar"
            java -jar "$RUNNER_TEMP/ktlint.jar" --format "${kotlin_files[@]}" || echo 'Formatter left violations; the strict ktlintCheck signing gate remains required.'
            git diff --check
            git rm "$patch_file"
            git add -- composeApp/src .github/sign-android-request
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(player): reconcile enhanced audio from actual demux tracks'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          git show --stat --oneline HEAD
          git archive --format=zip --output="$RUNNER_TEMP/repaired-source.zip" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ycore-repaired-source-${{ steps.source.outputs.sha }}
          path: ${{ runner.temp }}/repaired-source.zip
          retention-days: 7

  sign:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      NATIVE_SOURCE_SHA: ade1271df64ea1222f9cef9bbff82becbf7db729
      NATIVE_RUN_ID: '33986535644'
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      EXPECTED_ANDROID_CERT_SHA256: 373e36d363965b6c1ae0a68c3db9537831d137ea6c38f094608bf243e7be3e84
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify native source identity and upstream build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code "$NATIVE_SOURCE_SHA" HEAD -- scripts third_party ycore-native gradle/libs.versions.toml
          git diff --exit-code "$NATIVE_SOURCE_SHA" HEAD -- '*.cpp' '*.c' '*.h' '*.cmake' '*CMakeLists.txt'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID" --jq '[.head_sha,.conclusion] | @tsv' > "$RUNNER_TEMP/native-run.tsv"
          test "$(cat "$RUNNER_TEMP/native-run.tsv")" = "$(printf '%s\tsuccess' "$NATIVE_SOURCE_SHA")"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android build tools
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          if ! command -v 7z >/dev/null; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
      - name: Download verified compatibility SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 33986535644
          name: ycore-native-arm64
          path: .native-build/artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: 33986535644
          name: ycore-build-carrier-arm64
          path: .native-build/artifacts
      - name: Install verified source-matched native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/install-ycore-native.sh
          bash scripts/install-yfuse-mpv-bluray.sh
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, zipfile
          root = pathlib.Path('.native-build/artifacts')
          libs = {}
          for name in ('libmpv-yfuse-bluray.aar', 'ycore-gpu.aar'):
              with zipfile.ZipFile(root / name) as z:
                  for item in z.namelist():
                      if item.startswith('jni/arm64-v8a/') and item.endswith('.so'):
                          key = item.rsplit('/', 1)[1]
                          digest = hashlib.sha256(z.read(item)).hexdigest()
                          if key in libs and libs[key] != digest:
                              raise SystemExit('Conflicting native library: ' + key)
                          libs[key] = digest
          digest = hashlib.sha256(pathlib.Path('composeApp/libs/libmpv-release.aar').read_bytes()).hexdigest()
          path = pathlib.Path('scripts/engine-checksums.sha256')
          content = re.sub(r'^[0-9a-fA-F]{64}(\s+libmpv-(?:dolby-)?release\.aar)$', lambda m: digest + m.group(1), path.read_text(), flags=re.M)
          path.write_text(content)
          report = dict(sourceCommit=os.environ['SOURCE_SHA'], nativeSourceCommit=os.environ['NATIVE_SOURCE_SHA'], nativeBuildRun=os.environ['NATIVE_RUN_ID'], nativeSourcesUnchanged=True, libraries=libs)
          (root / 'native-build-info.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Verify formatting and design contracts
        run: ./gradlew :composeApp:ktlintCheck :composeApp:verifyDesignSystemUsage --no-daemon
      - name: Compile and run regression tests
        run: ./gradlew :composeApp:testDebugUnitTest :watchTogetherProtocol:jvmTest :watchTogetherServer:test --no-daemon
      - name: Configure original production signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing production signing secret: $name"; exit 1; }
          done
          umask 077
          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/yfuse-release.jks
          {
            printf 'storeFile=signing/yfuse-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > keystore.properties
          printf 'tmdb.token=%s\n' "$TMDB_TOKEN" > local.properties
          actual="$(keytool -list -v -keystore signing/yfuse-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$EXPECTED_ANDROID_CERT_SHA256"
      - name: Build production-signed release
        run: ./gradlew :composeApp:assembleRelease -PyfuseVersionCode=192 -PyfuseVersionName=1.0.30 -PconfirmMdkDistributionRights=true --no-daemon
      - name: Verify APK signature, version, alignment, and native contents
        run: |
          set -euo pipefail
          apk=composeApp/build/outputs/apk/release/composeApp-release.apk
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          tools="$sdk/build-tools/36.0.0"
          mkdir -p build/signed-artifact
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee build/signed-artifact/signature-verification.txt
          grep -Fq "$EXPECTED_ANDROID_CERT_SHA256" build/signed-artifact/signature-verification.txt
          "$tools/zipalign" -c -v -P 16 4 "$apk" > build/signed-artifact/alignment-verification.txt
          "$tools/aapt" dump badging "$apk" > build/signed-artifact/apk-badging.txt
          grep -Fq "package: name='com.yfuse' versionCode='192' versionName='1.0.30'" build/signed-artifact/apk-badging.txt
          python3 - "$apk" <<'PY'
          import hashlib, json, os, pathlib, sys, zipfile, xml.etree.ElementTree as ET
          report = json.loads(pathlib.Path('.native-build/artifacts/native-build-info.json').read_text())
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None, 'APK ZIP CRC failure'
              for name in ('libavcodec.so','libavformat.so','libmpv.so','libmdk.so','libycore_demux.so','libycore_gpu.so'):
                  z.getinfo('lib/arm64-v8a/' + name)
              for name, digest in report['libraries'].items():
                  assert hashlib.sha256(z.read('lib/arm64-v8a/' + name)).hexdigest() == digest, name
              assert any(b'E9107559' in z.read(n) for n in z.namelist() if n.endswith('.dex')), 'Cast receiver missing'
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in pathlib.Path('.').glob('*/build/test-results/**/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals: totals[key] += int(root.attrib.get(key, 0))
          assert totals['tests'] > 0 and totals['failures'] == 0 and totals['errors'] == 0, totals
          info = dict(packageName='com.yfuse', versionName='1.0.30', versionCode=192, certificateSha256=os.environ['EXPECTED_ANDROID_CERT_SHA256'], sourceCommit=os.environ['SOURCE_SHA'], nativeSourceCommit=os.environ['NATIVE_SOURCE_SHA'], nativeBuildRun=os.environ['NATIVE_RUN_ID'], runtime='full', tests=totals, physicalDeviceTested=False)
          pathlib.Path('build/signed-artifact/build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          PY
          cp "$apk" build/signed-artifact/Yfuse-1.0.30-192-signed.apk
          cp .native-build/artifacts/native-build-info.json build/signed-artifact/
          cp scripts/engine-checksums.sha256 build/signed-artifact/effective-engine-checksums.sha256
          (cd build/signed-artifact && sha256sum Yfuse-1.0.30-192-signed.apk > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: yfuse-1.0.30-192-signed-${{ needs.prepare.outputs.source_sha }}
          path: build/signed-artifact/
          retention-days: 14
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ycore-audio-tests-${{ github.run_id }}
          path: |
            composeApp/build/test-results/
            composeApp/build/reports/ktlint/
            watchTogetherProtocol/build/test-results/
            watchTogetherServer/build/test-results/
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: rm -f signing/yfuse-release.jks keystore.properties local.properties
