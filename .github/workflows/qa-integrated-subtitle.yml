name: Verify ordered surface destruction preserves short and long dual subtitles
'on':
  push:
    branches:
    - codex/two-engines-cloud-seek-20261113
    paths:
    - .github/workflows/qa-integrated-subtitle.yml
permissions:
  contents: read
  actions: read
jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with: {persist-credentials: false}
    - name: Build stable rail touch instrumentation
      run: |
        set -euo pipefail
        mkdir qa-driver
        cp qa-arm-matrix/Driver.java qa-volume/input-driver.java
        sed 's|adb install -r driver.apk|cp driver.apk "$GITHUB_WORKSPACE/qa-driver/driver.apk"|' qa-volume/build-driver.sh > "$RUNNER_TEMP/build-qa.sh"
        bash "$RUNNER_TEMP/build-qa.sh"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with: {name: arm-input-driver, path: qa-driver/, retention-days: 5}
  subtitles:
    needs: driver
    name: SenPlayer recreated subtitles with ${{ matrix.cue_seconds }} second cues
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        cue_seconds: [2, 598]
    env:
      QA_ENGINE: SenPlayer
      QA_CAPTURE_FAILURE: 'true'
      QA_SUBTITLE_CUE_SECONDS: ${{ matrix.cue_seconds }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Wait for qualified startup and subtitle repair
      env:
        API_TOKEN: ${{ github.token }}
      run: bash qa-integrated/acquire-qualified-candidate.sh 44032786577 c301b0adbba71c6f6b1e58c4951c28658645e314
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: arm-input-driver
        path: qa-driver
    - name: Verify identical candidate and prepare original file checks
      run: 'set -euo pipefail

        mkdir -p results

        (cd preview && sha256sum -c apk.sha256)

        grep -Fx "app=c301b0adbba71c6f6b1e58c4951c28658645e314" preview/provenance.txt

        cp preview/provenance.txt preview/apk.sha256 results/

        sudo apt-get update -qq

        sudo apt-get install -y ffmpeg python3-pil tesseract-ocr

        '
    - name: Boot cloud ARM64 Android
      run: bash qa-arm-dual/redroid.sh
    - name: Verify selected English subtitles appear and disappear in actual video output
      run: 'set -euo pipefail

        test "$GITHUB_ACTIONS" = true

        adb install -r -g preview/composeApp-release.apk

        adb install -r qa-driver/driver.apk

        adb shell wm size 720x1280

        adb shell wm density 260

        adb shell settings put secure immersive_mode_confirmations confirmed

        adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000

        adb shell wm dismiss-keyguard

        touch /tmp/yfuse-tree-active

        /usr/bin/python3 qa-arm-matrix/engine.py "$QA_ENGINE"

        /usr/bin/python3 qa-sen-subtitle/test.py

        '
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: sen-original-subtitle-factory-${{ matrix.cue_seconds }}
        path: results/
        retention-days: 10
