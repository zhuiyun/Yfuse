name: Verify visible primary and secondary subtitles on both Android cores
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: [.github/workflows/qa-integrated-subtitle.yml, qa-sen-subtitle/test.py]
permissions: {contents: read, actions: read}
env:
  QA_APP_SHA: 382077026e5747530f320c0188ba2eeebd529b7e
jobs:
  input:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Build the actual touch driver
        run: |
          set -euo pipefail
          mkdir driver
          cp qa-arm-matrix/Driver.java qa-volume/input-driver.java
          sed 's|adb install -r driver.apk|cp driver.apk "$GITHUB_WORKSPACE/driver/driver.apk"|' qa-volume/build-driver.sh > "$RUNNER_TEMP/build-driver.sh"
          bash "$RUNNER_TEMP/build-driver.sh"
      - name: Verify the qualified APK before assigning ARM devices
        env: {API_TOKEN: '${{ github.token }}'}
        run: bash qa-arm-original/prepare_volume.sh 44469657784
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: subtitle-input, path: candidate/, retention-days: 5}
  subtitles:
    needs: input
    name: ${{ matrix.core }} subtitles with ${{ matrix.cue_seconds }} second cues
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        core: [YCore, SenPlayer]
        cue_seconds: [2, 598]
    env:
      QA_ENGINE: ${{ matrix.core }}
      QA_CAPTURE_FAILURE: 'true'
      QA_SUBTITLE_CUE_SECONDS: ${{ matrix.cue_seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: subtitle-input, path: candidate}
      - name: Verify the candidate and prepare the video and subtitle reader
        run: |
          set -euo pipefail
          (cd candidate && sha256sum -c apk.sha256)
          grep -Fx "app=$QA_APP_SHA" candidate/provenance.txt
          mkdir -p results
          cp candidate/provenance.txt candidate/apk.sha256 results/
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil tesseract-ocr
      - name: Boot cloud ARM64 Android
        run: bash qa-arm-dual/redroid.sh
      - name: Check rendered words while selecting, seeking, suspending and restoring both tracks
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          adb install -r -g candidate/composeApp-release.apk
          adb install -r candidate/driver.apk
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000
          touch /tmp/yfuse-tree-active
          /usr/bin/python3 qa-sen-subtitle/test.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: subtitles-${{ matrix.core }}-${{ matrix.cue_seconds }}
          path: results/
          retention-days: 10
