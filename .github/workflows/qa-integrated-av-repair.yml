name: Qualify library arrival and background clock fixes
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: ['.github/workflows/qa-integrated-av-repair.yml']
permissions: {contents: read, actions: read}
env:
  QA_APP_SHA: 4a1d7485cd07e2983c2f6ce6ffd72a9a8995e4da
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4a1d7485cd07e2983c2f6ce6ffd72a9a8995e4da
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - name: Verify native inputs and build the release candidate
        env: {API_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          app_sha=$(git rev-parse HEAD)
          native_sha=8a9bb9a7b626d7c7695caf95d7a885192c101935
          git diff --exit-code "$native_sha" "$app_sha" -- ycore-native scripts/native scripts/native-build-download.py scripts/ycore-source-receipt.py
          producer=43803470495
          name="ycore-source-$native_sha-$producer-1"
          artifact=""
          for i in $(seq 1 135); do
            artifact=$(curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/actions/runs/$producer/artifacts" | jq -r --arg n "$name" '.artifacts[] | select(.name==$n and .expired==false) | .id' | head -1)
            if [[ "$artifact" =~ ^[0-9]+$ ]]; then break; fi
            sleep 12
          done
          test -n "$artifact"
          curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/actions/artifacts/$artifact" | jq -e --arg n "ycore-source-$native_sha-43803470495-1" '.name==$n and .expired==false and .workflow_run.id==43803470495' >/dev/null
          curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/actions/artifacts/$artifact/zip" -o "$RUNNER_TEMP/native.zip"
          mkdir "$RUNNER_TEMP/native-in"
          unzip -q "$RUNNER_TEMP/native.zip" -d "$RUNNER_TEMP/native-in"
          export YCORE_NATIVE_AAR_PATH="$RUNNER_TEMP/native-in/ycore-native.aar"
          export YCORE_SOURCE_RECEIPT="$RUNNER_TEMP/native-in/source-build.json"
          export YCORE_SOURCE_COMMIT="$native_sha" SOURCE_COMMIT="$native_sha"
          export YCORE_SOURCE_AAR_SHA256=$(sha256sum "$YCORE_NATIVE_AAR_PATH" | cut -d' ' -f1)
          export YCORE_SOURCE_PROVENANCE_SHA256=$(sha256sum "$RUNNER_TEMP/native-in/NATIVE-SOURCES.txt" | cut -d' ' -f1)
          input_tree="$RUNNER_TEMP/verified-native-source"
          git worktree add --detach "$input_tree" "$native_sha"
          (cd "$input_tree" && python3 scripts/prepare-playback-inputs.py)
          mkdir -p composeApp/libs
          cp "$input_tree"/composeApp/libs/ycore-native.{aar,aar.sha256,sources.txt} composeApp/libs/
          cp -a "$input_tree"/senplayerBridge/src/main/assets/senplayer/. senplayerBridge/src/main/assets/senplayer/
          (cd composeApp/libs && sha256sum -c ycore-native.aar.sha256)
          test "$(git rev-parse HEAD)" = "$app_sha"
          git diff --exit-code -- .
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0'
          python3 scripts/check_function_size.py
          ./gradlew ktlintCheck --continue --no-parallel --max-workers=2 --no-daemon
          ./gradlew :phoneShared:testAndroidHostTest :composeApp:assembleRelease :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest -PyfuseIncludeMdk=false -PyfusePlaybackProfile=ycore-senplayer -PyfuseNativeOnlyRuntime=true -PallowDebugSigning=true -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8' --no-parallel --max-workers=2 --no-daemon
          mkdir preview
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk preview/instrumentation-target.apk
          test_apk=$(find composeApp/build/outputs/apk/androidTest -name '*.apk' | head -1)
          test -s "$test_apk"
          cp "$test_apk" preview/regressions.apk
          cp composeApp/build/outputs/apk/release/composeApp-release.apk preview/
          cp composeApp/build/outputs/mapping/release/mapping.txt preview/
          printf 'app=%s\nnative_built_from=%s\nsource_artifact=%s\n' "$app_sha" "$native_sha" "$artifact" > preview/provenance.txt
          (cd preview && sha256sum composeApp-release.apk > apk.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: candidate-test-input, path: preview, retention-days: 7}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: repair-test-reports
          path: |
            phoneShared/build/test-results/testAndroidHostTest
            tvShared/build/test-results/testAndroidHostTest
            phoneShared/build/reports/tests/testAndroidHostTest
            **/build/reports/ktlint
          retention-days: 7

  native-contract:
    needs: build
    name: Actual ARM64 software-frame and seek-preview contract
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: candidate-test-input, path: preview}
      - name: Boot only the cloud ARM64 emulator
        run: bash qa-arm-dual/redroid.sh
      - name: Verify actual native frame skipping and cached preview
        run: |
          set -euo pipefail
          mkdir -p results
          collect_native_evidence() {
            adb logcat -d -v threadtime > results/native-logcat.txt || true
            adb shell cat '/data/user/0/com.yfuse/no_backup/diagnostics/diagnostic-*.jsonl' > results/native-diagnostics.jsonl || true
            adb shell dumpsys media.codec > results/codec-service.txt || true
          }
          trap collect_native_evidence EXIT
          (cd preview && sha256sum -c apk.sha256)
          grep -Fx "app=$QA_APP_SHA" preview/provenance.txt
          adb install -r -g preview/instrumentation-target.apk
          adb install -r -g preview/regressions.apk
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -v error -y -f lavfi -i testsrc2=size=320x180:rate=10 -f lavfi -i anullsrc=r=48000:cl=mono -t 20 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -b:a 64k -movflags +faststart "$RUNNER_TEMP/enhanced-retry.mp4"
          sha256sum "$RUNNER_TEMP/enhanced-retry.mp4" > results/fixture.sha256
          ffprobe -v error -show_entries stream=codec_name,codec_type,width,height:format=duration -of json "$RUNNER_TEMP/enhanced-retry.mp4" > results/fixture.json
          jq -e '.streams | any(.codec_name=="h264" and .width==320 and .height==180)' results/fixture.json
          jq -e '.streams | any(.codec_name=="aac")' results/fixture.json
          adb shell mkdir -p /sdcard/Android/data/com.yfuse/files
          adb push "$RUNNER_TEMP/enhanced-retry.mp4" /sdcard/Android/data/com.yfuse/files/enhanced-retry.mp4
          adb shell sha256sum /sdcard/Android/data/com.yfuse/files/enhanced-retry.mp4 > results/device-fixture.sha256
          test "$(cut -d' ' -f1 results/fixture.sha256)" = "$(tr -d '\r' < results/device-fixture.sha256 | cut -d' ' -f1)"
          adb shell am instrument -w -r -e enhancedRetryDecodePath software -e enhancedRetryFixture /sdcard/Android/data/com.yfuse/files/enhanced-retry.mp4 -e class 'com.yfuse.core2.android.SoftwareOutputContractInstrumentedTest,com.yfuse.feature.player.SoftFeedbackInstrumentedTest#seek_cancel_never_commits_and_release_commits_once_with_or_without_motion,com.yfuse.feature.player.BufferedScrubDecodeInstrumentedTest,com.yfuse.core2.android.YCoreMediaSuiteInstrumentedTest#enhanced_transport_retry_keeps_the_assigned_route_and_renders_again' com.yfuse.test/androidx.test.runner.AndroidJUnitRunner | tee results/contracts.txt
          python3 qa-integrated/check-instrumentation.py results/contracts.txt 7
          grep -E 'OK \(7 tests\)' results/contracts.txt
          ! grep -E 'FAILURES|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED' results/contracts.txt
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: native-video-repair-contracts, path: results/, retention-days: 10}
