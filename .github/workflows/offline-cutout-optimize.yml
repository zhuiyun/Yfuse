name: Android offline cutout memory and weight optimization
on:
  push:
    branches: [probe/offline-cutout-optimize-20261026]
    paths: [tools/offline-cutout-probe/**, .github/workflows/offline-cutout-optimize.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install model conversion and comparison tools
        run: python -m pip install 'numpy<2' onnx==1.18.0 onnxruntime==1.23.2 pillow
      - name: Reuse exact tested source weights and prepare matrix-weight quantization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40213736535 --repo zhuiyun/Yfuse --name offline-native-apks-40213736535 --dir "$RUNNER_TEMP/previous-probe"
          python tools/offline-cutout-probe/prepare_optimization.py "$RUNNER_TEMP/previous-probe"
      - name: Install compile platform
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build and check all test configurations
        run: |
          ./gradlew -p tools/offline-cutout-probe :app:assembleDebug :app:lintDebug --no-daemon --max-workers=2
          python tools/offline-cutout-probe/verify_apk.py
          cp tools/offline-cutout-probe/artifacts/apk/apk-metadata.json tools/offline-cutout-probe/artifacts/test-apk-metadata.json
          cp tools/offline-cutout-probe/test-manifest.json tools/offline-cutout-probe/artifacts/test-manifest.json
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare all profiles offline on native Android x86
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6144M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: python tools/offline-cutout-probe/run_device.py
      - name: Select only configurations retaining baseline output
        run: python tools/offline-cutout-probe/select_optimization.py
      - name: Rebuild and verify the two-model phone package
        run: |
          ./gradlew -p tools/offline-cutout-probe :app:clean :app:assembleDebug --no-daemon --max-workers=2
          python tools/offline-cutout-probe/verify_apk.py
      - name: Save the checked ARM64 phone package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-optimized-phone-${{ github.run_id }}
          path: |
            tools/offline-cutout-probe/artifacts/apk/Yfuse-offline-cutout-probe-0.0.2-arm64-v8a.apk
            tools/offline-cutout-probe/artifacts/apk/apk-metadata.json
            tools/offline-cutout-probe/artifacts/apk/model-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve actual masks and measurements even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-optimization-evidence-${{ github.run_id }}
          path: |
            tools/offline-cutout-probe/artifacts/device/
            tools/offline-cutout-probe/artifacts/optimization.json
            tools/offline-cutout-probe/artifacts/test-manifest.json
            tools/offline-cutout-probe/artifacts/test-apk-metadata.json
            tools/offline-cutout-probe/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
