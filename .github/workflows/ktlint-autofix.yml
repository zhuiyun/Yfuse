name: Ktlint Autofix

on:
  push:
    branches:
      - fix/ycore-stall-danmaku-rollback

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/ycore-stall-danmaku-rollback

      - name: Repair confirmed formatting failures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "composeApp/src/androidMain/kotlin/com/yfuse/core2/android/AndroidAdaptiveCore2YPlayer.kt": [
                  (
                      'reason = "Remote source ended early; reopening from verified output position",',
                      'reason =\n                                                "Remote source ended early; " +\n                                                    "reopening from verified output position",',
                  ),
                  (
                      'message = "YCore rejected a premature EOF and reopened the active route",',
                      'message =\n                                    "YCore rejected a premature EOF " +\n                                        "and reopened the active route",',
                  ),
              ],
              "composeApp/src/androidMain/kotlin/com/yfuse/core2/android/AndroidVulkanVideoOutput.kt": [
                  (
                      'private val renderer = AtomicLong(AndroidYCoreGpuNativeBridge.createRenderer(target, colorConfig.outputTransfer))',
                      'private val renderer =\n        AtomicLong(\n            AndroidYCoreGpuNativeBridge.createRenderer(\n                target,\n                colorConfig.outputTransfer,\n            ),\n        )',
                  ),
                  (
                      'private val pendingHdr10Plus = ConcurrentSkipListMap<Long, com.yfuse.core2.hdr.YHdr10PlusSceneMetadata>()',
                      'private val pendingHdr10Plus =\n        ConcurrentSkipListMap<Long, com.yfuse.core2.hdr.YHdr10PlusSceneMetadata>()',
                  ),
                  (
                      'val replacement = AndroidYCoreGpuNativeBridge.createRenderer(target, activeColorConfig.get().outputTransfer)',
                      'val replacement =\n            AndroidYCoreGpuNativeBridge.createRenderer(\n                target,\n                activeColorConfig.get().outputTransfer,\n            )',
                  ),
                  (
                      'val decodedWidth = format.integerOrNull(MediaFormat.KEY_WIDTH)?.coerceAtLeast(16) ?: decoderWidth.get()',
                      'val decodedWidth =\n            format.integerOrNull(MediaFormat.KEY_WIDTH)?.coerceAtLeast(16)\n                ?: decoderWidth.get()',
                  ),
                  (
                      'val decodedHeight = format.integerOrNull(MediaFormat.KEY_HEIGHT)?.coerceAtLeast(16) ?: decoderHeight.get()',
                      'val decodedHeight =\n            format.integerOrNull(MediaFormat.KEY_HEIGHT)?.coerceAtLeast(16)\n                ?: decoderHeight.get()',
                  ),
                  (
                      'val cropLeft = format.integerOrNull("crop-left")?.coerceIn(0, decodedWidth - 1) ?: current.geometry.cropLeft',
                      'val cropLeft =\n                format.integerOrNull("crop-left")?.coerceIn(0, decodedWidth - 1)\n                    ?: current.geometry.cropLeft',
                  ),
                  (
                      'val cropTop = format.integerOrNull("crop-top")?.coerceIn(0, decodedHeight - 1) ?: current.geometry.cropTop',
                      'val cropTop =\n                format.integerOrNull("crop-top")?.coerceIn(0, decodedHeight - 1)\n                    ?: current.geometry.cropTop',
                  ),
                  (
                      'pixelAspectRatioNumerator = format.integerOrNull("sar-width")?.coerceAtLeast(1)',
                      'pixelAspectRatioNumerator =\n                            format.integerOrNull("sar-width")?.coerceAtLeast(1)',
                  ),
                  (
                      'pixelAspectRatioDenominator = format.integerOrNull("sar-height")?.coerceAtLeast(1)',
                      'pixelAspectRatioDenominator =\n                            format.integerOrNull("sar-height")?.coerceAtLeast(1)',
                  ),
                  (
                      'cropRight = cropRightCoordinate?.let { (decodedWidth - 1 - it).coerceAtLeast(0) }',
                      'cropRight =\n                            cropRightCoordinate?.let {\n                                (decodedWidth - 1 - it).coerceAtLeast(0)\n                            }',
                  ),
                  (
                      'cropBottom = cropBottomCoordinate?.let { (decodedHeight - 1 - it).coerceAtLeast(0) }',
                      'cropBottom =\n                            cropBottomCoordinate?.let {\n                                (decodedHeight - 1 - it).coerceAtLeast(0)\n                            }',
                  ),
                  (
                      'val image = runCatching(reader::acquireLatestImage).getOrNull() ?: return@setOnImageAvailableListener',
                      'val image =\n                    runCatching(reader::acquireLatestImage).getOrNull()\n                        ?: return@setOnImageAvailableListener',
                  ),
              ],
              "composeApp/src/androidMain/kotlin/com/yfuse/tv/ui/TvLibraryScreens.kt": [
                  (
                      'listOf(LibraryResolution.All, LibraryResolution.FourK, LibraryResolution.DolbyVision).forEach {\n                        resolution ->',
                      'val resolutions =\n                        listOf(\n                            LibraryResolution.All,\n                            LibraryResolution.FourK,\n                            LibraryResolution.DolbyVision,\n                        )\n                    resolutions.forEach { resolution ->',
                  ),
              ],
          }

          for file_name, edits in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in edits:
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Commit repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Confirmed repairs already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.kt'
          git commit -m "style: repair ktlint blockers"
          git push origin HEAD:fix/ycore-stall-danmaku-rollback
