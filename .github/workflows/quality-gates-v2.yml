name: Android quality gates

on:
  pull_request:
  push:
    branches:
      - master
      - feature/fix-uhd-dolby-playback

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, test, lint, and verify design contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      APK_SIZE_BUDGET_BYTES: "30000000"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android 36 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
          test -f composeApp/libs/libmpv-release.aar
          test -f composeApp/libs/mdk-sdk/lib/cmake/FindMDK.cmake
      - name: Compile and run unit tests
        run: ./gradlew :composeApp:compileDebugKotlinAndroid :composeApp:testDebugUnitTest :watchTogetherProtocol:jvmTest :watchTogetherServer:test --no-daemon
      - name: Verify design-system usage
        run: ./gradlew :composeApp:verifyDesignSystemUsage --no-daemon
      - name: Run Android lint
        run: ./gradlew :composeApp:lintDebug --no-daemon
      - name: Build R8 release package
        run: ./gradlew :composeApp:assembleRelease -PallowDebugSigning=true --no-daemon
      - name: Verify release package and size budget
        shell: bash
        run: |
          set -euo pipefail
          apk="composeApp/build/outputs/apk/release/composeApp-release.apk"
          test -s "$apk"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/zipalign" -c -v 4 "$apk"
          bytes="$(stat -c%s "$apk")"
          if (( bytes > APK_SIZE_BUDGET_BYTES )); then
            echo "APK is ${bytes} bytes; budget is ${APK_SIZE_BUDGET_BYTES}" >&2
            exit 1
          fi
      - name: Verify dependency lock state
        run: ./gradlew dependencies --write-locks --no-daemon && git diff --exit-code -- gradle.lockfile '**/gradle.lockfile'
