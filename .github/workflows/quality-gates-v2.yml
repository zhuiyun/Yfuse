name: Android quality gates

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-jvm:
    name: Backend, protocol and server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run backend, protocol and server tests without native bootstrap
        run: ./gradlew :yfuseBackendClient:jvmTest :watchTogetherProtocol:jvmTest :watchTogetherServer:test --no-daemon
      - name: Verify backend disabled configuration
        run: ./gradlew :yfuseBackendClient:jvmTest -PyfuseBackendEnabled=false --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fast-jvm-tests-${{ github.sha }}
          path: |
            watchTogetherProtocol/build/test-results/
            watchTogetherServer/build/test-results/
            yfuseBackendClient/build/test-results/
          retention-days: 7

  fast-contracts:
    name: Release scripts and source boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Check script prerequisites
        run: python3 scripts/check-validation-env.py --profile scripts --report build/validation/scripts-env.json
      - name: Verify release metadata and script behavior
        run: |
          python3 scripts/release_metadata.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/verify-tv-source.py --manifest tvApp/src/androidMain/AndroidManifest.xml --banner tvApp/src/main/res/drawable-nodpi/tv_banner.png
          python3 scripts/verify-module-boundaries.py
          python3 scripts/check-backend-boundary.py
      # PlayerRoot's content lambda grew past what R8 9.1 could turn into a DEX that Android 17
      # verifies, and 1.0.91 crashed before its first frame. A listed function may not grow past
      # its ceiling in config/function-size-baseline.txt, and a new one may not pass 1,500 lines.
      - name: Keep functions under their size ceilings
        run: python3 scripts/check_function_size.py
      - name: Verify renderer cancellation and Cast media-state isolation
        run: node --test castReceiver/receiver.test.cjs watchTogetherServer/calendarRenderer/*.test.mjs

  verify:
    name: Compile, test, lint, and verify design contracts
    runs-on: ubuntu-24.04
    # Cold pinned native dependency bootstrap can take as long as the dedicated native build.
    timeout-minutes: 300
    env:
      APK_SIZE_BUDGET_BYTES: "30000000"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Verify shared signing and release metadata
        run: python3 scripts/release_metadata.py
      - name: Install Android 37.0 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
          test -f composeApp/libs/libmpv-release.aar
          test -f composeApp/libs/mdk-sdk/lib/cmake/FindMDK.cmake
      - name: Build and install current YCore runtime
        uses: ./.github/actions/build-current-ycore
      # Formatting is recorded here and enforced at the end of the job, so a line-wrap
      # violation can no longer hide the compile, test, lint and release signals behind it.
      - name: Record ktlint violations
        shell: bash
        run: |
          set +e
          ./gradlew ktlintCheck --no-daemon --continue
          ktlint_status=$?
          set -e
          if (( ktlint_status != 0 )); then
            while IFS= read -r report; do
              echo "===== $report ====="
              cat "$report"
            done < <(find . -path '*/build/reports/ktlint/*/*.txt' -type f | sort)
            echo "::error::ktlint found new violations; the remaining gates still run, and this job fails at the end"
          fi
          echo "KTLINT_STATUS=$ktlint_status" >> "$GITHUB_ENV"
      # :phoneShared and :tvShared each compile the whole shared tree, and side by side they outgrew
      # the 4 GB Kotlin daemon (OutOfMemoryError in :phoneShared:compileAndroidMain). Compiling in
      # this one-shot Gradle process gives both the room, and hands the memory back when the step
      # ends instead of leaving an idle daemon holding it through the lint and R8 steps.
      - name: Compile and run unit tests
        run: >-
          ./gradlew :composeApp:compileDebugKotlin :tvApp:compileDebugKotlin
          :phoneShared:testAndroidHostTest :tvShared:testAndroidHostTest
          -Pkotlin.compiler.execution.strategy=in-process
          "-Dorg.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8"
          --no-daemon
      # The instrumented tests (24 classes, 56 tests under composeApp/src/androidInstrumentedTest)
      # run on an emulator in the `instrumented` job; compiling them here as well reports a break
      # next to the other compile signals.
      - name: Compile Android instrumented tests
        run: ./gradlew :composeApp:assembleDebugAndroidTest --no-daemon
      - name: Compile startup and frame-time Macrobenchmark APK
        run: ./gradlew :macrobenchmark:assembleBenchmark --no-daemon
      - name: Verify design-system usage
        run: ./gradlew :composeApp:verifyDesignSystemUsage --no-daemon
      # Lint reads the product code, not only the two shells: -PyfuseLintSharedCode makes each
      # shell's lintDebug analyse :phoneShared / :tvShared as well, against the committed
      # config/lint/<shell>-baseline.xml, so only new findings fail. A missing baseline (the
      # first run, or one deleted to reset the debt on purpose) is written by lint here instead
      # of failing the step; it is published as the lint-baselines artifact and the job fails at
      # its end until a person commits it. CI never commits a baseline itself.
      - name: Run Android lint over the shells and the shared product code
        shell: bash
        run: |
          set -uo pipefail
          lint_status=0
          generated=()
          mkdir -p config/lint
          for shell in composeApp tvApp; do
            baseline="config/lint/$shell-baseline.xml"
            bootstrap=()
            if [[ ! -f "$baseline" ]]; then bootstrap=(-Dlint.baselines.continue=true); fi
            # One shell per daemon, each with room for lint: it runs inside the Gradle daemon and
            # now reads about 240k lines per shell rather than one Application class.
            ./gradlew ":$shell:lintDebug" -PyfuseLintSharedCode=true "${bootstrap[@]}" \
              "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8" --no-daemon
            status=$?
            if (( status != 0 )); then
              lint_status=$status
              report="$shell/build/reports/lint-results-debug.txt"
              if [[ -f "$report" ]]; then echo "===== $report ====="; cat "$report"; fi
            fi
            if (( ${#bootstrap[@]} > 0 )) && [[ -f "$baseline" ]]; then generated+=("$baseline"); fi
          done
          if (( ${#generated[@]} > 0 )); then
            mkdir -p build/lint-baselines
            cp "${generated[@]}" build/lint-baselines/
            # Also in the log, for whoever cannot reach the artifact store: a fresh baseline lists
            # only the findings that exist today, so it is short.
            for file in "${generated[@]}"; do
              echo "::group::$file"
              cat "$file"
              echo "::endgroup::"
            done
            echo "LINT_BASELINES_GENERATED=${generated[*]}" >> "$GITHUB_ENV"
            echo "::warning::Lint wrote ${generated[*]}; commit them from this run's lint-baselines artifact"
          fi
          exit "$lint_status"
      - name: Upload lint reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-reports-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            composeApp/build/reports/lint-results-debug.*
            tvApp/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload generated lint baselines
        if: always() && env.LINT_BASELINES_GENERATED != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-baselines-${{ github.sha }}-${{ github.run_attempt }}
          path: build/lint-baselines/
          if-no-files-found: error
          retention-days: 30
      # R8 runs inside the Gradle daemon; the TV gate gives its release build the same room.
      - name: Build R8 release package
        run: ./gradlew :composeApp:assembleRelease -PallowDebugSigning=true "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8" --no-daemon
      # R8 can emit a method ART refuses to load; its class then throws VerifyError the first time
      # it is used, which nothing above runs. 1.0.97 (259) shipped a player that crashed that way.
      # The mapping names the app's own methods, which must stay within 256 registers.
      - name: Reject DEX code ART would not verify
        run: >-
          scripts/verify-release-dex.sh
          --mapping composeApp/build/outputs/mapping/release/mapping.txt
          composeApp/build/outputs/apk/release/composeApp-release.apk
      - name: Verify release package and size budget
        shell: bash
        run: |
          set -euo pipefail
          # Every check names what it found: a bare grep failing under `set -e` ended this step
          # with exit code 1 and nothing else, run after run.
          fail() { echo "::error::$*"; exit 1; }
          apk="composeApp/build/outputs/apk/release/composeApp-release.apk"
          test -s "$apk" || fail "Release APK is missing or empty: $apk"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "Using build tools $build_tools"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/zipalign" -c -v 4 "$apk"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          package_line="$(grep -m 1 '^package:' <<<"$badging" || true)"
          version_code="$(sed -n 's/^VERSION_CODE=//p' version.properties | tail -n 1 | tr -d '\r')"
          version_name="$(sed -n 's/^VERSION_NAME=//p' version.properties | tail -n 1 | tr -d '\r')"
          grep -Fq "package: name='com.yfuse'" <<<"$package_line" || fail "Unexpected package: ${package_line:-none}"
          # Backups would carry Emby tokens; the manifest must keep them off for good. allowBackup is
          # framework attribute 0x01010280 (0x0101002a, which this looked for before, is android:path,
          # so the check could never pass). aapt prints a false boolean as `(type 0x12)0x0`, an
          # aapt2-style dump as `=false`.
          manifest_tree="$("$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml)"
          allow_backup="$(grep -F 'allowBackup(0x01010280)' <<<"$manifest_tree" || true)"
          grep -Eq '\(type 0x12\)0x0([^0-9a-fx]|$)|=false([^a-z]|$)' <<<"$allow_backup" ||
            fail "android:allowBackup is not false in the packaged manifest: ${allow_backup:-attribute absent}"
          grep -Fq "versionCode='$version_code'" <<<"$package_line" ||
            fail "APK versionCode differs from version.properties ($version_code): $package_line"
          grep -Fq "versionName='$version_name'" <<<"$package_line" ||
            fail "APK versionName differs from version.properties ($version_name): $package_line"
          unzip -Z1 "$apk" > build/apk-entries.txt
          for library in libavcodec.so libavformat.so libmpv.so libmdk.so; do
            grep -Fxq "lib/arm64-v8a/$library" build/apk-entries.txt || fail "lib/arm64-v8a/$library is missing from the APK"
          done
          # A committed app profile must reach the APK: AGP merges it with the libraries' rules and
          # compiles them into assets/dexopt/. Only the merged text shows Yfuse's own rules made it.
          # The libraries' own rules alone already produce assets/dexopt/baseline.prof, which is how a
          # file in src/main/ (where AGP never looks) went unnoticed: the APK entry proves nothing
          # about this app's rules, the merged text does.
          profile="composeApp/src/androidMain/baseline-prof.txt"
          if [[ -s "$profile" ]]; then
            grep -Fxq assets/dexopt/baseline.prof build/apk-entries.txt || fail "Release APK has no compiled baseline profile"
            merged=""
            while IFS= read -r candidate; do
              if grep -q 'Lcom/yfuse/' "$candidate"; then merged="$candidate"; break; fi
            done < <(find composeApp/build/intermediates -path '*art_profile*' -path '*elease*' -name '*.txt' | sort)
            if [[ -z "$merged" ]]; then
              echo "Release ART profile texts AGP produced (lines, then Yfuse rules):"
              while IFS= read -r candidate; do
                echo "  $candidate: $(wc -l < "$candidate") lines, $(grep -c 'Lcom/yfuse/' "$candidate" || true) Yfuse"
              done < <(find composeApp/build/intermediates -path '*art_profile*' -name '*.txt' | sort)
              fail "AGP did not merge $profile: no release ART profile text holds a Yfuse rule"
            fi
            echo "AGP merged $profile: $(grep -c 'Lcom/yfuse/' "$merged") Yfuse rules in $merged"
          fi
          apk_size="$(stat -c '%s' "$apk")"
          echo "APK size: $apk_size bytes (budget $APK_SIZE_BUDGET_BYTES)"
          (( apk_size <= APK_SIZE_BUDGET_BYTES )) || fail "APK is $apk_size bytes, over the $APK_SIZE_BUDGET_BYTES byte budget"
      - name: Check patch whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then git diff --check "$BASE_SHA" "$GITHUB_SHA"; else git show --check --format= "$GITHUB_SHA"; fi
      - name: Resolve with committed dependency locks
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :composeApp:dependencies :phoneShared:dependencies :tvApp:dependencies :tvShared:dependencies :macrobenchmark:dependencies :mdkAndroid:dependencies :watchTogetherProtocol:dependencies :watchTogetherServer:dependencies --no-daemon >/dev/null
          git diff --exit-code -- '**/gradle.lockfile' settings-gradle.lockfile
      - name: Fail on recorded ktlint violations
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${KTLINT_STATUS:-0}" != "0" ]]; then
            echo "::error::ktlint violations were recorded earlier in this job"
            exit 1
          fi
      - name: Upload preview APK
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Yfuse-preview-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: composeApp/build/outputs/apk/release/composeApp-release.apk
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      # Last, so every other gate has already reported: a lint run without a committed baseline
      # accepted all existing findings and gated nothing.
      - name: Fail until the generated lint baselines are committed
        if: env.LINT_BASELINES_GENERATED != ''
        shell: bash
        run: |
          echo "::error::No committed lint baseline for: ${LINT_BASELINES_GENERATED}. Download this run's lint-baselines-* artifact and commit its files under config/lint/."
          exit 1

  # The device tests only ever compiled in CI. This job runs them on every pull request and
  # master push, beside `verify` rather than after it: with the native dependency cache warm it
  # costs the Kotlin build, one emulator boot and the tests, and it never delays the other gates.
  instrumented:
    name: Instrumented tests on an Android 15 emulator
    runs-on: ubuntu-24.04
    # A cold native dependency cache is bootstrapped here too, as in `verify`.
    timeout-minutes: 300
    steps:
      # Toolchains no step uses: the native and Kotlin builds, the emulator image and its data
      # partition all need the room on one runner.
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android 37.0 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
          test -f composeApp/libs/libmpv-release.aar
          test -f composeApp/libs/mdk-sdk/lib/cmake/FindMDK.cmake
      - name: Build and install current YCore runtime
        uses: ./.github/actions/build-current-ycore
      # The playback tests refuse the production application id so they can never touch a real
      # installation's data; they install as com.yfuse.validation, as the device-gate docs do.
      - name: Build the debug app and its instrumented test APK
        run: ./gradlew :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest -PyfuseApplicationId=com.yfuse.validation --no-daemon
      - name: Enable hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The phone APK is arm64-v8a only. x86_64 google_apis images translate arm64 and list it in
      # ro.product.cpu.abilist, so the APK installs as it does in android-cloud-ui.yml, whose
      # emulator settings these are. Animations stay on: several tests measure motion curves.
      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          # An app that stops responding (the launcher does now and then, just after boot) puts a
          # system dialog in front of every window. It keeps focus, answers rootInActiveWindow and
          # takes injected touches, so every test that needs the app's own window fails behind it,
          # as five did on one run. The first line has the system end such an app instead of asking;
          # the second closes a dialog that came up before it.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            ./gradlew :composeApp:connectedDebugAndroidTest -PyfuseApplicationId=com.yfuse.validation --no-daemon
      # A run in which the device was skipped or no test executed must not read as a pass.
      - name: Summarise instrumented test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("composeApp/build/outputs/androidTest-results/connected/**/TEST-*.xml", recursive=True))
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in files:
              root = ET.parse(path).getroot()
              for suite in [root] if root.tag == "testsuite" else root.iter("testsuite"):
                  for key in totals:
                      totals[key] += int(suite.get(key) or 0)
          line = (f"Instrumented tests: {totals['tests']} run, {totals['failures']} failed, "
                  f"{totals['errors']} errors, {totals['skipped']} skipped, from {len(files)} result files")
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(line + "\n")
          if totals["tests"] == 0:
              print("::error::No instrumented test result was recorded")
              sys.exit(1)
          PY
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: instrumented-tests-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            composeApp/build/reports/androidTests/
            composeApp/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7

  supply-chain:
    name: Independent dependency vulnerability and SBOM gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
      - name: Verify the scanner resolves severity
        # The gate is only as good as its severity parsing, and a regression there fails
        # open. Pin it before trusting the scan below.
        run: python3 -m unittest discover --start-directory scripts --pattern 'test_*.py' --verbose
      - name: Scan locked Maven and npm dependencies with OSV
        run: python3 scripts/supply_chain_check.py --root . --sbom build/sbom/yfuse.spdx.json
      - name: Upload SPDX SBOM
        if: always() && hashFiles('build/sbom/yfuse.spdx.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yfuse-sbom-${{ github.sha }}
          path: build/sbom/yfuse.spdx.json
          if-no-files-found: error
          retention-days: 7
