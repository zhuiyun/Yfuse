name: Apply release ktlint fixes

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-ktlint-release-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build target-only ktlint patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('composeApp/src/commonMain/kotlin/com/yfuse/feature/player/PlayerStore.kt')
          text = path.read_text()
          old = '                                message = "Primary server failed before playback; switched to an exact-media fallback",'
          new = '''                                message =
                                      "Primary server failed before playback; " +
                                          "switched to an exact-media fallback",'''
          if old not in text:
              raise SystemExit('expected overlong failover message not found')
          path.write_text(text.replace(old, new, 1))
          PY
          chmod +x gradlew
          ./gradlew :composeApp:ktlintCommonMainSourceSetFormat --no-daemon
          git diff -- \
            composeApp/src/commonMain/kotlin/com/yfuse/core2/dolby/YMatroskaDolbyVisionMetadata.kt \
            composeApp/src/commonMain/kotlin/com/yfuse/feature/player/PlayerStore.kt \
            > /tmp/release-ktlint.patch
          test -s /tmp/release-ktlint.patch
          git reset --hard HEAD
          git apply /tmp/release-ktlint.patch
      - name: Verify target-only diff
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'composeApp/src/commonMain/kotlin/com/yfuse/core2/dolby/YMatroskaDolbyVisionMetadata.kt' \
            'composeApp/src/commonMain/kotlin/com/yfuse/feature/player/PlayerStore.kt' | sort)"
          printf 'retained changes:\n%s\n' "$changed"
          if [[ "$changed" != "$expected" ]]; then
            echo '::error::target-only ktlint patch contains an unexpected file'
            exit 1
          fi
          git diff --check
      - name: Commit fixes and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name yfuse-release-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/one-shot-ktlint-release-fix.yml
          git add \
            composeApp/src/commonMain/kotlin/com/yfuse/core2/dolby/YMatroskaDolbyVisionMetadata.kt \
            composeApp/src/commonMain/kotlin/com/yfuse/feature/player/PlayerStore.kt
          git diff --cached --check
          git commit -m 'style: apply remaining release ktlint fixes'
          git push origin HEAD:master
