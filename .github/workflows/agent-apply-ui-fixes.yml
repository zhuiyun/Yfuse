name: Apply requested appearance fixes

on:
  push:
    branches:
      - agent/fix-appearance-server-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply focused source patches
        run: python3 .github/agent_apply_ui_fixes.py

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make appearance and server controls responsive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
