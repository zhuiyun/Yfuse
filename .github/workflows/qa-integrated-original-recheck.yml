name: Recheck the original Sintel group on both cores and retain source probe responses
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: ['.github/workflows/qa-integrated-original-recheck.yml']
permissions: {contents: read, actions: read}
jobs:
  originals:
    name: Original ${{ matrix.engine }} files ${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0]
        engine: [YCore, SenPlayer]
    env:
      QA_ENGINE: ${{ matrix.engine }}
      QA_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Download identical verified candidate and driver
        env: {API_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          bash qa-integrated/acquire-qualified-candidate.sh 44243959207 eccef69f71873cc8f5d9aa35a07e4d63a3c4b830
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          mkdir -p qa-driver results
          artifacts=$(curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/actions/runs/44246033227/artifacts?per_page=100")
          driver=$(jq -er '.artifacts[] | select(.name=="arm-input-driver" and .expired==false) | .id' <<<"$artifacts")
          [[ "$driver" =~ ^[0-9]+$ ]]
          curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/actions/artifacts/$driver/zip" -o "$RUNNER_TEMP/driver.zip"
          hash=$(jq -er --arg id "$driver" '.artifacts[] | select((.id|tostring)==$id) | .digest' <<<"$artifacts")
          test "$hash" = "sha256:$(sha256sum "$RUNNER_TEMP/driver.zip" | cut -d' ' -f1)"
          unzip -q "$RUNNER_TEMP/driver.zip" -d qa-driver
          grep -Fx '841069db7ad03836c62d59318b0a55c4a29d3a3b66e02b48338f7122b276f3e6  composeApp-release.apk' preview/apk.sha256
          cp preview/provenance.txt preview/apk.sha256 results/
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
      - name: Boot cloud ARM64 Android
        run: bash qa-arm-dual/redroid.sh
      - name: Measure both seeks on each original
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          adb install -r -g preview/composeApp-release.apk
          adb install -r qa-driver/driver.apk
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000
          adb shell wm dismiss-keyguard
          touch /tmp/yfuse-tree-active
          /usr/bin/python3 qa-arm-matrix/engine.py "$QA_ENGINE"
          /usr/bin/python3 qa-arm-original/gate.py "$QA_SHARD" 8
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'rechecked-original-${{ matrix.engine }}-${{ matrix.shard }}', path: results/, retention-days: 10}
