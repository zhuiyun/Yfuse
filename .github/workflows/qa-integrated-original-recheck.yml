name: Recheck the original YCore NASA group after the DNS control
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: ['.github/workflows/qa-integrated-original-recheck.yml']
permissions: {contents: read, actions: read}
jobs:
  originals:
    name: Original ${{ matrix.engine }} files ${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [4]
        engine: [YCore]
    env:
      QA_ENGINE: ${{ matrix.engine }}
      QA_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Download identical verified candidate and driver
        env: {API_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          mkdir -p preview qa-driver results
          for i in $(seq 1 240); do
            artifacts=$(curl -fsSL -H "Authorization: Bearer $API_TOKEN" "$api/actions/runs/44068585060/artifacts")
            app=$(jq -r '.artifacts[] | select(.name=="candidate-test-input" and .expired==false) | .id' <<<"$artifacts")
            driver=$(jq -r '.artifacts[] | select(.name=="arm-input-driver" and .expired==false) | .id' <<<"$artifacts")
            if [[ "$app" =~ ^[0-9]+$ && "$driver" =~ ^[0-9]+$ ]]; then break; fi
            sleep 10
          done
          test -n "$app" && test -n "$driver"
          curl -fsSL -H "Authorization: Bearer $API_TOKEN" "$api/actions/artifacts/$app/zip" -o "$RUNNER_TEMP/app.zip"
          curl -fsSL -H "Authorization: Bearer $API_TOKEN" "$api/actions/artifacts/$driver/zip" -o "$RUNNER_TEMP/driver.zip"
          unzip -q "$RUNNER_TEMP/app.zip" -d preview
          unzip -q "$RUNNER_TEMP/driver.zip" -d qa-driver
          (cd preview && sha256sum -c apk.sha256)
          grep -Fx "app=fe814ec63fb1c035ff9fb123146e3ed3700a2b16" preview/provenance.txt
          cp preview/provenance.txt preview/apk.sha256 results/
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
      - name: Boot cloud ARM64 Android
        run: bash qa-arm-dual/redroid.sh
      - name: Measure both seeks on each original
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          adb install -r -g preview/composeApp-release.apk
          adb install -r qa-driver/driver.apk
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000
          adb shell wm dismiss-keyguard
          touch /tmp/yfuse-tree-active
          /usr/bin/python3 qa-arm-matrix/engine.py "$QA_ENGINE"
          /usr/bin/python3 qa-arm-original/gate.py "$QA_SHARD" 8
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'rechecked-original-${{ matrix.engine }}-${{ matrix.shard }}', path: results/, retention-days: 10}
