name: HarmonyOS Cangjie source gates

on:
  push:
    branches:
      - feature/harmony-cangjie
    paths:
      - .github/workflows/harmony-source-gates.yml
      - harmonyApp/**
      - parity/**
      - scripts/harmony-release-gate.py
      - scripts/validate-cangjie-sources.py
      - scripts/verify-harmony-port.py
      - third_party/harmony-media/**
      - ycore-native/**
  pull_request:
    paths:
      - .github/workflows/harmony-source-gates.yml
      - harmonyApp/**
      - parity/**
      - scripts/harmony-release-gate.py
      - scripts/validate-cangjie-sources.py
      - scripts/verify-harmony-port.py
      - third_party/harmony-media/**
      - ycore-native/**

permissions:
  contents: read

concurrency:
  group: harmony-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate Cangjie contracts and portable YCore ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
      - name: Install source-gate dependency
        run: python3 -m pip install 'PyYAML==6.0.3'
      - name: Validate Cangjie source structure
        run: python3 scripts/validate-cangjie-sources.py
      - name: Verify parity contracts and portable YCore ABI
        run: python3 scripts/verify-harmony-port.py
      - name: Confirm unsigned releases fail closed
        shell: bash
        run: |
          set +e
          python3 scripts/harmony-release-gate.py
          status=$?
          set -e
          if [[ "$status" -ne 2 ]]; then
            echo "::error::Unsigned CI preflight must stop with exit code 2; got $status"
            exit 1
          fi
