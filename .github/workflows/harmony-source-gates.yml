name: HarmonyOS Cangjie source gates

on:
  push:
    branches:
      - master
      - feature/harmony-cangjie
    paths:
      - .github/workflows/harmony-source-gates.yml
      - harmonyApp/**
      - parity/**
      - scripts/harmony-release-gate.py
      - scripts/validate-cangjie-sources.py
      - scripts/verify-harmony-port.py
      - scripts/verify-cangjie-host.py
      - scripts/check-validation-env.py
      - scripts/requirements-validation.txt
      - scripts/tests/test_harmony_validation.py
      - scripts/tests/test_validation_env.py
      - third_party/harmony-media/**
      - ycore-native/**
  pull_request:
    paths:
      - .github/workflows/harmony-source-gates.yml
      - harmonyApp/**
      - parity/**
      - scripts/harmony-release-gate.py
      - scripts/validate-cangjie-sources.py
      - scripts/verify-harmony-port.py
      - scripts/verify-cangjie-host.py
      - scripts/check-validation-env.py
      - scripts/requirements-validation.txt
      - scripts/tests/test_harmony_validation.py
      - scripts/tests/test_validation_env.py
      - third_party/harmony-media/**
      - ycore-native/**

permissions:
  contents: read

concurrency:
  group: harmony-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate Cangjie contracts and portable YCore ABI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
      - name: Install source-gate dependency
        run: python3 -m pip install -r scripts/requirements-validation.txt
      - name: Check source validation prerequisites
        run: python3 scripts/check-validation-env.py --profile harmony-source --report build/validation/harmony-env.json
      - name: Test validation coverage and workflow triggers
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_harmony_validation.py'
          python3 -m unittest discover -s scripts/tests -p 'test_validation_env.py'
      - name: Validate Cangjie source structure
        run: python3 scripts/validate-cangjie-sources.py
      - name: Verify parity contracts and portable YCore ABI
        run: python3 scripts/verify-harmony-port.py --report build/validation/harmony-source.json
      - name: Confirm unsigned releases fail closed
        shell: bash
        run: |
          set +e
          python3 scripts/harmony-release-gate.py
          status=$?
          set -e
          if [[ "$status" -ne 2 ]]; then
            echo "::error::Unsigned CI preflight must stop with exit code 2; got $status"
            exit 1
          fi
      - name: Save actual source and host coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harmony-source-validation
          path: build/validation/*.json
          if-no-files-found: warn
