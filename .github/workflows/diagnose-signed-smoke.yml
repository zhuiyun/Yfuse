name: Temporary pinned signed APK smoke diagnosis

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/diagnose-signed-smoke.yml
      - scripts/collect_android_boot_readiness.py
      - scripts/android_cloud_ui.py

permissions:
  contents: read
  actions: read

jobs:
  collect:
    if: github.repository == 'zhuiyun/Yfuse' && contains(github.event.head_commit.message, '[diagnose smoke]') && contains(github.event.head_commit.message, '[artifact only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            sdk: "35"
          - api: 36
            sdk: "36"
          - api: 37
            sdk: "37.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the fixed diagnostic artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/zhuiyun/Yfuse/actions/artifacts/12049354323 > artifact.json
          python3 - <<'PY'
          import json
          artifact = json.load(open("artifact.json"))
          assert artifact["id"] == 12049354323
          assert artifact["name"] == "android-release-signed-1"
          assert artifact["expired"] is False
          assert artifact["digest"] == "sha256:eed43d09f8a898e0bbc168f0a4ff8f4be7036e904d3f1008d8319ed44b8172d4"
          assert artifact["workflow_run"]["id"] == 38907588548
          assert artifact["workflow_run"]["head_sha"] == "ba083f1d3144bf66e6310598cb018cc84137c4d9"
          PY
          mkdir -p artifacts/diagnostic-smoke
          cp artifact.json artifacts/diagnostic-smoke/artifact-provenance.json
      - name: Download only the fixed signed diagnostic APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 12049354323
          merge-multiple: true
          run-id: 38907588548
          github-token: ${{ github.token }}
          path: artifacts/cloud-input
      - name: Enable existing emulator hardware acceleration
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo rm -rf "${ANDROID_HOME:?}/cmdline-tools"
      - name: Run the complete smoke against the fixed signed APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.sdk }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: >-
            python3 scripts/android_cloud_ui.py --apk-directory artifacts/cloud-input
            --output artifacts/diagnostic-smoke --source-run 38907588548 --expected-api ${{ matrix.api }}
            --expected-sha256 5cd5e08e8492137b0d04aa2b98610172ae360c144a5fd520883faa3059747b39
            --expected-version-code 292 --expected-version-name 1.4.0
      - name: Keep the diagnostic observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pinned-smoke-api-${{ matrix.api }}-${{ github.run_id }}
          path: artifacts/diagnostic-smoke/
          if-no-files-found: error
          retention-days: 7
