name: Cast a moving timecode to an independent DLNA renderer and return to both cores
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: [.github/workflows/qa-dlna-receiver.yml, qa-power-ui/cast_receiver.py, qa-power-ui/check_cast_bridge.py]
permissions: {contents: read, actions: read}
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Download the recorded ARM64 device results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-video-repair-contracts
          run-id: 44391996767
          github-token: ${{ github.token }}
          path: contracts
      - name: Require the fixed device discovery and its failing old control
        run: python3 qa-integrated/check-cast-contract.py contracts > cast-qualification.json
      - name: Download the very same candidate used in the device results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-test-input
          run-id: 44391996767
          github-token: ${{ github.token }}
          path: preview
      - name: Verify the build and both immutable artifact identities for this receiver study
        env: {API_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          run=44391996767
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run"
          curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/jobs?per_page=100" | jq -e '[.jobs[] | select(.name=="build") | .conclusion]==["success"]' >/dev/null
          curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/artifacts?per_page=100" > "$RUNNER_TEMP/cast-artifacts.json"
          jq -e '[.artifacts[] | select(.name=="native-video-repair-contracts" and .expired==false) | [.id,.digest,.workflow_run.id]]==[[14471538540,"sha256:813ef007a2083fc835cae15c81db32f8f99ba00eac71573c5215d263ff48ebe1",44391996767]]' "$RUNNER_TEMP/cast-artifacts.json" >/dev/null
          jq -e '[.artifacts[] | select(.name=="candidate-test-input" and .expired==false) | [.id,.digest,.workflow_run.id]]==[[14470445966,"sha256:8bdf2f580ae6d7650efafcadaa85710129b8204054ab4392e0922cff1d59a4ab",44391996767]]' "$RUNNER_TEMP/cast-artifacts.json" >/dev/null
          (cd preview && sha256sum -c apk.sha256)
          grep -Fx 'app=fa4ffc7524fd1518680ad6e6965a7200b9255758' preview/provenance.txt
          grep -Fx 'cast_discovery_from=8cdb127108db020a0e78153c77cc070af0816e07' preview/geometry-negative-provenance.txt
          mkdir candidate
          cp preview/composeApp-release.apk preview/provenance.txt cast-qualification.json candidate/
          awk '$2 == "composeApp-release.apk" { print }' preview/apk.sha256 > candidate/apk.sha256
          test "$(wc -l < candidate/apk.sha256)" -eq 1
          (cd candidate && sha256sum -c apk.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: cast-input, path: candidate/, retention-days: 5}
  cast:
    needs: candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix: {engine: [YCore, SenPlayer]}
    env:
      QA_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: cast-input, path: preview}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arm-input-driver
          path: driver
          run-id: 44358745639
          github-token: '${{ github.token }}'
      - run: bash qa-arm-dual/redroid.sh
      - name: Start the receiver on the private Docker bridge
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
          mkdir -p "$RUNNER_TEMP/cast-frames" results/cast
          docker pull --platform linux/arm64 ubuntu:24.04
          docker image inspect ubuntu:24.04 --format '{{index .RepoDigests 0}}' > results/cast/receiver-image.txt
          docker run -d --name qa-receiver --platform linux/arm64 --network bridge --volume "$RUNNER_TEMP/cast-frames:/frames" ubuntu:24.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends gmediarender gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
            dpkg-query -W gmediarender gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav > /frames/versions.txt
            gmediarender --help-all > /tmp/receiver-help.txt
            grep -q -- "--gstout-videopipe" /tmp/receiver-help.txt
            if grep -q -- "--interface-name" /tmp/receiver-help.txt; then
              binding="--interface-name=eth0"
            else
              binding="--ip-address=$(hostname -I | cut -d" " -f1)"
            fi
            touch /frames/ready
            exec gmediarender "$binding" --friendly-name="Yfuse QA Renderer" --gstout-audiosink=fakesink --logfile=stderr --gstout-videopipe="videorate ! video/x-raw,framerate=1/1 ! videoconvert ! videoscale ! video/x-raw,format=RGB,width=160,height=90 ! multifilesink location=/frames/frame-%08d.rgb max-files=12 sync=true"'
          for i in $(seq 1 160); do
            if test -f "$RUNNER_TEMP/cast-frames/ready"; then break; fi
            test "$(docker inspect qa-receiver --format '{{.State.Running}}')" = true
            sleep 3
          done
          test -f "$RUNNER_TEMP/cast-frames/ready"
          cp "$RUNNER_TEMP/cast-frames/versions.txt" results/cast/
          for i in $(seq 1 20); do
            if docker logs qa-receiver 2>&1 | grep -F 'Ready for rendering' >/dev/null; then break; fi
            sleep 1
          done
          guest_pid=$(docker inspect --format '{{.State.Pid}}' qa-android)
          peer=$(docker inspect --format '{{.NetworkSettings.Networks.bridge.IPAddress}}' qa-receiver)
          if sudo nsenter --target "$guest_pid" --net /usr/bin/python3 qa-power-ui/check_cast_bridge.py "$peer" > results/cast/discovery-control.json 2> results/cast/discovery-control-errors.txt; then
            echo passed > results/cast/discovery-control-status.txt
          else
            echo failed > results/cast/discovery-control-status.txt
          fi
      - name: Discover, connect, seek, pause, resume and stop through the installed app
        run: |
          set -euo pipefail
          (cd preview && sha256sum -c apk.sha256)
          cp preview/provenance.txt preview/apk.sha256 preview/cast-qualification.json results/cast/
          adb install -r -g preview/composeApp-release.apk
          adb install -r driver/driver.apk
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000
          adb shell wm dismiss-keyguard
          touch /tmp/yfuse-tree-active
          /usr/bin/python3 qa-power-ui/cast_receiver.py
          grep -Fx passed results/cast/discovery-control-status.txt
      - name: Retain the temporary receiver diagnostics
        if: always()
        run: |
          mkdir -p results/cast
          docker logs --tail 400 qa-receiver > results/cast/receiver-log.txt 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'dlna-receiver-${{ matrix.engine }}', path: results/cast/, retention-days: 10}
