# Temporary: compile, lint and unit-test feedback for the short-drama work branch, whose
# pushes the regular gates (pull_request / master only) do not cover. Remove before merging.
name: Session branch checks

on:
  push:
    branches:
      - ccr-9a50929d-07i3hs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session-branch-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ktlint, design contracts and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android 37.0
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Fetch compile-only player APIs
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
          test -s composeApp/libs/libmpv-release.aar
      - name: ktlint
        shell: bash
        run: |
          set +e
          ./gradlew ktlintCheck --no-daemon --continue
          status=$?
          set -e
          if (( status != 0 )); then
            find . -path '*/build/reports/ktlint/*/*.txt' -type f -size +0 | sort | while IFS= read -r report; do
              echo "===== $report ====="
              cat "$report"
            done
          fi
          echo "KTLINT_STATUS=$status" >> "$GITHUB_ENV"
      - name: Design-system contracts
        shell: bash
        run: |
          set +e
          ./gradlew :composeApp:verifyDesignSystemUsage --no-daemon
          echo "DESIGN_STATUS=$?" >> "$GITHUB_ENV"
      - name: Compile and run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew :phoneShared:testAndroidHostTest :tvShared:testAndroidHostTest --no-daemon --continue
          status=$?
          set -e
          if (( status != 0 )); then
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("**/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      for node in case.findall(tag):
                          print(f"FAILED {case.get('classname')}.{case.get('name')}")
                          print((node.get("message") or "")[:2000])
                          print((node.text or "")[:4000])
                          print("-" * 80)
          PY
          fi
          echo "TEST_STATUS=$status" >> "$GITHUB_ENV"
      - name: Result
        shell: bash
        run: |
          echo "ktlint=$KTLINT_STATUS design=$DESIGN_STATUS tests=$TEST_STATUS"
          test "$KTLINT_STATUS" = 0 && test "$DESIGN_STATUS" = 0 && test "$TEST_STATUS" = 0
