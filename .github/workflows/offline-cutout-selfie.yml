name: Targeted offline Selfie GLES31 check
on:
  push:
    branches: [probe/offline-selfie-20261025]
    paths: [tools/offline-cutout-probe/run_selfie_device.py, .github/workflows/offline-cutout-selfie.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  selfie:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # This historical check consumes the original Selfie-enabled APK.
          ref: a96a792ddcd7f76bec5e42d039ee704ec4c6db09
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse the exact already verified native test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40213736535 --repo zhuiyun/Yfuse --name offline-native-apks-40213736535 --dir "$RUNNER_TEMP/checked-probe"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, hashlib, shutil
          source=Path(os.environ['RUNNER_TEMP'])/'checked-probe'
          data=json.loads((source/'apk-metadata.json').read_text())
          item=next(x for x in data if x['abi']=='x86')
          apk=source/item['file']
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==item['sha256']
          target=Path('tools/offline-cutout-probe/app/build/outputs/apk/debug/app-x86-debug.apk')
          target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(apk,target)
          print('Verified reused APK',item['sha256'])
          PY
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the same Selfie model with GLES31-capable SwANGLE
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6144M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swangle -feature Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: python3 tools/offline-cutout-probe/run_selfie_device.py
      - name: Retain actual Selfie output and graphics environment
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-selfie-gles31-${{ github.run_id }}
          path: tools/offline-cutout-probe/artifacts/device/
          if-no-files-found: warn
          retention-days: 7
