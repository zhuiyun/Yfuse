name: Isolated ML Kit cutout probe

on:
  push:
    branches:
      - probe/mlkit-cutout-20261025
    paths:
      - tools/mlkit-cutout-probe/**
      - .github/workflows/mlkit-cutout-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlkit-cutout-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch and verify exact public original posters
        run: python3 tools/mlkit-cutout-probe/fetch_inputs.py
      - name: Install compile platform
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$manager" --licenses >/dev/null 2>&1 || true
          "$manager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build only the isolated diagnostic APK
        run: ./gradlew -p tools/mlkit-cutout-probe :app:assembleDebug --no-daemon --max-workers=2
      - name: Enable emulator acceleration
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Try real Google model download and inference
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600
          # The first real run downloaded the model, but its GLES 3.0 backend hit
          # googlesamples/mlkit#915. SwANGLE supplies GLES 3.1 via SwiftShader/Vulkan.
          emulator-options: -no-window -gpu swangle -feature Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: python3 tools/mlkit-cutout-probe/run_device.py
      - name: Save exact APK and all real probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mlkit-cutout-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/mlkit-cutout-probe/artifacts/
            tools/mlkit-cutout-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
