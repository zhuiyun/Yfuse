name: Restore 1.0.7 poster transition v2

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/restore-1.0.7-poster-transition'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out restore branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/restore-1.0.7-poster-transition
          fetch-depth: 0

      - name: Restore exact sampling and adaptive semantic foregrounds
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin codex/restore-1.0.7-source:refs/remotes/origin/restore-1.0.7-source

          merge_delta() {
            local commit="$1"
            local path="$2"
            local parent temp
            parent="$(git rev-parse "${commit}^")"
            temp="$(mktemp -d)"
            cp "$path" "$temp/ours"
            git show "$parent:$path" > "$temp/base"
            git show "$commit:$path" > "$temp/theirs"
            git merge-file --theirs -p "$temp/ours" "$temp/base" "$temp/theirs" > "$temp/merged"
            mv "$temp/merged" "$path"
            rm -rf "$temp"
          }

          merge_delta f4e2194bd63f75b54bb2351fbd386f41951048ee composeApp/src/androidMain/kotlin/com/yfuse/core/designsystem/DominantColor.android.kt
          merge_delta 6c07a97530b0739342fcb9d5210cae70d2ea909c composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/DominantColor.kt
          merge_delta 9a33ccc4e511ec4c6c10e33e8619b07a368ea9c6 composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/Hero.kt
          merge_delta 2cc82e5ec1f7ba98d20c211e36793a59a7a6236f composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt
          merge_delta 123d23d5b633845fcdc0fb1d20f83ef3e72149cb composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt
          merge_delta 0d859908d526c3f1f495ba78f739d18966807673 composeApp/src/commonTest/kotlin/com/yfuse/core/designsystem/DominantColorTest.kt

          cat > composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/ArtworkPageTheme.kt <<'KOTLIN'
          package com.yfuse.core.designsystem

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.CompositionLocalProvider
          import androidx.compose.runtime.remember
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.compositeOver
          import androidx.compose.ui.graphics.lerp
          import androidx.compose.ui.graphics.luminance

          private const val MinimumArtworkPageContrast = 4.5f
          private const val StrongArtworkPageContrast = 7.0f

          internal fun artworkPageContrastRatio(
              first: Color,
              second: Color,
          ): Float {
              val light = maxOf(first.luminance(), second.luminance())
              val dark = minOf(first.luminance(), second.luminance())
              return (light + 0.05f) / (dark + 0.05f)
          }

          private fun readableArtworkInk(
              foreground: Color,
              background: Color,
              minimumContrast: Float,
              lightInk: Boolean,
          ): Color {
              if (artworkPageContrastRatio(foreground, background) >= minimumContrast) return foreground
              val target = if (lightInk) Color.White else Color.Black
              var result = foreground
              repeat(24) {
                  result = lerp(result, target, 0.12f)
                  if (artworkPageContrastRatio(result, background) >= minimumContrast) return result
              }
              return target
          }

          /**
           * Semantic palette for the exact poster-derived page colour.
           *
           * The sampled background is intentionally never retinted here. Altering it would make
           * the fully transparent final hero pixel reveal a different colour and bring the seam
           * back. Readability is solved only on the foreground side.
           */
          fun resolveArtworkPagePalette(background: Color): Palette {
              val darkPaletteContrast = artworkPageContrastRatio(DarkPalette.text, background)
              val lightPaletteContrast = artworkPageContrastRatio(LightPalette.text, background)
              val useDarkPalette = darkPaletteContrast >= lightPaletteContrast
              val base = if (useDarkPalette) DarkPalette else LightPalette
              return base.copy(
                  background = background,
                  text = readableArtworkInk(base.text, background, StrongArtworkPageContrast, useDarkPalette),
                  sub = readableArtworkInk(base.sub, background, MinimumArtworkPageContrast, useDarkPalette),
                  sub2 = readableArtworkInk(base.sub2, background, MinimumArtworkPageContrast, useDarkPalette),
                  body = readableArtworkInk(base.body, background, MinimumArtworkPageContrast, useDarkPalette),
                  hint = readableArtworkInk(base.hint, background, MinimumArtworkPageContrast, useDarkPalette),
                  error = readableArtworkInk(base.error, background, MinimumArtworkPageContrast, useDarkPalette),
                  isDark = useDarkPalette,
              )
          }

          @Composable
          fun rememberArtworkPagePalette(background: Color?): Palette {
              val inherited = LocalPalette.current
              return remember(background, inherited) {
                  background?.let(::resolveArtworkPagePalette) ?: inherited
              }
          }

          /** Publishes the poster-aware semantic palette to Yfuse and Material controls. */
          @Composable
          fun ArtworkPageTheme(
              background: Color?,
              artworkAccent: Color?,
              content: @Composable () -> Unit,
          ) {
              val palette = rememberArtworkPagePalette(background)
              val inheritedArtwork = LocalArtworkAccent.current
              val resolvedArtwork = artworkAccent ?: inheritedArtwork
              val inheritedAccent = LocalAccentColors.current
              val accentColors =
                  remember(resolvedArtwork, palette.isDark, inheritedAccent) {
                      resolvedArtwork?.let { resolveAccentColors(it, dark = palette.isDark) } ?: inheritedAccent
                  }
              val outerScheme = MaterialTheme.colorScheme
              val surface = palette.card.compositeOver(palette.background)
              val surfaceVariant = palette.card2.compositeOver(palette.background)

              CompositionLocalProvider(
                  LocalPalette provides palette,
                  LocalArtworkAccent provides resolvedArtwork,
                  LocalAccentColors provides accentColors,
              ) {
                  MaterialTheme(
                      colorScheme =
                          outerScheme.copy(
                              primary = accentColors.accent,
                              onPrimary = accentColors.onAccent,
                              primaryContainer = accentColors.container,
                              onPrimaryContainer = accentColors.accent,
                              secondary = palette.sub,
                              tertiary = accentColors.accent,
                              onTertiary = accentColors.onAccent,
                              tertiaryContainer = accentColors.container,
                              onTertiaryContainer = accentColors.accent,
                              background = palette.background,
                              onBackground = palette.text,
                              surface = surface,
                              onSurface = palette.text,
                              surfaceVariant = surfaceVariant,
                              onSurfaceVariant = palette.sub2,
                              outline = palette.border,
                              outlineVariant = palette.tabbarBorder,
                              error = palette.error,
                              onError = palette.onError,
                              errorContainer = palette.errorContainer,
                              onErrorContainer = palette.onErrorContainer,
                          ),
                      typography = MaterialTheme.typography,
                      shapes = MaterialTheme.shapes,
                      content = content,
                  )
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path

          def require(text: str, token: str, path: str) -> None:
              if token not in text:
                  raise SystemExit(f"{path}: required token missing: {token!r}")

          home_path = Path("composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt")
          home = home_path.read_text()
          if "import com.yfuse.core.designsystem.ArtworkAccent\n" in home:
              home = home.replace(
                  "import com.yfuse.core.designsystem.ArtworkAccent\n",
                  "import com.yfuse.core.designsystem.ArtworkPageTheme\n",
                  1,
              )
          elif "import com.yfuse.core.designsystem.ArtworkPageTheme\n" not in home:
              raise SystemExit("HomeScreen.kt: artwork theme import missing")
          home = home.replace("[ArtworkAccent]", "[ArtworkPageTheme]", 1)
          if "    ArtworkAccent(heroAccent) {\n" in home:
              home = home.replace(
                  "    ArtworkAccent(heroAccent) {\n",
                  "    ArtworkPageTheme(\n"
                  "        background = heroPageColor,\n"
                  "        artworkAccent = heroAccent,\n"
                  "    ) {\n",
                  1,
              )
          require(home, "ArtworkPageTheme(\n", str(home_path))
          require(home, "rememberArtworkPageColor(", str(home_path))
          home_path.write_text(home)

          library_path = Path("composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt")
          library = library_path.read_text()
          if "import com.yfuse.core.designsystem.ArtworkAccent\n" in library:
              library = library.replace(
                  "import com.yfuse.core.designsystem.ArtworkAccent\n",
                  "import com.yfuse.core.designsystem.ArtworkPageTheme\n",
                  1,
              )
          elif "import com.yfuse.core.designsystem.ArtworkPageTheme\n" not in library:
              raise SystemExit("LibraryHomeScreen.kt: artwork theme import missing")

          if "import com.yfuse.core.designsystem.rememberArtworkPagePalette\n" not in library:
              anchor = "import com.yfuse.core.designsystem.rememberAnimatedArtworkAccent\n"
              require(library, anchor, str(library_path))
              library = library.replace(
                  anchor,
                  anchor + "import com.yfuse.core.designsystem.rememberArtworkPagePalette\n",
                  1,
              )

          # The old palette was chosen solely from the global app theme. Remove that one root
          # declaration, then place the sampled-page palette before the accent is harmonized.
          root_palette = "    val palette = LocalPalette.current\n"
          if root_palette in library:
              library = library.replace(root_palette, "", 1)

          sample_line = "    var sampledPageColor by remember { mutableStateOf<Color?>(null) }\n"
          require(library, sample_line, str(library_path))
          library = library.replace(sample_line, "", 1)
          slide_line = "    val slideUrl = slideUrls.firstOrNull { it != null }\n"
          require(library, slide_line, str(library_path))
          library = library.replace(
              slide_line,
              slide_line
              + sample_line
              + "    val palette = rememberArtworkPagePalette(sampledPageColor)\n",
              1,
          )

          if "    ArtworkAccent(accent) {\n" in library:
              library = library.replace(
                  "    ArtworkAccent(accent) {\n",
                  "    ArtworkPageTheme(\n"
                  "        background = sampledPageColor,\n"
                  "        artworkAccent = accent,\n"
                  "    ) {\n",
                  1,
              )
          require(library, "ArtworkPageTheme(\n", str(library_path))
          require(library, "rememberArtworkPageColor(", str(library_path))
          require(library, "rememberArtworkPagePalette(sampledPageColor)", str(library_path))
          library_path.write_text(library)
          PY

          cat > composeApp/src/commonTest/kotlin/com/yfuse/core/designsystem/ArtworkPageThemeTest.kt <<'KOTLIN'
          package com.yfuse.core.designsystem

          import androidx.compose.ui.graphics.Color
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertFalse
          import kotlin.test.assertTrue

          class ArtworkPageThemeTest {
              @Test
              fun darkPosterColour_keepsRawBackgroundAndUsesReadableLightInk() {
                  val background = Color(0xFF14171D)
                  val palette = resolveArtworkPagePalette(background)
                  assertEquals(background, palette.background)
                  assertTrue(palette.isDark)
                  assertReadable(palette, background)
              }

              @Test
              fun lightPosterColour_keepsRawBackgroundAndUsesReadableDarkInk() {
                  val background = Color(0xFFE8D7C4)
                  val palette = resolveArtworkPagePalette(background)
                  assertEquals(background, palette.background)
                  assertFalse(palette.isDark)
                  assertReadable(palette, background)
              }

              @Test
              fun middleTonePoster_stillProtectsEveryTextRole() {
                  val background = Color(0xFF6F7480)
                  val palette = resolveArtworkPagePalette(background)
                  assertEquals(background, palette.background)
                  assertReadable(palette, background)
              }

              private fun assertReadable(
                  palette: Palette,
                  background: Color,
              ) {
                  assertTrue(artworkPageContrastRatio(palette.text, background) >= 7.0f)
                  listOf(palette.sub, palette.sub2, palette.body, palette.hint, palette.error).forEach {
                      assertTrue(artworkPageContrastRatio(it, background) >= 4.5f)
                  }
              }
          }
          KOTLIN

          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
            composeApp/src/androidMain/kotlin/com/yfuse/core/designsystem/DominantColor.android.kt \
            composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/DominantColor.kt \
            composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/Hero.kt \
            composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/ArtworkPageTheme.kt \
            composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt \
            composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt \
            composeApp/src/commonTest/kotlin/com/yfuse/core/designsystem/DominantColorTest.kt \
            composeApp/src/commonTest/kotlin/com/yfuse/core/designsystem/ArtworkPageThemeTest.kt; then
            echo '::error::Merge conflict markers remain'
            exit 1
          fi

          git diff --check

          rm -f \
            .github/workflows/restore-1.0.7-poster-transition.yml \
            .github/workflows/restore-1.0.7-poster-transition-v2.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): restore 1.0.7 poster sampling with adaptive contrast'
          git push origin HEAD:codex/restore-1.0.7-poster-transition
