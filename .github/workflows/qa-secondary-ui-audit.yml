name: Verify all pages and file information after the upstream read repair
'on':
  push:
    branches:
    - codex/two-engines-cloud-seek-20261113
    paths:
    - .github/workflows/qa-secondary-ui-audit.yml
permissions:
  contents: read
  actions: read
env:
  QA_APP_SHA: 382077026e5747530f320c0188ba2eeebd529b7e
  QA_BUILD_RUN: 44469657784
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Acquire current fully qualified candidate
      env:
        API_TOKEN: ${{ github.token }}
      run: |
        bash qa-integrated/acquire-qualified-candidate.sh "$QA_BUILD_RUN" "$QA_APP_SHA"
        cp "$RUNNER_TEMP/qualified-build.json" preview/baseline-build-run.json
        cp "$RUNNER_TEMP/qualified-jobs.json" preview/baseline-build-jobs.json
        printf '%s\n' 'Qualified candidate; screenshots still need visual review.' > preview/baseline-limit.txt
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: power-ui-baseline-input
        path: 'preview/composeApp-release.apk

          preview/provenance.txt

          preview/apk.sha256

          preview/baseline-build-run.json

          preview/baseline-build-jobs.json

          preview/baseline-limit.txt'
        retention-days: 10
    - name: Build visible editable-control instrumentation
      run: 'set -euo pipefail

        mkdir qa-driver

        cp qa-arm-matrix/Driver.java qa-volume/input-driver.java

        sed ''s|adb install -r driver.apk|cp driver.apk "$GITHUB_WORKSPACE/qa-driver/driver.apk"|''
        qa-volume/build-driver.sh > "$RUNNER_TEMP/driver.sh"

        bash "$RUNNER_TEMP/driver.sh"'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: power-ui-input-driver
        path: qa-driver/
        retention-days: 7
  ui:
    name: Verified page evidence ${{ matrix.scope }} ${{ matrix.variant }}
    needs: acquire
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
        - variant: light
          scope: secondary
          routes: ''
        - variant: light
          scope: primary
          routes: ''
        - variant: dark-large
          scope: secondary
          routes: ''
        - variant: dark-large
          scope: primary
          routes: ''
    env:
      QA_UI_SCOPE: ${{ matrix.scope }}
      QA_UI_TRACE: true
      QA_ACCOUNT_ENTRY_CHECKS: 'true'
      QA_UI_ROUTES: ${{ matrix.routes }}
      QA_UI_VARIANT: ${{ matrix.variant }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: power-ui-baseline-input
        path: preview
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: power-ui-input-driver
        path: qa-driver
    - name: Verify runtime and prepare evidence tools
      run: 'set -euo pipefail

        mkdir -p results

        # apk.sha256 may also name unrelated build inputs; verify this exact app entry.

        (cd preview && grep ''composeApp-release.apk$'' apk.sha256 | sha256sum -c
        -)

        grep -Fx "app=$QA_APP_SHA" preview/provenance.txt

        cp preview/provenance.txt preview/apk.sha256 preview/baseline-build-*.json
        preview/baseline-limit.txt results/

        printf ''qa=%s\nrun=%s\n'' "$GITHUB_SHA" "$GITHUB_RUN_ID" > results/qa-provenance.txt

        sudo apt-get update -qq

        sudo apt-get install -y ffmpeg python3-pil

        '
    - name: Boot disposable cloud ARM64 Android
      run: bash qa-arm-dual/redroid.sh
    - name: Install exact candidate and UI evidence driver
      run: 'set -euo pipefail

        test "$GITHUB_ACTIONS" = true

        adb install -r -g preview/composeApp-release.apk

        adb install -r qa-driver/driver.apk

        adb shell wm size 720x1280

        adb shell wm density 260

        adb shell settings put secure immersive_mode_confirmations confirmed

        adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000

        adb shell wm dismiss-keyguard

        touch /tmp/yfuse-tree-active

        adb shell getprop > results/guest-properties.txt

        docker inspect qa-android --format ''{{.Image}}'' > results/cloud-image.txt

        '
    - name: Capture current native pages and all reachable scroll states
      run: /usr/bin/python3 qa-power-ui/capture.py
    - name: Measure text on the painted movie and episode information cards
      if: matrix.scope == 'primary'
      run: /usr/bin/python3 qa-power-ui/check_detail_specs.py results/ui --output results/ui/file-info-contrast.json --count-only-audio
    - name: Verify both themes on engine recommendations, text and source controls
      if: matrix.scope == 'primary'
      run: /usr/bin/python3 qa-power-ui/check_profile_detail_contrast.py results/ui --output results/ui/profile-detail-contrast.json
    - name: Acquire the TV build that passed the same source revision
      if: matrix.scope == 'secondary' && matrix.variant == 'light'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: yfuse-tv-debug-${{ env.QA_APP_SHA }}
        run-id: 44469555825
        github-token: ${{ github.token }}
        path: build/tv-quality
    - name: Verify signed-out TV remote navigation after finishing the phone capture
      if: matrix.scope == 'secondary' && matrix.variant == 'light'
      env:
        API_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        test "$GITHUB_ACTIONS" = true
        mkdir -p results/tv-signed-out
        curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/44469555825" | jq -e --arg sha "$QA_APP_SHA" '{id,head_sha,path,conclusion} | select(.id==44469555825 and .head_sha==$sha and .path==".github/workflows/tv-quality-gates.yml" and .conclusion=="success")' > results/tv-signed-out/tv-build.json
        sha256sum -c build/tv-quality/SHA256SUMS
        sha256sum build/tv-quality/Yfuse-TV-debug.apk > results/tv-signed-out/tv-apk.sha256
        adb uninstall com.yfuse
        adb install -g build/tv-quality/Yfuse-TV-debug.apk
        adb shell wm size 1280x720
        adb shell wm density 200
        /usr/bin/python3 qa-power-ui/tv_handoff_entry.py
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ui-verified-${{ matrix.scope }}-${{ matrix.variant }}
        path: results/
        retention-days: 14
