name: Finalize 1.0.7 poster transition v2

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/restore-1.0.7-poster-transition'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out restore branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/restore-1.0.7-poster-transition
          fetch-depth: 0

      - name: Finalize transition contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          hero_path = Path("composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/Hero.kt")
          hero = hero_path.read_text()
          pattern = re.compile(r"fun heroTopScrim\(.*?\n\s*\)\n\n(?=/\*\*\n \* Page colour under the artwork)", re.S)
          replacement = '''fun heroTopScrim(
              topInk: Float = 0.58f,
              midInk: Float = 0.24f,
          ): Brush =
              scrim(
                  0f to Color.Transparent,
                  0.46f to Color.Transparent,
                  0.80f to HeroInk.copy(alpha = midInk),
                  1f to HeroInk.copy(alpha = topInk),
              )

          '''
          hero, count = pattern.subn(replacement, hero, count=1)
          if count != 1:
              raise SystemExit(f"Hero.kt: heroTopScrim replacement count={count}")
          start = hero.index("val HeroPageFade: Dp =")
          end = hero.index("/**\n * Pulls content up over the lower edge of the hero", start)
          contract = '''val HeroPageFade: Dp = 120.dp

          /** Copy stays out of the part of the hero that has mostly dissolved into the page. */
          val HeroCaptionClearance: Dp = HeroPageFade - 20.dp

          fun Modifier.fadeIntoPage(height: Dp = HeroPageFade): Modifier =
              this
                  .graphicsLayer { compositingStrategy = CompositingStrategy.Offscreen }
                  .drawWithContent {
                      drawContent()
                      val fade = height.toPx().coerceAtMost(size.height)
                      if (fade <= 0f) return@drawWithContent
                      val top = size.height - fade
                      drawRect(
                          brush = Brush.verticalGradient(
                              colorStops = heroPageFadeMaskStops(),
                              startY = top,
                              endY = size.height,
                          ),
                          topLeft = Offset(0f, top),
                          size = Size(size.width, fade),
                          blendMode = BlendMode.DstOut,
                      )
                  }

          internal fun heroPageFadeMaskStops(): Array<Pair<Float, Color>> =
              arrayOf(
                  0f to Color.Transparent,
                  0.28f to Color.Black.copy(alpha = 0.10f),
                  0.58f to Color.Black.copy(alpha = 0.55f),
                  0.82f to Color.Black.copy(alpha = 0.94f),
                  0.90f to Color.Black,
                  1f to Color.Black,
              )

          '''
          hero = hero[:start] + contract + hero[end:]
          hero_path.write_text(hero)

          home_path = Path("composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt")
          home = home_path.read_text()
          home = home.replace("import com.yfuse.core.designsystem.heroReelScrim\n", "")
          home = home.replace("import com.yfuse.core.designsystem.pageTint\n", "")
          if "import com.yfuse.core.designsystem.heroTopScrim\n" not in home:
              anchor = "import com.yfuse.core.designsystem.heroMediaTypeLabel\n"
              if anchor not in home: raise SystemExit("Home hero import anchor missing")
              home = home.replace(anchor, anchor + "import com.yfuse.core.designsystem.heroTopScrim\n", 1)
          home = re.sub(r"\n    val ground = pageTint\(heroAccent \?: Brand\.Primary\) // design-system: brand-identity\n", "\n", home, count=1)
          home = home.replace("modifier = Modifier.fillMaxSize().background(ground),", "modifier = Modifier.fillMaxSize(),", 1)
          home = re.sub(r"\n    val slideGround = pageTint\(artworkAccent\)\n", "\n", home, count=1)
          home = re.sub(
              r"\n\s*// The alpha mask reveals this slide's own ground\..*?\n\s*\.background\(slideGround\)",
              "",
              home,
              count=1,
              flags=re.S,
          )
          home = home.replace("heroReelScrim()", "heroTopScrim()")
          if any(token in home for token in ("pageTint(", "slideGround", "heroReelScrim()")):
              raise SystemExit("Home stale derived transition remains")
          home_path.write_text(home)

          library_path = Path("composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt")
          library = library_path.read_text()
          library = library.replace("import com.yfuse.core.designsystem.heroReelScrim\n", "")
          library = library.replace("import com.yfuse.core.designsystem.pageTint\n", "")
          if "import com.yfuse.core.designsystem.heroTopScrim\n" not in library:
              anchor = "import com.yfuse.core.designsystem.heroMediaTypeLabel\n"
              if anchor not in library: raise SystemExit("Library hero import anchor missing")
              library = library.replace(anchor, anchor + "import com.yfuse.core.designsystem.heroTopScrim\n", 1)

          pattern = re.compile(
              r"    val accent =\n        rememberAnimatedDominantColor\(\n            slideUrl,\n            Brand\.Primary, // design-system: brand-identity\n        \)\n"
          )
          root_accent = '''    val accent =
              rememberAnimatedArtworkAccent(
                  url = slideUrl,
                  fallback = Brand.Primary, // design-system: brand-identity
                  darkTheme = palette.isDark,
                  identity = slide?.id,
              )
          '''
          library, count = pattern.subn(root_accent, library, count=1)
          if count != 1: raise SystemExit(f"Library root accent replacement count={count}")

          library = re.sub(
              r"\n    // The room the shelves sit in, taken from whatever the carousel is showing\..*?\n    val ground = pageTint\(accent\)\n",
              "\n",
              library,
              count=1,
              flags=re.S,
          )
          library = library.replace("BoxWithConstraints(Modifier.fillMaxSize().background(ground)) {", "BoxWithConstraints(Modifier.fillMaxSize()) {", 1)

          ambient_pattern = re.compile(
              r"(?m)^(?P<i>\s*)LivingPosterAmbient\(\n(?P=i)    urls = slideUrls,\n(?P=i)    modifier = Modifier\.fillMaxSize\(\),\n(?P=i)\)"
          )
          def ambient_replacement(match):
              i = match.group("i")
              return (
                  f"{i}// No second full-bleed copy on phones: it would show through the dissolve.\n"
                  f"{i}if (showSidePreview) {{\n"
                  f"{i}    LivingPosterAmbient(\n"
                  f"{i}        urls = slideUrls,\n"
                  f"{i}        modifier = Modifier.fillMaxSize().fadeIntoPage(),\n"
                  f"{i}    )\n"
                  f"{i}}}"
              )
          library, count = ambient_pattern.subn(ambient_replacement, library, count=1)
          if count != 1: raise SystemExit(f"Library ambient replacement count={count}")
          library = library.replace("beyondViewportPageCount = 1,", "beyondViewportPageCount = 0,", 1)

          per_page = re.compile(
              r"\n\s*val animatedAccent =\n\s*rememberAnimatedDominantColor\(.*?\n\s*\)\n",
              re.S,
          )
          library, count = per_page.subn("\n", library, count=1)
          if count != 1: raise SystemExit(f"Library duplicate accent removal count={count}")
          library = library.replace("accent = animatedAccent,", "accent = accent,", 1)
          library = re.sub(
              r"\n\s*// The mask below reveals this item's colour, including while two pager pages are\n\s*// simultaneously visible during a drag\.\n\s*\.background\(slideGround\)",
              "",
              library,
              count=1,
          )
          library = library.replace("heroReelScrim()", "heroTopScrim()")
          if any(token in library for token in ("pageTint(", "slideGround", "rememberAnimatedDominantColor(", "heroReelScrim()")):
              raise SystemExit("Library stale derived transition remains")
          library_path.write_text(library)
          PY

          git diff --check
          grep -q 'val HeroPageFade: Dp = 120.dp' composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/Hero.kt
          grep -q '0.90f to Color.Black' composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/Hero.kt
          grep -q 'ArtworkPageTheme' composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt
          grep -q 'ArtworkPageTheme' composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt
          grep -q 'rememberArtworkPageColor' composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt
          grep -q 'rememberArtworkPageColor' composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt

          rm -f \
            .github/workflows/finalize-1.0.7-poster-transition.yml \
            .github/workflows/finalize-1.0.7-poster-transition-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): align exact 1.0.7 poster dissolve contract'
          git push origin HEAD:codex/restore-1.0.7-poster-transition
