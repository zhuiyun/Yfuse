name: Publish verified YCore native release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Build YCore native runtime run ID
        required: true
        type: string
      release_tag:
        description: New immutable YCore dependency release tag
        required: true
        default: native-ycore-ffmpeg-b79d4c4-arm64-20260827
        type: string
      expected_ycore_sha256:
        description: SHA-256 of ycore-native.aar after artifact extraction
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-ycore-native-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Re-verify and publish immutable YCore runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_YCORE_SHA256: ${{ inputs.expected_ycore_sha256 }}
    steps:
      - name: Check out release policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate immutable release request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^native-ycore-[a-zA-Z0-9._-]+$ ]]
          [[ "$EXPECTED_YCORE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Native release $RELEASE_TAG already exists; refusing to replace it"
            exit 1
          fi
          run_metadata="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json conclusion,workflowName \
            --jq '[.conclusion, .workflowName] | @tsv')"
          IFS=$'\t' read -r conclusion workflow_name <<<"$run_metadata"
          [[ "$conclusion" == "success" ]] || {
            echo "::error::Source run $SOURCE_RUN_ID did not complete successfully"
            exit 1
          }
          [[ "$workflow_name" == "Build YCore native runtime" ]] || {
            echo "::error::Source run belongs to unexpected workflow: $workflow_name"
            exit 1
          }

      - name: Download verified workflow artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-release
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ycore-native-arm64 \
            --dir native-release
          test -f native-release/ycore-native.aar
          test -f native-release/ycore-native.aar.sha256
          test -f native-release/NATIVE-SOURCES.txt
          test -f native-release/BUILD-MANIFEST.txt

      - name: Re-run standalone YCore release gates
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum native-release/ycore-native.aar | awk '{ print $1 }')"
          [[ "$actual" == "$EXPECTED_YCORE_SHA256" ]] || {
            echo "::error::AAR SHA-256 mismatch: expected $EXPECTED_YCORE_SHA256, got $actual"
            exit 1
          }
          bash scripts/verify-ycore-native.sh \
            native-release/ycore-native.aar \
            native-release/ycore-native.aar.sha256 \
            native-release/NATIVE-SOURCES.txt

      - name: Publish permanent YCore dependency release
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/ycore-release-notes.md"
          cat >"$notes" <<EOF
          YCore standalone arm64 native playback runtime.

          - YCore-owned demux, software video/audio decode and A/V output path
          - HDR10/HDR10+/HLG tone mapping with explicit Dolby Vision routing boundaries
          - Native Blu-ray title, chapter and angle navigation through libbluray
          - Dependency-closed FFmpeg/libbluray native libraries
          - No libmpv, libplayer, MDK, or Java engine classes
          - 16 KiB Android page alignment verified for every packaged native library
          - Protected AACS/BD+ media and HDMV/BD-J interactive menus remain fail-closed

          Artifact SHA-256: \`$EXPECTED_YCORE_SHA256\`

          Built and verified by GitHub Actions run $SOURCE_RUN_ID; published by commit $GITHUB_SHA.
          EOF
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "YCore standalone native runtime arm64" \
            --notes-file "$notes" \
            native-release/ycore-native.aar \
            native-release/ycore-native.aar.sha256 \
            native-release/NATIVE-SOURCES.txt \
            native-release/BUILD-MANIFEST.txt
