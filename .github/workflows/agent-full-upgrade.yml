name: Agent full Yfuse upgrade

on:
  push:
    branches:
      - agent/unify-home-tab-reduce-transparency

permissions:
  contents: write

concurrency:
  group: agent-full-yfuse-upgrade
  cancel-in-progress: true

jobs:
  build-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/unify-home-tab-reduce-transparency
          fetch-depth: 1

      - name: Apply phase 2A
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/agent_full_upgrade_phase2a.py
          python3 scripts/agent_full_upgrade_phase2a_fixup.py
          git diff --check
          if [[ -n "$(git status --porcelain composeApp)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
          test -f composeApp/libs/libmpv-release.aar
          test -f composeApp/libs/mdk-sdk/lib/cmake/FindMDK.cmake

      - name: Compile Android
        shell: bash
        run: ./gradlew :composeApp:compileDebugKotlinAndroid --no-daemon

      - name: Compile and run stable affected tests
        shell: bash
        run: |
          ./gradlew :composeApp:testDebugUnitTest --no-daemon \
            --tests 'com.yfuse.core.data.GenreFacetNormalizationTest' \
            --tests 'com.yfuse.core.designsystem.NavigationIdentityTest' \
            --tests 'com.yfuse.feature.library.LibraryGridStoreTest.genres_fill_the_filter_row_and_a_selection_narrows_the_query'

      - name: Commit phase 2A source
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/src
          git diff --cached --check
          git commit -m "feat: unify playback selection and search filters"
          git push origin HEAD:agent/unify-home-tab-reduce-transparency
