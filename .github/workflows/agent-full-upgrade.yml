name: Agent full Yfuse upgrade

on:
  push:
    branches:
      - agent/unify-home-tab-reduce-transparency

permissions:
  contents: write

concurrency:
  group: agent-full-yfuse-upgrade
  cancel-in-progress: true

jobs:
  build-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/unify-home-tab-reduce-transparency
          fetch-depth: 1

      - name: Apply product workflows
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/agent_full_upgrade_phase2b.py
          python3 scripts/agent_full_upgrade_phase2b3_fixup.py pre
          python3 scripts/agent_full_upgrade_phase3.py
          python3 scripts/agent_full_upgrade_phase2b3_fixup.py post
          git diff --check
          if [[ -n "$(git status --porcelain composeApp)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh

      - name: Compile Android
        shell: bash
        run: ./gradlew :composeApp:compileDebugKotlinAndroid --no-daemon

      - name: Compile and run stable affected tests
        shell: bash
        run: |
          ./gradlew :composeApp:testDebugUnitTest --no-daemon \
            --tests 'com.yfuse.feature.player.PlaybackFailoverPolicyTest' \
            --tests 'com.yfuse.feature.servers.ServersStoreTest.address_with_http_scheme_updates_protocol_and_avoids_duplicate_scheme' \
            --tests 'com.yfuse.feature.servers.ServersStoreTest.address_with_https_and_explicit_port_overrides_both_fields' \
            --tests 'com.yfuse.core.designsystem.NavigationIdentityTest'

      - name: Commit product workflow source
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp/src
          git diff --cached --check
          git commit -m "feat: upgrade downloads tracking and playback resilience"
          git push origin HEAD:agent/unify-home-tab-reduce-transparency
