name: Apply player startup and danmaku fix

on:
  push:
    branches:
      - codex/ycore-sign-20260830

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ !contains(github.event.head_commit.message, '[player-startup-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded player fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def between(text, start, end, replacement, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"{label}: start marker missing")
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f"{label}: end marker missing")
              return text[:a] + replacement + text[b:]

          danmaku = "composeApp/src/commonMain/kotlin/com/yfuse/feature/player/DanmakuOverlay.kt"
          text = read(danmaku)
          text = one(
              text,
              "private const val POSITION_RESET_THRESHOLD_MS = 1_000L\n",
              "private const val POSITION_RESET_THRESHOLD_MS = 1_000L\nprivate const val BACKWARD_SEEK_RESET_THRESHOLD_MS = 3_000L\n",
              "danmaku threshold",
          )
          text = between(
              text,
              "    LaunchedEffect(positionMs, playing) {",
              "    LaunchedEffect(playing) {",
              '''    LaunchedEffect(positionMs, playing) {
              val driftMs = positionMs - renderedPositionMs
              when {
                  driftMs > POSITION_RESET_THRESHOLD_MS -> renderedPositionMs = positionMs
                  driftMs < -BACKWARD_SEEK_RESET_THRESHOLD_MS -> renderedPositionMs = positionMs
                  // Pauses and brief transport stalls freeze the interpolated clock. Never snap
                  // backwards to a lagging engine tick and replay already-visible comments.
                  !playing -> Unit
              }
          }
''',
              "danmaku position effect",
          )
          text = one(
              text,
              '''                val reported = latestReportedPosition
              if (abs(reported - renderedPositionMs) > POSITION_RESET_THRESHOLD_MS) {
                  renderedPositionMs = reported
              }
''',
              '''                val reported = latestReportedPosition
              val driftMs = reported - renderedPositionMs
              when {
                  driftMs > POSITION_RESET_THRESHOLD_MS -> renderedPositionMs = reported
                  driftMs < -BACKWARD_SEEK_RESET_THRESHOLD_MS -> renderedPositionMs = reported
              }
''',
              "danmaku frame correction",
          )
          text = one(text, "import kotlin.math.abs\n", "", "danmaku abs import")
          write(danmaku, text)

          native = "composeApp/src/androidMain/kotlin/com/yfuse/core2/android/AndroidNativeDirectYPlayer.kt"
          text = read(native)
          text = one(
              text,
              "import kotlinx.coroutines.CoroutineScope\n",
              "import kotlinx.coroutines.CoroutineScope\nimport kotlinx.coroutines.Dispatchers\n",
              "native Dispatchers import",
          )
          text = one(
              text,
              "        private var transportReadBlocked = false\n        private var droppedFrames = 0\n",
              "        private var transportReadBlocked = false\n\n        @Volatile\n        private var transportBufferingVisible = false\n\n        @Volatile\n        private var transportBlockGeneration = 0L\n        private var droppedFrames = 0\n",
              "native transport fields",
          )
          text = one(text, "playing = firstVideoFrameRendered && !transportReadBlocked,", "playing = firstVideoFrameRendered && !transportBufferingVisible,", "native start playing")
          text = one(text, "buffering = !firstVideoFrameRendered || transportReadBlocked,", "buffering = !firstVideoFrameRendered || transportBufferingVisible,", "native start buffering")
          text = one(text, "playing = requestedPlay && firstVideoFrameRendered && !transportReadBlocked && !isEnded(),", "playing = requestedPlay && firstVideoFrameRendered && !transportBufferingVisible && !isEnded(),", "native publish playing")
          text = one(text, "buffering = requestedPlay && (!firstVideoFrameRendered || transportReadBlocked) && !isEnded(),", "buffering = requestedPlay && (!firstVideoFrameRendered || transportBufferingVisible) && !isEnded(),", "native publish buffering")
          text = one(text, "                                !transportReadBlocked &&\n", "                                !transportBufferingVisible &&\n", "native first frame playing")
          text = one(text, "                        buffering = requestedPlay && transportReadBlocked,\n", "                        buffering = requestedPlay && transportBufferingVisible,\n", "native first frame buffering")
          text = between(
              text,
              "        private fun onTransportBlockingReadStateChanged(blocked: Boolean) {",
              "        private fun abortIfReleased() {",
              '''        private fun onTransportBlockingReadStateChanged(blocked: Boolean) {
              if (transportReadBlocked == blocked || released) return
              val nowNs = System.nanoTime()
              if (blocked) {
                  val frozenPositionUs = currentPositionUs()
                  monotonicPositionFloorUs = frozenPositionUs
                  wallClock.pause(frozenPositionUs, nowNs)
                  transportReadBlocked = true
                  val generation = ++transportBlockGeneration
                  // A short synchronous range miss is transport work, not a user-visible rebuffer.
                  scope.launch(Dispatchers.Default) {
                      delay(TRANSPORT_BUFFERING_DEBOUNCE_MS)
                      if (!released && transportReadBlocked && transportBlockGeneration == generation) {
                          transportBufferingVisible = true
                          mutableState.updateState { current ->
                              if (released || current.phase == YPlaybackPhase.Failed || current.phase == YPlaybackPhase.Ended) {
                                  current
                              } else {
                                  current.copy(playing = false, buffering = requestedPlay)
                              }
                          }
                      }
                  }
                  return
              }

              transportReadBlocked = false
              ++transportBlockGeneration
              transportBufferingVisible = false
              if (requestedPlay) {
                  val resumePositionUs = audioClockSnapshot()?.positionUs ?: wallClock.positionUs(nowNs)
                  monotonicPositionFloorUs = maxOf(monotonicPositionFloorUs, resumePositionUs)
                  wallClock.start(monotonicPositionFloorUs, nowNs)
              }
              mutableState.updateState { current ->
                  if (released || current.phase == YPlaybackPhase.Failed || current.phase == YPlaybackPhase.Ended) {
                      current
                  } else {
                      current.copy(
                          playing = requestedPlay && firstVideoFrameRendered,
                          buffering = requestedPlay && !firstVideoFrameRendered,
                      )
                  }
              }
          }

''',
              "native blocking callback",
          )
          text = one(
              text,
              "private const val PUMP_IDLE_DELAY_MS = 1L\n",
              "private const val PUMP_IDLE_DELAY_MS = 1L\nprivate const val TRANSPORT_BUFFERING_DEBOUNCE_MS = 300L\n",
              "native debounce constant",
          )
          write(native, text)

          http = "composeApp/src/androidMain/kotlin/com/yfuse/core2/android/AndroidHttpMediaTransport.kt"
          text = read(http)
          text = one(
              text,
              "    private val redirectState: AndroidHttpMediaRedirectState? = null,\n) : YMediaTransport {",
              "    private val redirectState: AndroidHttpMediaRedirectState? = null,\n    private val callTimeoutSeconds: Long? = null,\n) : YMediaTransport {",
              "http constructor",
          )
          text = one(
              text,
              "            .followSslRedirects(false)\n            .build()",
              "            .followSslRedirects(false)\n            .apply { callTimeoutSeconds?.let { callTimeout(it, TimeUnit.SECONDS) } }\n            .build()",
              "http call timeout",
          )
          write(http, text)

          adaptive = "composeApp/src/androidMain/kotlin/com/yfuse/core2/android/AndroidAdaptiveHttpMediaTransport.kt"
          text = read(adaptive)
          text = one(
              text,
              "            redirectState = routeState.redirectState,\n        )",
              "            redirectState = routeState.redirectState,\n            // The first range is startup-critical; fail a poisoned route quickly enough to recover.\n            callTimeoutSeconds = if (routeState.hasAcceptedRange) null else 8L,\n        )",
              "adaptive startup timeout",
          )
          write(adaptive, text)
          PY

          git diff --check

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yfuse-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            composeApp/src/commonMain/kotlin/com/yfuse/feature/player/DanmakuOverlay.kt \
            composeApp/src/androidMain/kotlin/com/yfuse/core2/android/AndroidNativeDirectYPlayer.kt \
            composeApp/src/androidMain/kotlin/com/yfuse/core2/android/AndroidHttpMediaTransport.kt \
            composeApp/src/androidMain/kotlin/com/yfuse/core2/android/AndroidAdaptiveHttpMediaTransport.kt
          git commit -m "fix(player): debounce range stalls and keep danmaku monotonic [player-startup-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
