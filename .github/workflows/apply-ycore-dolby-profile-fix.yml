name: Apply deterministic episode queue fix

on:
  push:
    branches:
      - fix/player-queue-deterministic-20260902

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/apply-player-queue-deterministic.py
      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(player): serialize episode queue preparation [queue-fixed]"
          git push
