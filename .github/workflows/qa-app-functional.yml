name: Full functional recheck with status bar contrast
on:
  push:
    branches:
      - qa/app-functional-20261112
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ceb8123815c6b0cec0f0bef3cb9a24ea63260752
          path: app
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '13959163530'
          run-id: '43250745524'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: qa-native
      - name: Verify exact native artifact and assemble the fixed player
        working-directory: app
        run: |
          export YCORE_NATIVE_AAR_PATH="$GITHUB_WORKSPACE/qa-native/ycore-native.aar"
          export YCORE_SOURCE_RECEIPT="$GITHUB_WORKSPACE/qa-native/source-build.json"
          export YCORE_SOURCE_COMMIT=ceb8123815c6b0cec0f0bef3cb9a24ea63260752
          export SOURCE_COMMIT="$YCORE_SOURCE_COMMIT"
          export YCORE_SOURCE_AAR_SHA256=$(sha256sum "$YCORE_NATIVE_AAR_PATH" | cut -d' ' -f1)
          export YCORE_SOURCE_PROVENANCE_SHA256=$(sha256sum "$GITHUB_WORKSPACE/qa-native/NATIVE-SOURCES.txt" | cut -d' ' -f1)
          python3 scripts/prepare-playback-inputs.py
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          git fetch --no-tags --depth=1 origin 477b23b90f3ae5f31e56a37c53b34526508f5eee
          test "$(git diff --name-only HEAD FETCH_HEAD)" = "composeApp/src/androidMain/kotlin/com/yfuse/core/designsystem/SystemBars.android.kt"
          git checkout --detach FETCH_HEAD
          ./gradlew :composeApp:assembleDebug -PyfuseApplicationId=com.yfuse.validation --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fixed-device-build
          path: app/composeApp/build/outputs/apk/debug/*.apk
          retention-days: 2

  verify:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: ['35','37.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 477b23b90f3ae5f31e56a37c53b34526508f5eee
          path: app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: fixed-device-build
          path: app-apk
      - name: Prepare device
        run: |
          mkdir -p app-evidence
          sudo apt-get install -y python3-pil
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use current Android 17 tools
        if: matrix.sdk == '37.0'
        run: sudo rm -rf "${ANDROID_HOME:?}/cmdline-tools"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.sdk }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -accel on
          script: bash qa-functional/run.sh settings ${{ matrix.sdk }}
      - name: Read status bar pixels after each layout change
        if: always()
        run: /usr/bin/python3 qa-functional/bar-check.py app-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fixed-ui-${{ matrix.sdk }}
          path: app-evidence
