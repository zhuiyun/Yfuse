name: Identify failing device case from Android test XML
on:
  push:
    branches: [qa/app-functional-20261112]
permissions:
  actions: read
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: instrumented-tests-api35-9774c5ad7b3451402925035f37d001cd26986926-2
          run-id: '43271195229'
          path: result
          github-token: ${{ github.token }}
      - name: Summarize the failing test in the final build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E,re
          p=Path('result')
          def clean(s):
              s=re.sub(r'https?://[^\s\]\)]+','[url]',s)
              return re.sub(r'(?i)(password|api_key|x-emby-token|authorization|token)\s*[:=][^\s,]*',r'\1=[redacted]',s)
          for f in p.rglob('TEST-*.xml'):
              for t in E.parse(f).iter('testcase'):
                  fail=t.find('failure');name=t.get('name');cl=t.get('classname')
                  if fail is None:
                      if 'DragRelease' in cl:print('NEW_GESTURE_TEST_PASSED',cl,name)
                      continue
                  print('FAILED_DEVICE_CASE',cl,name,clean(str(fail.text or fail.get('message') or ''))[:3500])
                  for a in p.rglob('logcat-'+cl+'-'+name+'.txt'):
                      rows=[clean(x)[:320] for x in a.read_text(errors='replace').splitlines() if re.search(r'Assertion|TestRunner.*failed|ANR in|FATAL EXCEPTION|TestRunner.*error|not responding',x,re.I)]
                      print('LOG_OBSERVATIONS','\n'.join(rows[-14:]))
          PY
