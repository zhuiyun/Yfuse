name: Cloud Emby playback resilience
on:
  push:
    branches: [codex/cloud-playback-resilience-20261113]
    paths:
      - '.github/workflows/qa-app-functional.yml'
      - 'qa-functional/resilience.*'
      - 'qa-functional/private-resilience.*'
permissions:
  contents: read
  actions: read
jobs:
  playback:
    name: Playback and recovery on API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 35, image: '35', seed: 131135}
          - {api: 37, image: '37.0', seed: 131137}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify preview belongs to the tested PR tree
        env:
          API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          get() { curl -fsSL --retry 2 -H "Authorization: Bearer $API_TOKEN" "$api/$1"; }
          head=2e095fa741a080e340183ec8fc327005756cc8da
          merge=3f867b11d302d1f0f7d1e548716ea47623effd63
          get "git/commits/$merge" > "$RUNNER_TEMP/merge.json"
          test "$(get "git/commits/$head" | jq -r '.tree.sha')" = "$(jq -r '.tree.sha' "$RUNNER_TEMP/merge.json")"
          jq -e --arg h "$head" 'any(.parents[]; .sha == $h)' "$RUNNER_TEMP/merge.json" >/dev/null
          get "actions/artifacts/13973342804/zip" > "$RUNNER_TEMP/preview.zip"
          echo "9676ce59940c483c1c356b25b6cc85ff40cf67bd3cb36e465447bc6d0cee0d6f  $RUNNER_TEMP/preview.zip" | sha256sum -c -
          mkdir preview results
          unzip -q "$RUNNER_TEMP/preview.zip" -d preview
          test -f preview/composeApp-release.apk
          sha256sum preview/composeApp-release.apk > results/apk.sha256
      - name: Set up KVM and two timecoded films on a disposable Emby server
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
          /usr/bin/python3 qa-scrub/fixture.py qa-media
          curl -fsSL --retry 2 https://github.com/MediaBrowser/Emby.Releases/releases/download/4.10.2.0/emby-server-deb_4.10.2.0_amd64.deb -o "$RUNNER_TEMP/server.deb"
          echo "80c8666fc6f6143558c235c57932189a3f0b3f899b44519fc4621dd7dea16e32  $RUNNER_TEMP/server.deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/server.deb" qa-emby-bin
      - name: Use current SDK manager on Android 17
        if: matrix.api == 37
        run: sudo mv "$ANDROID_HOME/cmdline-tools" "$RUNNER_TEMP/old-cmdline-tools"
      - name: Run the release preview on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.image }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash qa-functional/resilience.sh ${{ matrix.api }} ${{ matrix.seed }}
      - name: Retain measured frames and case results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resilience-api${{ matrix.api }}-attempt-${{ github.run_attempt }}
          path: results/
          retention-days: 10
  private_source:
    name: Two real films in the release preview
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Prepare one-use decryption key and emulator
        run: |
          set -euo pipefail
          umask 077
          mkdir -p private-key private-results preview
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$RUNNER_TEMP/qa-private.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/qa-private.pem" -pubout -out private-key/public.pem
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil python3-cryptography
      - name: Publish only the public half of this runner's key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-key-${{ github.run_id }}-${{ github.run_attempt }}
          path: private-key/public.pem
          retention-days: 1
      - name: Verify the same preview and wait for its encrypted film locations
        env: {API_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          curl -fsSL -H "Authorization: Bearer $API_TOKEN" "$api/actions/artifacts/13973342804/zip" > "$RUNNER_TEMP/preview.zip"
          echo "9676ce59940c483c1c356b25b6cc85ff40cf67bd3cb36e465447bc6d0cee0d6f  $RUNNER_TEMP/preview.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/preview.zip" -d preview
          for i in $(seq 1 145); do
            http=$(curl -sSL -o "$RUNNER_TEMP/envelope.json" -w '%{http_code}' -H "Authorization: Bearer $API_TOKEN" -H 'Accept: application/vnd.github.raw+json' "$api/contents/qa-input/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json?ref=codex%2Fcloud-playback-resilience-20261113")
            if [[ "$http" = 200 ]]; then break; fi
            sleep 4
          done
          test "$http" = 200
          chmod 600 "$RUNNER_TEMP/envelope.json"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: '35'
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash qa-functional/private-resilience.sh
      - name: Retain numeric playback measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-numeric-${{ github.run_id }}-${{ github.run_attempt }}
          path: private-results
          retention-days: 7
