name: Complete Android shared-suite regression with real main and app providers
on:
  push:
    branches:
      - qa/app-functional-20261112
permissions:
  contents: read
  actions: read
jobs:
  common-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: af1a495b8faa86bc204d4c8caf4a075e2cdbcad6
          path: app
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '13961143433'
          run-id: '43254839709'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: qa-native
      - name: Prepare source and its shared functional cases for this emulator
        working-directory: app
        run: |
          export YCORE_NATIVE_AAR_PATH="$GITHUB_WORKSPACE/qa-native/ycore-native.aar"
          export YCORE_SOURCE_RECEIPT="$GITHUB_WORKSPACE/qa-native/source-build.json"
          export SOURCE_COMMIT=af1a495b8faa86bc204d4c8caf4a075e2cdbcad6
          export YCORE_SOURCE_COMMIT="$SOURCE_COMMIT"
          export YCORE_SOURCE_AAR_SHA256=$(sha256sum "$YCORE_NATIVE_AAR_PATH" | cut -d' ' -f1)
          export YCORE_SOURCE_PROVENANCE_SHA256=$(sha256sum "$GITHUB_WORKSPACE/qa-native/NATIVE-SOURCES.txt" | cut -d' ' -f1)
          python3 scripts/prepare-playback-inputs.py
          git fetch --no-tags --depth=1 origin 60390e45c371e3bdc23349d3f03b5915eb22d11e
          files=$(git diff --name-only HEAD FETCH_HEAD)
          test -z "$(echo "$files" | grep -vE '^composeApp/src/(commonMain|androidMain|androidInstrumentedTest)/kotlin/' || true)"
          git checkout --detach FETCH_HEAD
          python3 ../qa-functional/logic-config.py
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 3000M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -accel on
          script: bash qa-functional/device-logic.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: shared-feature-device-results
          path: logic-evidence
