name: Compare in-place HLS seeks through triple and single real gestures
on:
  push:
    branches:
      - qa/app-functional-20261112
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: b5f81bb6b6e380f7f01fd8ec293a728e744a0cce
          path: app
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '13964017958'
          run-id: '43260409499'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: qa-native
      - name: Verify exact native artifact and assemble the fixed player
        working-directory: app
        run: |
          export YCORE_NATIVE_AAR_PATH="$GITHUB_WORKSPACE/qa-native/ycore-native.aar"
          export YCORE_SOURCE_RECEIPT="$GITHUB_WORKSPACE/qa-native/source-build.json"
          export YCORE_SOURCE_COMMIT=b5f81bb6b6e380f7f01fd8ec293a728e744a0cce
          export SOURCE_COMMIT="$YCORE_SOURCE_COMMIT"
          export YCORE_SOURCE_AAR_SHA256=$(sha256sum "$YCORE_NATIVE_AAR_PATH" | cut -d' ' -f1)
          export YCORE_SOURCE_PROVENANCE_SHA256=$(sha256sum "$GITHUB_WORKSPACE/qa-native/NATIVE-SOURCES.txt" | cut -d' ' -f1)
          python3 scripts/prepare-playback-inputs.py
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          git fetch --no-tags --depth=1 origin cab74b1d110879392974aca7e3ab68fdf66d4ae1
          files=$(git diff --name-only HEAD FETCH_HEAD)
          test -z "$(echo "$files" | grep -vE '^(composeApp/src/androidMain/kotlin/com/yfuse/(feature/player/PlayerRootRecovery.kt|core2/android/AndroidAdaptiveCore2YPlayer.kt)|senplayerBridge/src/main/java/com/yfuse/senplayer/SenPlayerSession.java)$' || true)"
          git checkout --detach FETCH_HEAD
          ./gradlew :composeApp:assembleDebug -PyfuseApplicationId=com.yfuse.validation --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: seek-fixed-build
          path: app/composeApp/build/outputs/apk/debug/*.apk
          retention-days: 2

  exercise:
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: '35', suite: all}
          - {api: '35', suite: hls}
          - {api: '35', suite: standard}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 60390e45c371e3bdc23349d3f03b5915eb22d11e
          path: app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: seek-fixed-build
          path: app-apk
      - name: Prepare emulator and independent media
        env: {SUITE: "${{ matrix.suite }}"}
        run: |
          mkdir -p app-evidence feature-evidence
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          if [[ "$SUITE" != settings ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg python3-pil
            /usr/bin/python3 qa-scrub/fixture.py qa-media
            printf '1\n00:00:01,000 --> 00:02:00,000\nSubtitle fixture\n' > qa-media/ProbeA.en.srt
            sed -i "s/'CollectionType':'homevideos'/'CollectionType':'movies'/" qa-scrub/emby.py
            curl -fsSL --retry 2 https://github.com/MediaBrowser/Emby.Releases/releases/download/4.10.2.0/emby-server-deb_4.10.2.0_amd64.deb -o "$RUNNER_TEMP/server.deb"
            echo "80c8666fc6f6143558c235c57932189a3f0b3f899b44519fc4621dd7dea16e32  $RUNNER_TEMP/server.deb" | sha256sum -c -
            dpkg-deb -x "$RUNNER_TEMP/server.deb" qa-emby-bin
          fi
      - name: Use Android 17 platform tools for minor-version images
        if: matrix.suite == 'settings' && matrix.api != 35
        run: sudo rm -rf "${ANDROID_HOME:?}/cmdline-tools"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash qa-functional/candidate.sh ${{ matrix.suite }}
      - name: Check contrast of the actual time indicator
        if: matrix.suite == 'settings' && success()
        run: /usr/bin/python3 qa-functional/bar-check.py app-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: functional-${{ matrix.suite }}-${{ matrix.api }}
          path: |
            app-evidence
            feature-evidence
            qa-emby-evidence



