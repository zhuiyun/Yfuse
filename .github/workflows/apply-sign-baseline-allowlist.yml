name: Apply sign baseline allowlist

on:
  push:
    branches:
      - codex/ycore-sign-20260830

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sign-baseline-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact baseline allowlist
        run: python3 scripts/apply-sign-baseline-allowlist.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name yfuse-ci
          git config user.email actions@users.noreply.github.com
          git add .github/workflows/sign-android-branch.yml
          git commit -m "build(android): allow only known compose test baseline failures [player-startup-patched] [progressive-buffering-patched] [control-autohide-patched] [watch-lock-patched] [refresh-skip-patched] [sign-baseline-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
