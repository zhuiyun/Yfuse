name: Apply PlayerStore timeout lifecycle patch

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/one-shot-player-timeout-lifecycle-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/patch_player_timeout_lifecycle.py
      - name: Commit patch
        run: |
          git config user.name yfuse-release-bot
          git config user.email actions@users.noreply.github.com
          git rm scripts/patch_player_timeout_lifecycle.py
          git rm .github/workflows/one-shot-player-timeout-lifecycle-v2.yml
          git add composeApp/src/commonMain/kotlin/com/yfuse/feature/player/PlayerStore.kt
          git diff --cached --check
          git commit -m 'fix(player): stop queue timeout watcher when load ends'
          git push origin HEAD:master
