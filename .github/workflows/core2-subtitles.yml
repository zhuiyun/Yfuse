name: Core2 subtitle checks

on:
  push:
    branches:
      - feat/core2-dual-subtitles-20260906
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core2-subtitles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Download player dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          bash scripts/fetch-engines.sh
      - name: Compile and test subtitle paths
        run: |
          ./gradlew :composeApp:compileDebugKotlinAndroid :composeApp:testDebugUnitTest --no-daemon \
            --tests 'com.yfuse.core2.android.NativeDirectCommandPolicyTest' \
            --tests 'com.yfuse.core2.android.NativeEnhancedCommandPolicyTest' \
            --tests 'com.yfuse.core2.subtitle.*' \
            --tests 'com.yfuse.core2.legacy.YPlayerVideoEngineAdapterTest' \
            --tests 'com.yfuse.feature.player.Core2SurfaceTest'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core2-subtitle-reports
          path: |
            composeApp/build/test-results/testDebugUnitTest
            composeApp/build/reports/tests/testDebugUnitTest
