name: Core2 subtitle checks

on:
  push:
    branches:
      - feat/core2-dual-subtitles-20260906
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core2-subtitles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android toolchain
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" 'platforms;android-37.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Download player dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          bash scripts/fetch-engines.sh
      - name: Build and install current YCore runtime
        uses: ./.github/actions/build-current-ycore
      - name: Compile and test subtitle paths
        run: |
          ./gradlew :composeApp:compileDebugKotlin :phoneShared:testAndroidHostTest --no-daemon \
            --tests 'com.yfuse.core2.android.NativeDirectCommandPolicyTest' \
            --tests 'com.yfuse.core2.android.NativeEnhancedCommandPolicyTest' \
            --tests 'com.yfuse.core2.subtitle.*' \
            --tests 'com.yfuse.core2.legacy.YPlayerVideoEngineAdapterTest' \
            --tests 'com.yfuse.feature.player.Core2SurfaceTest'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core2-subtitle-reports
          path: |
            phoneShared/build/test-results/testAndroidHostTest
            phoneShared/build/reports/tests/testAndroidHostTest
