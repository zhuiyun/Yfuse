name: Apply player refresh and skip fix

on:
  push:
    branches:
      - codex/ycore-sign-20260830

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[refresh-skip-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply player refresh and skip patch
        run: python3 scripts/apply-player-refresh-skip-fix.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name yfuse-ci
          git config user.email actions@users.noreply.github.com
          git add composeApp/src/commonMain/kotlin/com/yfuse/feature/player/PlayerSkipCoordinator.kt composeApp/src/androidMain/kotlin/com/yfuse/feature/player/PlayerActivity.kt
          git commit -m "fix(player): stop refresh rebuilds and preserve skip countdown [player-startup-patched] [progressive-buffering-patched] [control-autohide-patched] [watch-lock-patched] [refresh-skip-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
