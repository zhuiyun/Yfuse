name: Playback touch seek verification
on:
  push:
    branches:
      - qa/seek-touch-20261112
permissions:
  contents: read
  actions: read
jobs:
  seek:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 456344bca9f5bd88d3befb859f0a98cf782159cd
          path: app
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: '13954844807'
          run-id: '43243406129'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: qa-native
      - name: Verify exact native artifact and assemble the fixed player
        working-directory: app
        run: |
          export YCORE_NATIVE_AAR_PATH="$GITHUB_WORKSPACE/qa-native/ycore-native.aar"
          export YCORE_SOURCE_RECEIPT="$GITHUB_WORKSPACE/qa-native/source-build.json"
          export YCORE_SOURCE_COMMIT=456344bca9f5bd88d3befb859f0a98cf782159cd
          export SOURCE_COMMIT="$YCORE_SOURCE_COMMIT"
          export YCORE_SOURCE_AAR_SHA256=2df1e5b313a86ce67e308ff2f130cc688f4e378c904f0d8c8e5d30847112586b
          export YCORE_SOURCE_PROVENANCE_SHA256=66556b3132a0aad500c5331045bcbf959ffe5d7604f6c5a2143c81d92fd78efc
          python3 scripts/prepare-playback-inputs.py
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"
          ./gradlew :composeApp:assembleDebug -PyfuseApplicationId=com.yfuse.validation --no-daemon
      - name: Prepare two independent video markers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
          python3 qa-scrub/fixture.py qa-media
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash qa-scrub/cloud.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: seek-touch-evidence
          path: qa-results
