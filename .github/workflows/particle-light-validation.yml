name: Particle light validation

on:
  push:
    branches: [codex/particle-light-20260912]

permissions:
  contents: read

concurrency:
  group: particle-light-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Export exact validation source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Export tracked source and commit provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/particle-source"
          git archive --format=zip -o "$RUNNER_TEMP/particle-source/yfuse-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/particle-source/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/particle-source/source-tree.txt"
      - name: Upload validation source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: particle-source-${{ github.sha }}
          path: ${{ runner.temp }}/particle-source/
          if-no-files-found: error
          retention-days: 3
