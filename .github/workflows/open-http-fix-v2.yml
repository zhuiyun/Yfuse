name: Apply open HTTP fix v2

on:
  push:
    branches:
      - fix-open-http
    paths:
      - .github/workflows/open-http-fix-v2.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: fix-open-http

      - name: Apply corrected HTTP policy cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/open-http-fix.yml').read_text()
          start = workflow.index('          from pathlib import Path\n')
          end = workflow.index('\n          PY', start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(
              'out, count = re.subn(pattern, repl, text, flags=re.S)',
              'out, count = re.subn(pattern, lambda _match: repl, text, flags=re.S)',
          )
          exec(compile(script, 'open-http-fix.py', 'exec'))
          PY

          if grep -R --line-number -E '"[^"\n]*(HTTP|明文)[^"\n]*(风险|未加密|暴露|确认)[^"\n]*"' composeApp/src/commonMain; then
            echo "HTTP risk warning copy still exists" >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android 36 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh

      - name: Compile, test and format-check
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :composeApp:compileDebugKotlinAndroid \
            :composeApp:testDebugUnitTest \
            :watchTogetherServer:test \
            ktlintCheck \
            --no-daemon
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/open-http-fix.yml .github/workflows/open-http-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完全放开 HTTP 并发布 0.2.59"
          git push origin HEAD:fix-open-http

# retry: HTTP policy cleanup after neutral transport diagnostics
