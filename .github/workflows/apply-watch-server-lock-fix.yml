name: Apply watch server lock fix

on:
  push:
    branches:
      - codex/ycore-sign-20260830

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[watch-lock-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align sqlite dependency lock
        run: python3 scripts/apply-watch-server-lock-fix.py
      - name: Validate lock patch
        run: git diff --check
      - name: Commit lock patch
        shell: bash
        run: |
          git config user.name yfuse-ci
          git config user.email actions@users.noreply.github.com
          git add watchTogetherServer/gradle.lockfile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: align watch server sqlite lock [player-startup-patched] [progressive-buffering-patched] [control-autohide-patched] [watch-lock-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
