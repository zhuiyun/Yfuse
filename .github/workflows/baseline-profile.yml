name: Baseline profile

# Records the app's baseline profile with macrobenchmark's BaselineProfileGenerator on a KVM
# emulator and publishes it as an artifact. CI never commits it: a person downloads the artifact
# and commits baseline-prof.txt as composeApp/src/main/baseline-prof.txt, which AGP compiles into
# every release APK (assets/dexopt/) for androidx.profileinstaller to install.
#
# Journeys over server content skip on this emulator (the benchmark app has no signed-in server),
# so this profile covers cold start, 首页, tab navigation and 浮起菜单. A run of
# scripts/android_performance.py --mode profile on a signed-in physical phone covers the rest.
on:
  workflow_dispatch:
  # Changed journeys or fixtures must still produce a profile.
  pull_request:
    paths:
      - .github/workflows/baseline-profile.yml
      - macrobenchmark/**
      - composeApp/src/performance/**

permissions:
  contents: read

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate on an Android 15 emulator
    runs-on: ubuntu-24.04
    # A cold native dependency cache is bootstrapped here, as in the quality gate.
    timeout-minutes: 300
    steps:
      # Toolchains no step uses: the native and Kotlin builds, the emulator image and its data
      # partition all need the room on one runner.
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android 37.0 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
          test -f composeApp/libs/libmpv-release.aar
          test -f composeApp/libs/mdk-sdk/lib/cmake/FindMDK.cmake
      - name: Build and install current YCore runtime
        uses: ./.github/actions/build-current-ycore
      # `profile` is the benchmark build type without R8, so the recorded rules name the source
      # classes; the release build's R8 rewrites them for the code it ships.
      - name: Build the profile app and the generator
        run: ./gradlew :composeApp:assembleProfile :macrobenchmark:assembleProfile --no-daemon
      - name: Enable hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # API 33+ lets the generator read the profile without root. The arm64-only app runs under
      # the image's arm64 translation, as in android-cloud-ui.yml; the rules are dex, not native,
      # so they do not depend on the ABI. AGP copies the rule's output files back to the build.
      - name: Record the baseline profile
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: ./gradlew :macrobenchmark:connectedProfileAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.yfuse.macrobenchmark.BaselineProfileGenerator -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR --no-daemon
      # The physical-device lane's own export: no fixture classes, only unobfuscated Yfuse rules,
      # and a startup profile that reached the real MainActivity, or no profile at all.
      - name: Export the rules the app ships
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from android_performance import export_profiles

          counts = export_profiles(Path("macrobenchmark/build/outputs"), Path("build/baseline-profile"))
          lines = [
              "## Baseline profile",
              f"{counts['baseline_rules']} baseline rules, {counts['startup_rules']} startup rules.",
              "Commit `baseline-prof.txt` from this run's `baseline-profile-*` artifact as "
              "`composeApp/src/main/baseline-prof.txt`.",
          ]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - name: Upload the baseline profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: baseline-profile-${{ github.sha }}-${{ github.run_attempt }}
          path: build/baseline-profile/
          if-no-files-found: error
          retention-days: 30
      - name: Upload the generator's raw output and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: profile-generator-output-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            macrobenchmark/build/outputs/connected_android_test_additional_output/
            macrobenchmark/build/outputs/androidTest-results/
            macrobenchmark/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 7
