name: Repair GitHub release v1.0.9 to versionCode 171

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/repair-release-v1.0.9-code171.yml

permissions:
  contents: write
  actions: read

jobs:
  repair:
    name: Replace incorrect 169 release assets with verified 171 build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.0.9
      VERSION_NAME: 1.0.9
      VERSION_CODE: "171"
      PUBLISHED_SHA: aff525f06c2454ef339d07b572716b6e73702b0b
      PUBLISH_RUN_ID: "32678203150"
    steps:
      - name: Check out the published source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PUBLISHED_SHA }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
      - name: Download verified production artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/publish-artifacts
          gh run download "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir build/publish-artifacts
          apk="$(find build/publish-artifacts -type f -name "Yfuse-${VERSION_CODE}-${VERSION_NAME}.apk" -print -quit)"
          test -s "$apk"
          cp "$apk" "build/Yfuse-${VERSION_NAME}.apk"
          (
            cd build
            sha256sum "Yfuse-${VERSION_NAME}.apk" > "Yfuse-${VERSION_NAME}.apk.sha256"
          )
      - name: Generate current SPDX SBOM
        run: python3 scripts/supply_chain_check.py --root . --sbom build/sbom/yfuse.spdx.json
      - name: Correct release tag and assets
        shell: bash
        run: |
          set -euo pipefail
          notes="build/release-notes-${VERSION_NAME}.txt"
          {
            cat release-notes.txt
            printf '\nversionCode %s · commit %s\n' "$VERSION_CODE" "$PUBLISHED_SHA"
          } > "$notes"

          gh api             --method PATCH             "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"             -f sha="$PUBLISHED_SHA"             -F force=true >/dev/null

          gh release upload "$RELEASE_TAG"             "build/Yfuse-${VERSION_NAME}.apk"             "build/Yfuse-${VERSION_NAME}.apk.sha256"             "build/sbom/yfuse.spdx.json"             --clobber             --repo "$GITHUB_REPOSITORY"

          gh release edit "$RELEASE_TAG"             --target "$PUBLISHED_SHA"             --title "Yfuse $VERSION_NAME"             --notes-file "$notes"             --repo "$GITHUB_REPOSITORY"
      - name: Verify corrected public release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-verify
          gh release download "$RELEASE_TAG"             --pattern "Yfuse-${VERSION_NAME}.apk"             --pattern "Yfuse-${VERSION_NAME}.apk.sha256"             --pattern "yfuse.spdx.json"             --dir build/release-verify             --repo "$GITHUB_REPOSITORY"
          (
            cd build/release-verify
            sha256sum --check "Yfuse-${VERSION_NAME}.apk.sha256"
            test -s yfuse.spdx.json
          )
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          [[ "$tag_sha" == "$PUBLISHED_SHA" ]]
