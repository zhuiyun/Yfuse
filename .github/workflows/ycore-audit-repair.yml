name: YCore audit repair workspace

on:
  push:
    branches: [fix/ycore-audit-http-20260912]
    paths:
      - .github/workflows/ycore-audit-repair.yml
      - .github/repairs/ycore-audit-repair.py

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ycore-audit-source"
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/ycore-audit-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/ycore-audit-source/source-commit.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ycore-audit-source-${{ github.sha }}
          path: ${{ runner.temp }}/ycore-audit-source/
          retention-days: 1
          if-no-files-found: error
