name: Retain poster color on return

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/restore-1.0.7-poster-transition'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/restore-1.0.7-poster-transition
          fetch-depth: 0

      - name: Keep sampled page colour across detail navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          home = Path("composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt")
          text = home.read_text()
          import_anchor = "import com.yfuse.core.designsystem.rememberArtworkPageColor\n"
          if "import com.yfuse.core.designsystem.rememberRetainedArtworkPageColor\n" not in text:
              if import_anchor not in text:
                  raise SystemExit("HomeScreen.kt: import anchor missing")
              text = text.replace(
                  import_anchor,
                  import_anchor + "import com.yfuse.core.designsystem.rememberRetainedArtworkPageColor\n",
                  1,
              )
          old = '''    var heroAccent by remember { mutableStateOf<Color?>(null) }
              var heroPageColor by remember { mutableStateOf<Color?>(null) }
              ArtworkPageTheme(
                  background = heroPageColor,
                  artworkAccent = heroAccent,
              ) {
                  HomeContent(
                      component = component,
                      heroPageColor = heroPageColor,
                      onHeroAccent = { heroAccent = it },
                      onHeroPageColor = { heroPageColor = it },
                      onOpenDiscovery = onOpenDiscovery,
                  )
              }
          '''
          new = '''    val navigationState by component.store.states.collectAsState(component.store.state)
              val retainedPageColor =
                  rememberRetainedArtworkPageColor("home:${navigationState.server?.id.orEmpty()}")
              var heroAccent by remember { mutableStateOf<Color?>(null) }
              ArtworkPageTheme(
                  background = retainedPageColor.value,
                  artworkAccent = heroAccent,
              ) {
                  HomeContent(
                      component = component,
                      heroPageColor = retainedPageColor.value,
                      onHeroAccent = { heroAccent = it },
                      onHeroPageColor = retainedPageColor::update,
                      onOpenDiscovery = onOpenDiscovery,
                  )
              }
          '''
          if old not in text:
              raise SystemExit("HomeScreen.kt: root colour state block not found")
          text = text.replace(old, new, 1)
          if "var heroPageColor by remember" in text:
              raise SystemExit("HomeScreen.kt: transient page colour state remains")
          home.write_text(text)

          library = Path("composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt")
          text = library.read_text()
          import_anchor = "import com.yfuse.core.designsystem.rememberArtworkPagePalette\n"
          if "import com.yfuse.core.designsystem.rememberRetainedArtworkPageColor\n" not in text:
              if import_anchor not in text:
                  raise SystemExit("LibraryHomeScreen.kt: import anchor missing")
              text = text.replace(
                  import_anchor,
                  import_anchor + "import com.yfuse.core.designsystem.rememberRetainedArtworkPageColor\n",
                  1,
              )
          old = '''    val slideUrl = slideUrls.firstOrNull { it != null }
              var sampledPageColor by remember { mutableStateOf<Color?>(null) }
              val palette = rememberArtworkPagePalette(sampledPageColor)
          '''
          new = '''    val slideUrl = slideUrls.firstOrNull { it != null }
              val retainedPageColor =
                  rememberRetainedArtworkPageColor("library:${state.currentServer?.id.orEmpty()}")
              val sampledPageColor = retainedPageColor.value
              val palette = rememberArtworkPagePalette(sampledPageColor)
          '''
          if old not in text:
              raise SystemExit("LibraryHomeScreen.kt: sampled page colour block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "onPageColor = { sampledPageColor = it },",
              "onPageColor = retainedPageColor::update,",
          )
          if "sampledPageColor = it" in text or "var sampledPageColor" in text:
              raise SystemExit("LibraryHomeScreen.kt: transient sampled colour assignment remains")
          library.write_text(text)
          PY

          git diff --check
          grep -q 'rememberRetainedArtworkPageColor("home:' composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt
          grep -q 'onHeroPageColor = retainedPageColor::update' composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt
          grep -q 'rememberRetainedArtworkPageColor("library:' composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt
          grep -q 'onPageColor = retainedPageColor::update' composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt

          rm .github/workflows/retain-poster-color-on-return.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): retain poster colour when returning from detail'
          git push origin HEAD:codex/restore-1.0.7-poster-transition
