name: Check poster transition ktlint

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    if: github.head_ref == 'codex/restore-1.0.7-poster-transition'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/restore-1.0.7-poster-transition
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Check Kotlin formatting
        run: ./gradlew ktlintCheck --no-daemon
      - name: Check patch whitespace
        run: git diff --check origin/master...HEAD
