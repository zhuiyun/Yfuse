name: Diagnose integrated navigation and Android 17 decoder failures
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: ['.github/workflows/qa-integrated-ui-diagnose.yml']
permissions: {contents: read, actions: read}
env:
  QA_APP_SHA: 6fed54460f600d46c7ebf3f7095c2724e7633d12
jobs:
  instrumented:
    name: Diagnose failed regressions API ${{ matrix.api }}
    env:
      QA_TEST_CLASSES: com.yfuse.core2.android.YCoreMediaSuiteInstrumentedTest,com.yfuse.feature.player.PlaybackReleaseInstrumentedTest,com.yfuse.feature.personal.PersonalSearchNavigationInstrumentedTest
      QA_MIN_TESTS: '7'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {api: 35, sdk: '35'}
          - {api: 37, sdk: '37.0'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: ui-validation-input, path: preview, run-id: 43789034940, github-token: '${{ github.token }}'}
      - name: Verify app and enable acceleration
        run: |
          set -euo pipefail
          (cd preview && sha256sum -c apk.sha256)
          grep -Fx "app=$QA_APP_SHA" preview/provenance.txt
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Use current Android 17 tools
        if: matrix.api == 37
        run: sudo rm -rf "${ANDROID_HOME:?}/cmdline-tools"
      - name: Run every self-contained device regression
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.sdk }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash qa-integrated/ui-regressions.sh "${{ matrix.api }}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'diagnose-ui-api-${{ matrix.api }}', path: results/, retention-days: 10}
