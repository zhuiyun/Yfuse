name: Build YCore native runtime

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-yfuse-mpv-dolby.yml
      - scripts/build-yfuse-mpv-bluray.sh
      - scripts/build-yfuse-mpv-dolby.sh
      - scripts/build-ycore-native.sh
      - scripts/build-ycore-demux.sh
      - scripts/package-ycore-native-aar.py
      - scripts/run-ycore-device-gates.sh
      - scripts/ycore-release-evidence.py
      - scripts/test-ycore-tone-map.sh
      - scripts/test-ycore-disc-uri.sh
      - scripts/verify-yfuse-mpv-bluray-aar.sh
      - scripts/verify-yfuse-mpv-dolby-aar.sh
      - scripts/verify-ycore-native.sh
      - scripts/verify-ycore-native-apk.sh
      - scripts/native/**
      - media-tests/**
      - composeApp/src/androidInstrumentedTest/kotlin/com/yfuse/core2/android/YCoreMediaSuiteInstrumentedTest.kt
      - composeApp/src/commonMain/kotlin/com/yfuse/core2/test/YMediaTestSuite.kt
      - composeApp/src/commonTest/kotlin/com/yfuse/core2/test/YMediaTestSuiteTest.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/MpvNativeBuildCapabilities.android.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/MpvDolbyRuntimeEvidence.android.kt
      - composeApp/src/commonMain/kotlin/com/yfuse/feature/player/MpvDolbyRuntimeEvidence.kt
      - composeApp/src/commonMain/kotlin/com/yfuse/feature/player/PlaybackTruth.kt

permissions:
  contents: read
  statuses: write

concurrency:
  group: yfuse-ycore-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: YCore + FFmpeg + libbluray (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout Yfuse
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake binutils build-essential cmake curl git gperf libtool \
            ninja-build pkg-config python3 python3-venv unzip wget yasm
          python3 -m venv "$RUNNER_TEMP/yfuse-meson"
          "$RUNNER_TEMP/yfuse-meson/bin/pip" install --disable-pip-version-check \
            "Jinja2==3.1.6" "meson==1.6.1"
          echo "$RUNNER_TEMP/yfuse-meson/bin" >> "$GITHUB_PATH"

      - name: Validate YCore source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-ycore-native-aar.py --self-test
          python3 scripts/ycore-release-evidence.py --self-test
          bash -n scripts/run-ycore-device-gates.sh
          bash scripts/test-ycore-tone-map.sh
          bash scripts/test-ycore-disc-uri.sh
          cp scripts/build-yfuse-mpv-bluray.sh "$RUNNER_TEMP/generated-dolby-builder.sh"
          python3 scripts/native/patch_yfuse_mpv_dolby_build.py "$RUNNER_TEMP/generated-dolby-builder.sh"
          bash -n "$RUNNER_TEMP/generated-dolby-builder.sh"
          grep -F 'DOLBY_VISION_RPU = true' "$RUNNER_TEMP/generated-dolby-builder.sh"
          grep -F 'DOLBY_VISION_FEL = true' "$RUNNER_TEMP/generated-dolby-builder.sh"
          grep -F 'dolbyVisionRuntimeEvidence' "$RUNNER_TEMP/generated-dolby-builder.sh"
          grep -F 'dolby-renderer=gpu-next' "$RUNNER_TEMP/generated-dolby-builder.sh"

      - name: Build pinned YCore native runtime
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-ycore-native.sh --arch arm64

      - name: Verify compatibility carrier
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-yfuse-mpv-dolby-aar.sh

      - name: Verify standalone YCore release gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-ycore-native.sh

      - name: Build hash-bound native-only device test APKs
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 .native-build/artifacts/ycore-native.aar \
            composeApp/libs/ycore-native.aar
          install -m 0644 .native-build/artifacts/libmpv-yfuse-bluray.aar \
            composeApp/libs/libmpv-release.aar
          install -m 0644 .native-build/artifacts/libmpv-yfuse-bluray.aar.sha256 \
            composeApp/libs/libmpv-release.aar.sha256
          install -m 0644 .native-build/artifacts/NATIVE-SOURCES.txt \
            composeApp/libs/libmpv-release.sources.txt
          ./gradlew --no-daemon --max-workers=2 \
            :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest \
            -PyfuseNativeOnlyRuntime=true \
            -PyfuseApplicationId=com.yfuse.validation
          app_apk=composeApp/build/outputs/apk/debug/composeApp-debug.apk
          test_apk=composeApp/build/outputs/apk/androidTest/debug/composeApp-debug-androidTest.apk
          bash scripts/verify-ycore-native-apk.sh "$app_apk"
          mkdir -p .native-build/artifacts/device-tests
          install -m 0644 "$app_apk" \
            .native-build/artifacts/device-tests/ycore-native-test-app.apk
          install -m 0644 "$test_apk" \
            .native-build/artifacts/device-tests/ycore-native-test-androidTest.apk
          (
            cd .native-build/artifacts/device-tests
            sha256sum ycore-native-test-app.apk ycore-native-test-androidTest.apk > SHA256SUMS
          )

      - name: Record artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .native-build/artifacts/NATIVE-SOURCES.txt
            echo 'architectures=arm64'
            cat .native-build/artifacts/ycore-native.aar.sha256
            cat .native-build/artifacts/libmpv-yfuse-bluray.aar.sha256
            cat .native-build/artifacts/device-tests/SHA256SUMS
          } > .native-build/artifacts/BUILD-MANIFEST.txt

      - name: Upload standalone YCore AAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ycore-native-arm64
          path: |
            .native-build/artifacts/ycore-native.aar
            .native-build/artifacts/ycore-native.aar.sha256
            .native-build/artifacts/NATIVE-SOURCES.txt
            .native-build/artifacts/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload hash-bound physical-device test APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ycore-device-test-apks
          path: .native-build/artifacts/device-tests/
          if-no-files-found: error
          retention-days: 30

      - name: Upload compatibility carrier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ycore-build-carrier-arm64
          path: |
            .native-build/artifacts/libmpv-yfuse-bluray.aar
            .native-build/artifacts/libmpv-yfuse-bluray.aar.sha256
            .native-build/artifacts/NATIVE-SOURCES.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish native build status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          status = os.environ.get("JOB_STATUS", "failure")
          state = "success" if status == "success" else "failure"
          description = (
              "standalone YCore native gates passed"
              if state == "success"
              else "YCore native build or release gate failed"
          )
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          run = os.environ["GITHUB_RUN_ID"]
          payload = json.dumps({
              "state": state,
              "context": "yfuse/ycore-native",
              "description": description,
              "target_url": f"https://github.com/{repo}/actions/runs/{run}",
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          urllib.request.urlopen(request, timeout=30).read()
          PY
