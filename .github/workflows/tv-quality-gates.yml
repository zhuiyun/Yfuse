name: Android TV quality gates

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - feature/**
      - codex/**
    paths:
      - .github/workflows/tv-quality-gates.yml
      - .github/workflows/build-ycore-source.yml
      - .github/actions/prepare-source-playback/**
      - composeApp/src/commonMain/**
      - composeApp/src/androidMain/**
      - composeApp/src/androidUnitTest/**
      - tvApp/**
      - tvShared/**
      - senplayerBridge/**
      - gradle/**
      - settings.gradle.kts
      - gradle.properties
      - version.properties
      - scripts/fetch-engines.sh
      - scripts/prepare-playback-inputs.py
      - scripts/playback-runtime-inputs.json
      - scripts/ycore-source-receipt.py
      - scripts/native-build-*.py
      - scripts/build-ycore*.sh
      - scripts/build-yfuse-mpv*.sh
      - scripts/package-ycore-native-aar.py
      - scripts/install-ycore-native.sh
      - scripts/verify-ycore-native.sh
      - scripts/verify-yfuse-mpv-dolby-aar.sh
      - scripts/engine-checksums.sha256
      - scripts/yfuse-mpv-sources.txt
      - scripts/embed-mini-debuginfo.sh
      - scripts/test-ycore*
      - scripts/native-test-build.sh
      - scripts/native/**
      - NOTICE
      - LICENSE
      - docs/third-party-licenses/**
      - scripts/tests/test_source_playback_workflow.py
      - scripts/verify-tv-*.py
      - scripts/tests/test_verify_tv_artifact.py
  pull_request:
    paths:
      - .github/workflows/tv-quality-gates.yml
      - .github/workflows/build-ycore-source.yml
      - .github/actions/prepare-source-playback/**
      - composeApp/src/commonMain/**
      - composeApp/src/androidMain/**
      - composeApp/src/androidUnitTest/**
      - tvApp/**
      - tvShared/**
      - senplayerBridge/**
      - gradle/**
      - settings.gradle.kts
      - gradle.properties
      - version.properties
      - scripts/fetch-engines.sh
      - scripts/prepare-playback-inputs.py
      - scripts/playback-runtime-inputs.json
      - scripts/ycore-source-receipt.py
      - scripts/native-build-*.py
      - scripts/build-ycore*.sh
      - scripts/build-yfuse-mpv*.sh
      - scripts/package-ycore-native-aar.py
      - scripts/install-ycore-native.sh
      - scripts/verify-ycore-native.sh
      - scripts/verify-yfuse-mpv-dolby-aar.sh
      - scripts/engine-checksums.sha256
      - scripts/yfuse-mpv-sources.txt
      - scripts/embed-mini-debuginfo.sh
      - scripts/test-ycore*
      - scripts/native-test-build.sh
      - scripts/native/**
      - NOTICE
      - LICENSE
      - docs/third-party-licenses/**
      - scripts/tests/test_source_playback_workflow.py
      - scripts/verify-tv-*.py
      - scripts/tests/test_verify_tv_artifact.py

permissions:
  contents: read
  actions: read

concurrency:
  group: android-tv-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Compile this commit's YCore runtime
    uses: ./.github/workflows/build-ycore-source.yml

  tv:
    needs: native
    name: Compile, test, and inspect TV APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify source TV contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-tv-source.py \
            --manifest tvApp/src/androidMain/AndroidManifest.xml \
            --banner tvApp/src/main/res/drawable-nodpi/tv_banner.png
          python3 -m py_compile \
            scripts/verify-tv-source.py \
            scripts/verify-tv-artifact.py
          python3 -m unittest discover \
            --start-directory scripts/tests \
            --pattern 'test_verify_tv_artifact.py'
          git diff --check

      - name: Install Android 37.0 build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Prepare source-built YCore and original SenPlayer inputs
        uses: ./.github/actions/prepare-source-playback
        with:
          artifact-id: ${{ needs.native.outputs.artifact_id }}
          run-id: ${{ github.run_id }}
          aar-sha256: ${{ needs.native.outputs.aar_sha256 }}
          provenance-sha256: ${{ needs.native.outputs.provenance_sha256 }}
          source-commit: ${{ needs.native.outputs.source_commit }}

      # The signing branch is under explicit review before APK packaging. Its TV
      # checks compile and test; artifact assembly remains available on other branches.
      - name: Run TV unit tests during signing review
        if: github.ref == 'refs/heads/codex/ycore-sign-20260830'
        run: ./gradlew :tvApp:ktlintCheck :tvShared:ktlintCheck :tvShared:testAndroidHostTest --no-daemon

      - name: Run TV unit tests and build debug APK
        if: github.ref != 'refs/heads/codex/ycore-sign-20260830'
        shell: bash
        run: |
          set -euo pipefail
          # Both APKs dex inside the Gradle daemon in one invocation; at the default 2 GB heap, D8
          # ran out of memory once the shared code passed what one heap could hold alongside the
          # tests. The phone's quality gate gives its builds the same room.
          ./gradlew \
            :tvApp:ktlintCheck :tvShared:ktlintCheck \
            :tvShared:testAndroidHostTest \
            :tvApp:assembleDebug \
            :tvApp:assembleRelease -PallowDebugSigning=true \
            "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8" \
            --stacktrace \
            --no-daemon
          # The R8 build is what ships; a debug APK proves nothing about shrinking.
          test -s tvApp/build/outputs/apk/release/tvApp-release.apk
          python3 scripts/verify-playback-package.py tvApp/build/outputs/apk/release/tvApp-release.apk \
            --mapping tvApp/build/outputs/mapping/release/mapping.txt

      - name: Reject DEX code ART would not verify
        if: github.ref != 'refs/heads/codex/ycore-sign-20260830'
        run: >-
          scripts/verify-release-dex.sh
          --mapping tvApp/build/outputs/mapping/release/mapping.txt
          tvApp/build/outputs/apk/release/tvApp-release.apk

      - name: Verify packaged TV contract
        if: github.ref != 'refs/heads/codex/ycore-sign-20260830'
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          apk="tvApp/build/outputs/apk/debug/tvApp-debug.apk"
          test -s "$apk"
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          python3 scripts/verify-tv-artifact.py \
            --aapt "$build_tools/aapt" \
            --readelf "$(command -v readelf)" \
            "$apk"
          mkdir -p build/tv-quality
          cp "$apk" build/tv-quality/Yfuse-TV-debug.apk
          sha256sum build/tv-quality/Yfuse-TV-debug.apk > build/tv-quality/SHA256SUMS

      - name: Upload verified TV APK
        if: github.ref != 'refs/heads/codex/ycore-sign-20260830'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: yfuse-tv-debug-${{ github.sha }}
          path: build/tv-quality/
          if-no-files-found: error
          retention-days: 7
