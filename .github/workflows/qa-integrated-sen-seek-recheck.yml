name: Recheck the unconfirmed SenPlayer movie seek with discontinuity-safe evidence
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: ['.github/workflows/qa-integrated-sen-seek-recheck.yml']
permissions: {contents: read, actions: read}
jobs:
  driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Verify progress observer and build touch recorder
        run: |
          set -euo pipefail
          jar=$(find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)
          mkdir -p "$RUNNER_TEMP/progress-test" qa-driver
          javac -encoding UTF-8 -classpath "$jar" -d "$RUNNER_TEMP/progress-test" qa-arm-matrix/Driver.java qa-arm-matrix/FrameProgressTest.java
          java -cp "$RUNNER_TEMP/progress-test:$jar" qa.yfuse.gesture.FrameProgressTest
          cp qa-arm-matrix/Driver.java qa-volume/input-driver.java
          sed 's|adb install -r driver.apk|cp driver.apk "$GITHUB_WORKSPACE/qa-driver/driver.apk"|' qa-volume/build-driver.sh > "$RUNNER_TEMP/build-qa.sh"
          bash "$RUNNER_TEMP/build-qa.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: arm-input-driver, path: qa-driver, retention-days: 7}
  diagnose:
    needs: driver
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    env:
      QA_ENGINE: SenPlayer
      QA_SHARD: '12'
      QA_SEED_BASE: '23011846'
      QA_SESSIONS: '20'
      QA_BATCHES: '1'
      QA_BATCH_COUNT: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: arm-input-driver, path: qa-driver}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: candidate-test-input, path: preview, run-id: 43797076221, github-token: '${{ github.token }}'}
      - name: Verify APK and reproduce the same MPEG4/MP3 movie
        run: |
          set -euo pipefail
          (cd preview && sha256sum -c apk.sha256)
          grep -Fx 'app=217e6115c55d52e09f772833a52bfc867f0ae8c0' preview/provenance.txt
          sudo apt-get -qq update && sudo apt-get install -y ffmpeg python3-pil
          /usr/bin/python3 qa-title-seek-check/prepare.py 44 86
      - name: Boot cloud ARM64 Android
        run: bash qa-arm-dual/redroid.sh
      - name: Capture the failed open and decoder diagnostics
        run: bash qa-arm-matrix/run.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: sen-seek-discontinuity-recheck, path: results/, retention-days: 10}
