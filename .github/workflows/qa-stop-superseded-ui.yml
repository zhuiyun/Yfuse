name: Retire only explicitly superseded UI and activity runs
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: [.github/workflows/qa-stop-superseded-ui.yml]
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Validate immutable identities before cancelling obsolete comparisons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          repo='zhuiyun/Yfuse'
          targets={
            44040840128:('335b38660d8d9ba71527ab907f9a4924ee6e765e','.github/workflows/qa-system-bars.yml'),
            44040839990:('335b38660d8d9ba71527ab907f9a4924ee6e765e','.github/workflows/qa-secondary-ui-audit.yml'),
            44040364387:('1d770ae7eee34bcab82c007abf8b3942eb301739','.github/workflows/qa-integrated-av-repair.yml'),
            44036346513:('6975c31c078eb61ab8613ad73528001dc2f4005a','.github/workflows/qa-power-ui-final.yml'),
          }
          for run,(sha,path) in targets.items():
              endpoint=f'repos/{repo}/actions/runs/{run}'
              data=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
              assert data['head_sha']==sha and data['path']==path
              assert data['head_branch']=='codex/two-engines-cloud-seek-20261113'
              if data['status']=='completed':
                  print(run,'already completed; preserved',data['conclusion'])
                  continue
              subprocess.run(['gh','api','--method','POST',endpoint+'/cancel'],check=True)
              print(run,'cancel requested: replaced by protected navigation candidate')
          PY
