name: Verify real system bar colors and Back across app themes and rotations
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: [.github/workflows/qa-system-bars.yml]
permissions: {contents: read, actions: read}
jobs:
  system_bars:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Acquire exact qualified current app
        env: {API_TOKEN: '${{ github.token }}'}
        run: bash qa-integrated/acquire-qualified-candidate.sh 44040364387 148f364761158b586573db81414360d2c51d7128
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: arm-input-driver, path: qa-driver, run-id: 44029183033, github-token: '${{ github.token }}'}
      - run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil
          mkdir results
          cp preview/provenance.txt preview/apk.sha256 results/
          bash qa-arm-dual/redroid.sh
          adb install -r -g preview/composeApp-release.apk
          adb install -r qa-driver/driver.apk
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell wm dismiss-keyguard
          touch /tmp/yfuse-tree-active
      - name: Verify actual navigation inset pixels and system Back
        run: python3 qa-power-ui/system_bars.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: system-bars-theme-and-rotation, path: results/, retention-days: 10}
