name: Verify deployed refresh identity and latest phone TV handoff
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: [.github/workflows/qa-account-live.yml]
permissions:
  contents: read
  actions: read
jobs:
  account_pair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Prepare private transport and verify product sources
        run: |
          set -euo pipefail
          umask 077
          # Phone product source 0127f26 equals TV build 5276e31: their diff
          # contains only a qualification workflow file, no app sources.
          mkdir -p "$RUNNER_TEMP/account-private-logs" results account-sealed
          sudo apt-get update -qq
          sudo apt-get install -y python3-cryptography python3-pil ffmpeg
          /usr/bin/python3 qa-account-live/transport.py prepare
      - name: Acquire qualified phone build
        env: {API_TOKEN: "${{ github.token }}"}
        run: bash qa-integrated/acquire-qualified-candidate.sh 44034015111 0127f268d4fb00b4a83c08640b0803a76cfac866
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: yfuse-tv-debug-5276e310fa575a1244bb2b611d4b58020192e306
          path: tv-input
          run-id: 44034015185
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arm-input-driver
          path: qa-driver
          run-id: 44029183033
          github-token: ${{ github.token }}
      - name: Boot two isolated cloud Android devices
        run: |
          bash qa-arm-dual/redroid.sh
          bash qa-account-live/boot-tv.sh
      - name: Install verified phone and TV shells
        run: |
          set -euo pipefail
          (cd preview && sha256sum -c apk.sha256)
          python3 - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('tv-input')
          expected=(p/'SHA256SUMS').read_text().split()[0]
          assert hashlib.sha256((p/'Yfuse-TV-debug.apk').read_bytes()).hexdigest()==expected
          PY
          adb -s 127.0.0.1:15555 install -r -g preview/composeApp-release.apk
          adb -s 127.0.0.1:15556 install -r -g tv-input/Yfuse-TV-debug.apk
          for serial in 127.0.0.1:15555 127.0.0.1:15556; do
            adb -s "$serial" install -r qa-driver/driver.apk
            adb -s "$serial" shell settings put secure immersive_mode_confirmations confirmed
            adb -s "$serial" shell settings put secure accessibility_interactive_ui_timeout_ms 60000
            adb -s "$serial" shell wm dismiss-keyguard
          done
          touch /tmp/yfuse-tree-active
      - name: Publish only the one-run public key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: account-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: account-public/
          retention-days: 1
      - name: Await encrypted account envelope
        env: {API_TOKEN: "${{ github.token }}"}
        run: /usr/bin/python3 qa-account-live/transport.py wait
      - name: Test real login and TV consent without public private-data logs
        run: |
          umask 077
          timeout --signal=TERM --kill-after=30s 25m /usr/bin/python3 qa-account-live/test.py > "$RUNNER_TEMP/account-private-logs/test.txt" 2>&1
      - name: Revoke only sessions created by this run
        if: always()
        run: |
          umask 077
          /usr/bin/python3 qa-account-live/account.py cleanup > "$RUNNER_TEMP/account-private-logs/cleanup.txt" 2>&1
      - name: Encrypt private UI and diagnostic evidence
        if: always()
        run: /usr/bin/python3 qa-account-live/transport.py seal
      - name: Retain only sealed evidence and numeric case results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: account-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: account-sealed/
          retention-days: 7
      - name: Erase cloud app state and one-run keys
        if: always()
        run: |
          for serial in 127.0.0.1:15555 127.0.0.1:15556; do
            timeout 15 adb -s "$serial" shell pm clear com.yfuse >/dev/null 2>&1 || true
          done
          rm -f "$RUNNER_TEMP/account-inbound.pem" "$RUNNER_TEMP/account-envelope.json" "$RUNNER_TEMP/account-coordinator.json"
