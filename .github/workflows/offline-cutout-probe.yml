name: Android offline cutout model comparison
on:
  push:
    branches: [probe/offline-cutout-20261025]
    paths: [tools/offline-cutout-probe/**, .github/workflows/offline-cutout-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-cutout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python for the official Paddle export
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install build-time-only conversion dependencies
        run: python -m pip install 'numpy<2' paddlepaddle==2.6.2 paddle2onnx==1.2.3 onnx==1.16.2 onnxruntime==1.23.2 pillow
      - name: Fetch exact models and verify Paddle to ONNX equivalence
        run: python tools/offline-cutout-probe/prepare_assets.py
      - name: Install compile platform
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Build and lint isolated offline test APKs
        run: ./gradlew -p tools/offline-cutout-probe :app:assembleDebug :app:lintDebug --no-daemon --max-workers=2
      - name: Verify version, signature, model hashes and absent Internet permission
        run: python tools/offline-cutout-probe/verify_apk.py
      - name: Retain checked APKs before emulator test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-cutout-apks-${{ github.run_id }}
          path: tools/offline-cutout-probe/artifacts/apk/
          if-no-files-found: error
          retention-days: 7
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run every model on Android offline, in separate processes
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6144M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: python tools/offline-cutout-probe/run_device.py
      - name: Retain all actual model outputs and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-cutout-evidence-${{ github.run_id }}
          path: |
            tools/offline-cutout-probe/artifacts/device/
            tools/offline-cutout-probe/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
