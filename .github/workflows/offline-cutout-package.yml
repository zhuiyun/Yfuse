name: Clean package of verified Android offline cutout models
on:
  push:
    branches: [probe/offline-cutout-package-20261026]
    paths: [tools/offline-cutout-probe/**, .github/workflows/offline-cutout-package.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy<2' onnx==1.18.0 onnxruntime==1.23.2 pillow
      - name: Reproduce tested weights and replay immutable Android evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40213736535 --repo zhuiyun/Yfuse --name offline-native-apks-40213736535 --dir "$RUNNER_TEMP/previous-probe"
          python tools/offline-cutout-probe/prepare_optimization.py "$RUNNER_TEMP/previous-probe"
          gh run download 40245649663 --repo zhuiyun/Yfuse --name offline-optimization-evidence-40245649663 --dir "$RUNNER_TEMP/tested-evidence"
          cp -a "$RUNNER_TEMP/tested-evidence/artifacts/." tools/offline-cutout-probe/artifacts/
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('tools/offline-cutout-probe')
          current=json.loads((root/'test-manifest.json').read_text())
          tested=json.loads((root/'artifacts/test-manifest.json').read_text())
          assert current==tested, 'Reproduced weights/configuration differ from Android-tested manifest'
          for model in current['models']:
              report=json.loads((root/'artifacts/device/offline-probe'/model['id']/'report.json').read_text())
              assert report['model']==model and report['status']=='outputs_created'
              assert report['internet_permission'] is False
          provenance=dict(test_run=40245649663,test_commit='f0c115ac91ef4ab9e1201b1202ef8dba69133907',test_artifact=12618588216,test_artifact_sha256='2095152fa3f28c94d4b038c8d08365d4bbcfe2f7dab4e67ba906374db755b58a')
          (root/'artifacts/evidence-provenance.json').write_text(json.dumps(provenance,indent=2))
          PY
          python tools/offline-cutout-probe/select_optimization.py
      - name: Install compile platform
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Clean build and verify the selected two-model APK
        run: |
          ./gradlew -p tools/offline-cutout-probe :app:clean :app:assembleDebug :app:lintDebug --no-daemon --max-workers=2
          python tools/offline-cutout-probe/verify_apk.py
      - name: Save checked phone package and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-clean-phone-${{ github.run_id }}
          path: |
            tools/offline-cutout-probe/artifacts/apk/Yfuse-offline-cutout-probe-0.0.2-arm64-v8a.apk
            tools/offline-cutout-probe/artifacts/apk/apk-metadata.json
            tools/offline-cutout-probe/artifacts/apk/model-manifest.json
            tools/offline-cutout-probe/artifacts/optimization.json
            tools/offline-cutout-probe/artifacts/evidence-provenance.json
          if-no-files-found: error
          retention-days: 7
