name: Build Yfuse Dolby Vision P7 branch

on:
  push:
    branches:
      - fix/playback-diagnostics-20260823
    paths:
      - .github/workflows/build-yfuse-mpv-dolby-branch.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: yfuse-dolby-p7-branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mpv + FFmpeg + libplacebo P7 FEL
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Yfuse
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='yfuse/mpv-dolby-p7-branch' \
            -f description='Building verified Dolby Vision P7 RPU/FEL native stack' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake binutils build-essential cmake curl git gperf libtool \
            ninja-build pkg-config python3 python3-venv unzip wget yasm
          python3 -m venv "$RUNNER_TEMP/yfuse-meson"
          "$RUNNER_TEMP/yfuse-meson/bin/pip" install --disable-pip-version-check \
            "Jinja2==3.1.6" "meson==1.6.1"
          echo "$RUNNER_TEMP/yfuse-meson/bin" >> "$GITHUB_PATH"

      - name: Validate generated builder
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/build-yfuse-mpv-bluray.sh "$RUNNER_TEMP/generated-dolby-builder.sh"
          python3 scripts/native/patch_yfuse_mpv_dolby_build.py "$RUNNER_TEMP/generated-dolby-builder.sh"
          bash -n "$RUNNER_TEMP/generated-dolby-builder.sh"
          grep -F 'DOLBY_VISION_RPU = true' "$RUNNER_TEMP/generated-dolby-builder.sh"
          grep -F 'DOLBY_VISION_FEL = true' "$RUNNER_TEMP/generated-dolby-builder.sh"
          grep -F 'dolbyVisionRuntimeEvidence' "$RUNNER_TEMP/generated-dolby-builder.sh"
          grep -F 'dolby-renderer=gpu-next' "$RUNNER_TEMP/generated-dolby-builder.sh"

      - name: Build pinned Dolby native engine
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-ycore-native.sh --arch arm64

      - name: Verify native release gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-ycore-native.sh

      - name: Stage native release
        id: native
        shell: bash
        run: |
          set -euo pipefail
          src='.native-build/artifacts/libmpv-yfuse-bluray.aar'
          sources='.native-build/artifacts/NATIVE-SOURCES.txt'
          test -s "$src"
          test -s "$sources"
          mkdir -p build/native-release
          cp "$src" build/native-release/libmpv-release.aar
          sha256sum build/native-release/libmpv-release.aar > build/native-release/libmpv-release.aar.sha256
          cp "$sources" build/native-release/NATIVE-SOURCES.txt
          short_sha="${GITHUB_SHA:0:12}"
          tag="native-mpv-dolby-p7-${short_sha}-arm64-20260823"
          checksum="$(awk '{print $1}' build/native-release/libmpv-release.aar.sha256)"
          {
            cat build/native-release/NATIVE-SOURCES.txt
            echo 'architectures=arm64'
            cat build/native-release/libmpv-release.aar.sha256
          } > build/native-release/BUILD-MANIFEST.txt
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Publish pinned native release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.native.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            build/native-release/libmpv-release.aar \
            build/native-release/libmpv-release.aar.sha256 \
            build/native-release/NATIVE-SOURCES.txt \
            build/native-release/BUILD-MANIFEST.txt \
            --target "$GITHUB_SHA" \
            --title "Yfuse native mpv Dolby Vision P7 FEL" \
            --notes "Pinned arm64 Yfuse libmpv stack with libbluray ISO/BDMV/HDMV/multi-angle plus Dolby Vision RPU and Profile 7 FEL gpu-next render evidence."

      - name: Integrate native release into app build
        env:
          NATIVE_TAG: ${{ steps.native.outputs.tag }}
          NATIVE_SHA256: ${{ steps.native.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          cp build/native-release/NATIVE-SOURCES.txt scripts/yfuse-mpv-sources.txt
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['NATIVE_TAG']
          checksum = os.environ['NATIVE_SHA256']

          checksums = Path('scripts/engine-checksums.sha256')
          text = checksums.read_text()
          text, count = re.subn(
              r'^[0-9a-fA-F]{64}  libmpv-release\.aar$',
              f'{checksum}  libmpv-release.aar',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit('could not update libmpv checksum pin')
          checksums.write_text(text)

          fetch = Path('scripts/fetch-engines.sh')
          text = fetch.read_text()
          text, count = re.subn(
              r'^MPV_RELEASE_TAG="[^"]+"$',
              f'MPV_RELEASE_TAG="{tag}"',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit('could not update native release tag')
          text, count = re.subn(
              r'^MPV_VERIFIER="\$ROOT/scripts/verify-yfuse-mpv-bluray-aar\.sh"$',
              'MPV_VERIFIER="$ROOT/scripts/verify-ycore-native.sh"',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit('could not upgrade native verifier')
          fetch.write_text(text)

          Path('.github/sign-android-request').write_text(
              'version_code=171\n'
              'version_name=1.0.8\n'
              '# build=20260823-dolby-p7-fel\n'
          )
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/engine-checksums.sha256 scripts/fetch-engines.sh scripts/yfuse-mpv-sources.txt .github/sign-android-request
          git commit -m 'feat: ship verified Dolby Vision P7 FEL native stack'
          git push origin HEAD:fix/playback-diagnostics-20260823

      - name: Upload Dolby native build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libmpv-yfuse-dolby-p7-arm64-${{ github.sha }}
          path: build/native-release/
          if-no-files-found: error
          retention-days: 14

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='Verified Dolby Vision P7 RPU/FEL native stack integrated'
          else
            state=failure
            description='Dolby Vision P7 native build or verification failed'
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='yfuse/mpv-dolby-p7-branch' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
