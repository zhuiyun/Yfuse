name: Diagnose original media profiles and long duration seek mapping
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: [.github/workflows/qa-format-diagnostics.yml]
permissions: {contents: read, actions: read}
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Build observed gesture input
        run: |
          set -euo pipefail
          mkdir -p qa-private-driver
          python3 qa-private-arm/build_input.py
          sed 's|adb install -r driver.apk|cp driver.apk "$GITHUB_WORKSPACE/qa-private-driver/driver.apk"|' qa-source-trace/build-driver.sh > "$RUNNER_TEMP/driver.sh"
          bash "$RUNNER_TEMP/driver.sh"
      - run: python3 qa-format-diagnostics/fixtures.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: format-fixtures-and-driver
          path: |
            format-fixtures/
            qa-private-driver/
          retention-days: 5
  diagnose:
    needs: fixtures
    strategy: {fail-fast: false, matrix: {core: [YCore, SenPlayer]}}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env: {QA_ENGINE: '${{ matrix.core }}'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Acquire qualified current app
        env: {API_TOKEN: '${{ github.token }}'}
        run: bash qa-integrated/acquire-qualified-candidate.sh 44043238227 141ed26051de24641214d34828324d71fabd115c
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: format-fixtures-and-driver, path: .}
      - run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-pil python3-cryptography
          mkdir results
          cp preview/provenance.txt preview/apk.sha256 results/
          bash qa-arm-dual/redroid.sh
          adb install -r -g preview/composeApp-release.apk
          adb install -r qa-private-driver/driver.apk
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000
          adb shell wm dismiss-keyguard
          touch /tmp/yfuse-tree-active
      - run: python3 qa-format-diagnostics/run.py
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'format-diagnostics-${{ matrix.core }}', path: results/, retention-days: 10}
