name: Diagnose release DEX verification

# Temporary: builds the phone and TV release packages of 1.0.99 — 1.0.98 with #211, the 播出日历
# card and the DLNA relay merged — checks both packages (types and the register limit), lists their
# largest methods, and lets ART on an Android 16 emulator verify the phone package. Removed again
# before the merge, as it was for 1.0.98.

on:
  push:
    branches:
      - ccr-afc1c9d3-phenca
    paths:
      - .github/workflows/diagnose-release-dex.yml
      - scripts/dex-verify/**
      - scripts/verify-release-dex.sh
      - composeApp/src/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android 37.0 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
      - name: Build and install current YCore runtime
        uses: ./.github/actions/build-current-ycore
      - name: ktlint
        continue-on-error: true
        run: ./gradlew :composeApp:ktlintCheck :tvShared:ktlintCheck --no-daemon --continue
      - name: Build the R8 release packages
        run: >-
          ./gradlew :composeApp:assembleRelease :tvApp:assembleRelease -PallowDebugSigning=true
          "-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8" --no-daemon
      - name: Keep the phone package for the emulator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phone-${{ github.run_id }}
          path: composeApp/build/outputs/apk/release/composeApp-release.apk
          if-no-files-found: error
          retention-days: 3
      - name: Check both packages and list their large methods
        run: >-
          scripts/verify-release-dex.sh --list-registers-over 160
          --mapping composeApp/build/outputs/mapping/release/mapping.txt
          composeApp/build/outputs/apk/release/composeApp-release.apk
          --mapping tvApp/build/outputs/mapping/release/mapping.txt
          tvApp/build/outputs/apk/release/tvApp-release.apk

  art:
    name: ART verification on Android 36
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: phone-${{ github.run_id }}
          path: apk/phone
      - name: Enable hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the package with ART
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash scripts/diagnostics/art_verify_on_emulator.sh artifacts/art-verify apk/phone/composeApp-release.apk
