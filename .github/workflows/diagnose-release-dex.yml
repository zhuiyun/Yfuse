name: Diagnose release DEX verification

# Temporary: lists the methods of the phone and TV release packages that need more than 160
# registers, the app's own and the libraries', to size the split of PlayerRoot's runtime lambda
# and the register limit the release check enforces.

on:
  push:
    branches:
      - ccr-043c5706-n2gipq
    paths:
      - .github/workflows/diagnose-release-dex.yml
      - scripts/dex-verify/**
      - scripts/verify-release-dex.sh
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registers:
    name: Register counts of the release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android 37.0 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
      - name: Build and install current YCore runtime
        uses: ./.github/actions/build-current-ycore
      - name: Build the R8 release packages
        run: ./gradlew :composeApp:assembleRelease :tvApp:assembleRelease -PallowDebugSigning=true --no-daemon
      - name: Check both packages and list their large methods
        run: >-
          scripts/verify-release-dex.sh --list-registers-over 160
          --mapping composeApp/build/outputs/mapping/release/mapping.txt
          composeApp/build/outputs/apk/release/composeApp-release.apk
          --mapping tvApp/build/outputs/mapping/release/mapping.txt
          tvApp/build/outputs/apk/release/tvApp-release.apk
          || echo "::warning::the packages have findings"
