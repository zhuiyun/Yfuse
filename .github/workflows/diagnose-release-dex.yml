name: Diagnose release DEX verification

# Temporary: R8 9.1.31 through 9.4.20 all compile PlayerRootKt.PlayerRoot$lambda$152 into code ART
# rejects (a captured parameter's low-register copy is overwritten while another lambda's
# arguments are staged). Builds two variants of PlayerRoot.kt that stop reading that parameter
# late in the lambda, checks each package, and lets ART on an Android 16 emulator verify them.

on:
  push:
    branches:
      - ccr-043c5706-n2gipq
    paths:
      - .github/workflows/diagnose-release-dex.yml
      - scripts/diagnostics/**
      - scripts/dex-verify/**
      - scripts/verify-release-dex.sh
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  variant:
    name: PlayerRoot variant ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [local, state]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android 37.0 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
      - name: Build and install current YCore runtime
        uses: ./.github/actions/build-current-ycore
      - name: Apply the variant
        run: |
          python3 scripts/diagnostics/variants/apply_variant.py ${{ matrix.variant }}
          git diff
      - name: Build the R8 release package
        run: ./gradlew :composeApp:assembleRelease -PallowDebugSigning=true --no-daemon
      - name: Keep the package for the emulator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: variant-${{ matrix.variant }}-${{ github.run_id }}
          path: composeApp/build/outputs/apk/release/composeApp-release.apk
          if-no-files-found: error
          retention-days: 3
      - name: Fetch baksmali
        shell: bash
        run: |
          set -euo pipefail
          tools=build/dex-verify-tools
          mkdir -p "$tools"
          while read -r path sha256; do
            jar="$tools/${path##*/}"
            curl -fsSL --retry 3 --proto '=https' -o "$jar" "https://repo1.maven.org/maven2/$path"
            echo "$sha256  $jar" | sha256sum -c -
          done <<'EOF'
          org/smali/baksmali/2.5.2/baksmali-2.5.2.jar 1ed236266d7dc4907aade0b19a34f77efac25342b63c8ace52e579039941b389
          org/smali/util/2.5.2/util-2.5.2.jar 4f580a9cff3ebb83cb3fd20bec88e37e4f183796ca652732992611620282daea
          com/beust/jcommander/1.64/jcommander-1.64.jar 156be736199c990321d9ff77090b199629cfc9865e2d6c13f7cd291bb1641817
          org/smali/dexlib2/2.5.2/dexlib2-2.5.2.jar 5a5c8982d8bd7d6e3bb1a0713049e3c78b719ec32b20f6b619885cec30a0dd61
          com/google/guava/guava/27.1-android/guava-27.1-android.jar 686404f2d1d4d221911f96bd627ff60dac2226a5dfa6fb8ba517073eb97ec0ef
          com/google/guava/failureaccess/1.0.1/failureaccess-1.0.1.jar a171ee4c734dd2da837e4b16be9df4661afab72a41adaf31eb84dfdaf936ca26
          EOF
          echo "BAKSMALI_CP=$(ls "$PWD"/$tools/*.jar | tr '\n' ':')" >> "$GITHUB_ENV"
      - name: Size of PlayerRootKt's largest methods
        run: >-
          python3 scripts/diagnostics/inspect_dex_method.py --baksmali-classpath "$BAKSMALI_CP"
          --apk composeApp/build/outputs/apk/release/composeApp-release.apk
          --class 'Lcom/yfuse/feature/player/PlayerRootKt;'
      - name: Reject DEX code ART would not verify
        run: scripts/verify-release-dex.sh composeApp/build/outputs/apk/release/composeApp-release.apk

  art:
    name: ART verification of variant ${{ matrix.variant }} on Android 36
    needs: variant
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [local, state]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: variant-${{ matrix.variant }}-${{ github.run_id }}
          path: apk/${{ matrix.variant }}
      - name: Enable hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the package with ART
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash scripts/diagnostics/art_verify_on_emulator.sh artifacts/art-verify apk/${{ matrix.variant }}/composeApp-release.apk
