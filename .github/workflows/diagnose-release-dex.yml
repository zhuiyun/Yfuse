name: Diagnose release DEX verification

# Temporary: the packaged 1.0.97 (259) APK's player crashed with VerifyError. Rebuilds this source,
# captures the exact input AGP gives R8, replays it with newer R8 releases and checks every result;
# and lets ART on an emulator verify the 1.0.96 and 1.0.97 packages.

on:
  push:
    branches:
      - ccr-043c5706-n2gipq
    paths:
      - .github/workflows/diagnose-release-dex.yml
      - scripts/diagnostics/**
      - scripts/dex-verify/**
      - scripts/verify-release-dex.sh
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  r8:
    name: Replay this build's R8 input with newer R8 releases
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android 37.0 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then sdkmanager="$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"; fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Download player engines
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v 7z >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y p7zip-full; fi
          chmod +x gradlew scripts/fetch-engines.sh
          scripts/fetch-engines.sh
      - name: Build and install current YCore runtime
        uses: ./.github/actions/build-current-ycore
      - name: Build the R8 release package and dump R8's input
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Dcom.android.tools.r8.dumpinputtodirectory=${{ github.workspace }}/build/r8-dump
        run: ./gradlew :composeApp:assembleRelease -PallowDebugSigning=true --no-daemon
      - name: Check the package AGP built
        shell: bash
        run: |
          scripts/verify-release-dex.sh composeApp/build/outputs/apk/release/composeApp-release.apk ||
            echo "::warning::the AGP-built package has findings"
      - name: Replay R8's input with other R8 releases
        shell: bash
        run: |
          set -uo pipefail
          dump=""
          best=0
          for candidate in build/r8-dump/*.zip; do
            unzip -p "$candidate" build.properties | grep -qx 'tool=R8' || continue
            size="$(unzip -l "$candidate" program.jar | awk 'NR == 4 { print $1 }')"
            echo "$candidate: R8 $(unzip -p "$candidate" r8-version | cut -d' ' -f1), program.jar $size bytes"
            if (( size > best )); then best="$size"; dump="$candidate"; fi
          done
          [[ -n "$dump" ]] || { echo "::error::R8 wrote no dump"; exit 1; }
          unzip -p "$dump" build.properties
          mkdir -p build/r8
          releases=(
            "9.1.31 3b4de3053885da105e39c15212261d22653d6d1b5eb92323dd04ae913cc8286f"
            "9.1.56 79580bc35617d5c60d417957c06bc337bae6cba55072d567a3fb7bb4d2a5dd56"
            "9.2.38 f1b5d437d7da7bd3a1341777d04812a20ebd98b7f63f1110789dd05fd5da27e1"
            "9.3.31 29677b994a40668b97155a65628afd953f72571a8100bfa7296b4c5bcc79676c"
            "9.4.20 4e7dbcd64cce11b62e7d89ec8e855df2fb6f04f1fc4635b23d28a652f9ad334b"
          )
          for release in "${releases[@]}"; do
            read -r version sha256 <<<"$release"
            echo "===== R8 $version"
            jar="build/r8/r8-$version.jar"
            curl -fsSL --retry 3 --proto '=https' -o "$jar" "https://storage.googleapis.com/r8-releases/raw/$version/r8lib.jar"
            echo "$sha256  $jar" | sha256sum -c - || continue
            python3 scripts/diagnostics/replay_r8_dump.py --dump "$dump" --r8 "$jar" --output "build/r8/$version.zip" || continue
            scripts/verify-release-dex.sh "build/r8/$version.zip" || echo "::warning::R8 $version output has findings"
          done

  art:
    name: ART verification on Android ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download 1.0.97 (259) package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Yfuse-1.0.97
          run-id: 36862579231
          github-token: ${{ github.token }}
          path: apk/1.0.97
      - name: Download 1.0.96 (258) package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: Yfuse-1.0.96
          run-id: 36695042729
          github-token: ${{ github.token }}
          path: apk/1.0.96
      - name: Enable hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify both packages with ART
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -accel on
          script: bash scripts/diagnostics/art_verify_on_emulator.sh artifacts/art-verify apk/1.0.96/Yfuse-258-1.0.96.apk apk/1.0.97/Yfuse-259-1.0.97.apk
      - name: Keep logcat
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: art-verify-api-${{ matrix.api }}-${{ github.run_id }}
          path: artifacts/art-verify/
          if-no-files-found: warn
          retention-days: 3
