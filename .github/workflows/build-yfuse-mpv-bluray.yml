name: Build Yfuse mpv Blu-ray

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/build-yfuse-mpv-bluray.yml
      - scripts/build-yfuse-mpv-bluray.sh
      - scripts/build-ycore-native.sh
      - scripts/build-ycore-demux.sh
      - scripts/install-yfuse-mpv-bluray.sh
      - scripts/verify-yfuse-mpv-bluray-aar.sh
      - scripts/verify-ycore-native.sh
      - scripts/native/**

permissions:
  contents: write

concurrency:
  group: repair-yfuse-mpv-bluray-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-and-repair-release:
    if: github.event.pull_request.head.ref == 'codex/repair-native-mpv-20260821'
    name: Rebuild and repair pinned native dependency
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Yfuse
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake binutils build-essential cmake curl git gperf libtool \
            ninja-build pkg-config python3 python3-venv unzip wget yasm
          python3 -m venv "$RUNNER_TEMP/yfuse-meson"
          "$RUNNER_TEMP/yfuse-meson/bin/pip" install --disable-pip-version-check \
            'Jinja2==3.1.6' 'meson==1.6.1'
          echo "$RUNNER_TEMP/yfuse-meson/bin" >> "$GITHUB_PATH"

      - name: Build pinned arm64 native engine
        shell: bash
        run: |
          set -euo pipefail
          chmod +x \
            scripts/build-yfuse-mpv-bluray.sh \
            scripts/build-ycore-native.sh \
            scripts/build-ycore-demux.sh \
            scripts/verify-yfuse-mpv-bluray-aar.sh \
            scripts/verify-ycore-native.sh
          scripts/build-ycore-native.sh --arch arm64
          scripts/verify-ycore-native.sh

      - name: Require repository-locked digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          src='.native-build/artifacts/libmpv-yfuse-bluray.aar'
          test -s "$src"
          expected="$(awk '$2 == "libmpv-release.aar" { print tolower($1) }' scripts/engine-checksums.sha256)"
          actual="$(sha256sum "$src" | awk '{ print tolower($1) }')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            echo "::error::Native build digest does not match scripts/engine-checksums.sha256"
            echo "expected=$expected"
            echo "actual=$actual"
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-release
          cp .native-build/artifacts/libmpv-yfuse-bluray.aar native-release/libmpv-release.aar
          printf '%s  libmpv-release.aar\n' '${{ steps.digest.outputs.sha }}' > native-release/libmpv-release.aar.sha256
          cp .native-build/artifacts/NATIVE-SOURCES.txt native-release/NATIVE-SOURCES.txt
          {
            cat native-release/NATIVE-SOURCES.txt
            echo 'architectures=arm64'
            cat native-release/libmpv-release.aar.sha256
          } > native-release/BUILD-MANIFEST.txt

      - name: Create or repair pinned native release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: native-mpv-fcf6745-yfuse2-arm64
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            native-release/libmpv-release.aar
            native-release/libmpv-release.aar.sha256
            native-release/NATIVE-SOURCES.txt
            native-release/BUILD-MANIFEST.txt
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target '${{ github.event.pull_request.base.sha }}' \
              --title "Yfuse native mpv $RELEASE_TAG" \
              --notes 'Pinned arm64-v8a Yfuse libmpv build repaired from repository source and accepted only when its SHA-256 matches scripts/engine-checksums.sha256.' \
              "${assets[@]}"
          fi

      - name: Verify published AAR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: native-mpv-fcf6745-yfuse2-arm64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern libmpv-release.aar --dir published
          expected="$(awk '$2 == "libmpv-release.aar" { print tolower($1) }' scripts/engine-checksums.sha256)"
          actual="$(sha256sum published/libmpv-release.aar | awk '{ print tolower($1) }')"
          [[ "$actual" == "$expected" ]]
