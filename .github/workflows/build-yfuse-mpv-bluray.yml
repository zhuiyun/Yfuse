name: Build Yfuse mpv Blu-ray

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: Native ABI set
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - all
  push:
    branches:
      - feature/uhd-bluray
      - agent/ycore2-foundation
    paths:
      - .github/workflows/build-yfuse-mpv-bluray.yml
      - scripts/build-yfuse-mpv-bluray.sh
      - scripts/build-ycore-native.sh
      - scripts/build-ycore-demux.sh
      - scripts/install-yfuse-mpv-bluray.sh
      - scripts/verify-yfuse-mpv-bluray-aar.sh
      - scripts/verify-ycore-native.sh
      - scripts/native/**
      - composeApp/src/androidMain/kotlin/com/yfuse/core2/android/FfmpegNativeBridge.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/MpvNativeBuildCapabilities.android.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/NativeRemoteBluRaySource.android.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/RemoteDiscBlockSource.android.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/NativeLocalBluRaySource.android.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/NativeLocalBdmvSource.android.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/NativeLocalBdmvRegistryProxy.android.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/NativeLocalBluRayRoute.android.kt
  pull_request:
    paths:
      - .github/workflows/build-yfuse-mpv-bluray.yml
      - scripts/build-yfuse-mpv-bluray.sh
      - scripts/build-ycore-native.sh
      - scripts/build-ycore-demux.sh
      - scripts/install-yfuse-mpv-bluray.sh
      - scripts/verify-yfuse-mpv-bluray-aar.sh
      - scripts/verify-ycore-native.sh
      - scripts/native/**
      - composeApp/src/androidMain/kotlin/com/yfuse/core2/android/FfmpegNativeBridge.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/MpvNativeBuildCapabilities.android.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/NativeLocalBdmvSource.android.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/NativeLocalBdmvRegistryProxy.android.kt
      - composeApp/src/androidMain/kotlin/com/yfuse/feature/player/NativeLocalBluRayRoute.android.kt

permissions:
  contents: read

concurrency:
  group: yfuse-mpv-bluray-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: libmpv + libbluray + YCore demux
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Yfuse
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake binutils build-essential cmake curl git libtool \
            meson ninja-build pkg-config python3 unzip wget yasm

      - name: Resolve ABI set
        id: abi
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.architectures }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build pinned native engine
        shell: bash
        run: |
          chmod +x \
            scripts/build-yfuse-mpv-bluray.sh \
            scripts/build-ycore-native.sh \
            scripts/build-ycore-demux.sh \
            scripts/verify-yfuse-mpv-bluray-aar.sh \
            scripts/verify-ycore-native.sh
          if [[ "${{ steps.abi.outputs.value }}" == "arm64" ]]; then
            scripts/build-ycore-native.sh --arch arm64
          else
            scripts/build-ycore-native.sh
          fi

      - name: Verify native release gates
        shell: bash
        run: |
          scripts/verify-ycore-native.sh

      - name: Record artifact manifest
        shell: bash
        run: |
          {
            cat .native-build/artifacts/NATIVE-SOURCES.txt
            echo "architectures=${{ steps.abi.outputs.value }}"
            cat .native-build/artifacts/libmpv-yfuse-bluray.aar.sha256
          } > .native-build/artifacts/BUILD-MANIFEST.txt

      - name: Upload libmpv AAR
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-yfuse-bluray-${{ steps.abi.outputs.value }}
          path: |
            .native-build/artifacts/libmpv-yfuse-bluray.aar
            .native-build/artifacts/libmpv-yfuse-bluray.aar.sha256
            .native-build/artifacts/NATIVE-SOURCES.txt
            .native-build/artifacts/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
