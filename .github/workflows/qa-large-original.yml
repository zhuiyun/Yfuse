name: Verify 64-bit media offsets on an original 4K film with both cores
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: [.github/workflows/qa-large-original.yml, qa-format-originals/large_mov.py]
permissions: {contents: read, actions: read}
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Verify candidate and build the observed touch driver
        env: {API_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          bash qa-integrated/acquire-qualified-candidate.sh 44349576264 2a3c4ab9624f3d35d7637729d619555db98b357b
          python3 qa-private-arm/build_input.py
          sed 's|adb install -r driver.apk|cp driver.apk "$GITHUB_WORKSPACE/preview/driver.apk"|' qa-source-trace/build-driver.sh > "$RUNNER_TEMP/driver.sh"
          bash "$RUNNER_TEMP/driver.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: large-film-test-input, path: preview/, retention-days: 3}
  playback:
    needs: inputs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: large-film-test-input, path: preview}
      - name: Prepare the guest and one copy of the original public MOV
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          (cd preview && sha256sum -c apk.sha256)
          grep -Fx 'app=2a3c4ab9624f3d35d7637729d619555db98b357b' preview/provenance.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil python3-cryptography
          bash qa-arm-dual/redroid.sh
          adb install -r -g preview/composeApp-release.apk
          adb install -r preview/driver.apk
          adb shell wm size 720x1280
          adb shell wm density 260
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000
          adb shell wm dismiss-keyguard
          touch /tmp/yfuse-tree-active
          python3 qa-format-originals/large_mov.py
      - name: Seek forward beyond 4 GiB and back on each engine
        run: |
          set -euo pipefail
          mkdir measurements
          cp format-fixtures/catalog.json measurements/
          status=0
          for core in YCore SenPlayer; do
            adb shell pm clear com.yfuse
            mkdir results
            cp preview/provenance.txt preview/apk.sha256 results/
            QA_ENGINE="$core" /usr/bin/python3 qa-format-diagnostics/run.py || status=1
            python3 qa-format-originals/large_mov.py results "$core" || status=1
            mv results "measurements/$core"
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: large-original-measurements
          path: |
            measurements/**/*.json
            measurements/**/*.jsonl
            measurements/**/apk.sha256
            measurements/**/provenance.txt
            measurements/catalog.json
          retention-days: 10
