name: Publish verified YCore native artifact

on:
  push:
    branches:
      - fix/playback-diagnostics-20260823
    paths:
      - .github/workflows/publish-known-good-native.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish known-good YCore native release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download and verify known-good native artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9445009471"
          EXPECTED_SHA256: "9900fe61971e39bf4bc69f306437ffd3de1587c63821570143e142a858b6f9a9"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-old native-release
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > old-native.zip
          unzip -q old-native.zip -d native-old
          aar="$(find native-old -type f -name 'libmpv-yfuse-bluray.aar' -print -quit)"
          sources="$(find native-old -type f -name 'NATIVE-SOURCES.txt' -print -quit)"
          test -s "$aar"
          test -s "$sources"
          actual="$(sha256sum "$aar" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          unzip -l "$aar" | grep -Fq 'jni/arm64-v8a/libycore_demux.so'
          grep -Fxq 'ycore-demux=true' "$sources"
          grep -Fxq 'ycore-demux-ffmpeg=n8.1' "$sources"
          cp "$aar" native-release/libmpv-release.aar
          cp "$sources" native-release/NATIVE-SOURCES.txt
          printf '%s  libmpv-release.aar\n' "$actual" > native-release/libmpv-release.aar.sha256

      - name: Publish immutable native dependency
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: native-mpv-fcf6745-yfuse3-arm64-20260823
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Native release $RELEASE_TAG is already present; keeping the immutable release."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Yfuse verified YCore native $RELEASE_TAG" \
              --notes "Republished immutable arm64-v8a artifact from verified Actions artifact 9445009471. Includes libbluray, remote ISO/BDMV bridges and libycore_demux.so. SHA-256 and provenance are attached." \
              native-release/libmpv-release.aar \
              native-release/libmpv-release.aar.sha256 \
              native-release/NATIVE-SOURCES.txt
          fi

      - name: Mark native release ready on branch
        env:
          EXPECTED_SHA256: "9900fe61971e39bf4bc69f306437ffd3de1587c63821570143e142a858b6f9a9"
          RELEASE_TAG: native-mpv-fcf6745-yfuse3-arm64-20260823
        shell: bash
        run: |
          set -euo pipefail
          printf 'tag=%s\nsha256=%s\n' "$RELEASE_TAG" "$EXPECTED_SHA256" > .native-release-ready
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .native-release-ready
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: mark verified native release ready"
          git push origin HEAD:fix/playback-diagnostics-20260823
