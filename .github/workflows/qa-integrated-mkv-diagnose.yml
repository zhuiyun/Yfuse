name: Diagnose YCore Matroska and FLAC startup failure
on:
  push:
    branches: [codex/two-engines-cloud-seek-20261113]
    paths: ['.github/workflows/qa-integrated-mkv-diagnose.yml']
permissions: {contents: read, actions: read}
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      QA_ENGINE: YCore
      QA_SHARD: '6'
      QA_SESSIONS: '1'
      QA_BATCHES: '1'
      QA_BATCH_COUNT: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: arm-input-driver, path: qa-driver, run-id: 43788137288, github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: candidate-test-input, path: preview, run-id: 43788137288, github-token: '${{ github.token }}'}
      - name: Verify APK and reproduce the exact H264 and FLAC container
        run: |
          set -euo pipefail
          (cd preview && sha256sum -c apk.sha256)
          grep -Fx 'app=6fed54460f600d46c7ebf3f7095c2724e7633d12' preview/provenance.txt
          sudo apt-get -qq update && sudo apt-get install -y ffmpeg python3-pil
          /usr/bin/python3 qa-title-seek-check/prepare.py 6 86
      - name: Boot cloud ARM64 Android
        run: bash qa-arm-dual/redroid.sh
      - name: Capture the failed open and decoder diagnostics
        run: bash qa-arm-matrix/run.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: diagnose-ycore-mkv-flac, path: results/, retention-days: 10}
