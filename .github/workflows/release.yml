name: Create GitHub release

on:
  workflow_run:
    workflows:
      - Publish Android update
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag, checksum, SBOM, and publish release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out published commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"
      - name: Re-run supply-chain verification for release
        run: python3 scripts/supply_chain_check.py --root . --sbom build/sbom/yfuse.spdx.json
      - name: Download signed production artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p build/publish-artifacts
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir build/publish-artifacts
      - name: Verify published APK and read its effective release metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # Manual inputs can override repository defaults. The successful run's
          # manifest binds those effective inputs to the exact APK uploaded with it.
          python3 scripts/published_release_metadata.py \
            --artifacts build/publish-artifacts \
            --apk-output build/Yfuse-published.apk \
            --notes-output build/published-release-notes.txt >> "$GITHUB_OUTPUT"
      - name: Normalize artifact name and create checksum
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mv build/Yfuse-published.apk "build/Yfuse-${VERSION_NAME}.apk"
          sha256sum "build/Yfuse-${VERSION_NAME}.apk" > "build/Yfuse-${VERSION_NAME}.apk.sha256"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::Release $tag already exists; refusing to mutate an existing release"; exit 1; fi
          # Version and notes come from this run's verified artifact; the source commit
          # comes from the workflow_run event, not an unverified manifest claim.
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          notes="build/release-notes-${VERSION_NAME}.txt"
          { cat build/published-release-notes.txt; printf '\nversionCode %s · commit %s\n' "$VERSION_CODE" "$HEAD_SHA"; } > "$notes"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" --title "Yfuse $VERSION_NAME" --notes-file "$notes" "build/Yfuse-${VERSION_NAME}.apk" "build/Yfuse-${VERSION_NAME}.apk.sha256" "build/sbom/yfuse.spdx.json"
