name: Finalize 1.0.7 poster transition

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'codex/restore-1.0.7-poster-transition'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out restore branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/restore-1.0.7-poster-transition
          fetch-depth: 0

      - name: Align exact 1.0.7 transition behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---- Hero: exact 1.0.7 dissolve contract used by the page-colour sampler.
          hero_path = Path("composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/Hero.kt")
          hero = hero_path.read_text()

          top_scrim_pattern = re.compile(
              r"fun heroTopScrim\(.*?\n\s*\)\n\n(?=/\*\*\n \* Page colour under the artwork)",
              re.S,
          )
          top_scrim = '''fun heroTopScrim(
              topInk: Float = 0.58f,
              midInk: Float = 0.24f,
          ): Brush =
              scrim(
                  0f to Color.Transparent,
                  0.46f to Color.Transparent,
                  0.80f to HeroInk.copy(alpha = midInk),
                  1f to HeroInk.copy(alpha = topInk),
              )

          '''
          hero, count = top_scrim_pattern.subn(top_scrim, hero, count=1)
          if count != 1:
              raise SystemExit(f"Hero.kt: expected one heroTopScrim replacement, found {count}")

          start = hero.index("val HeroPageFade: Dp =")
          end = hero.index("/**\n * Pulls content up over the lower edge of the hero", start)
          fade_contract = '''val HeroPageFade: Dp = 120.dp

          /**
           * Where hero copy has to stop.
           *
           * Slightly *inside* the band rather than clear of it: coverage at the band's top edge is
           * a few percent, which is nothing to read through, and insisting on the full clearance
           * costs a caption of vertical room it does not have on a short phone.
           */
          val HeroCaptionClearance: Dp = HeroPageFade - 20.dp

          /**
           * Dissolves the bottom [height] of this element into whatever is drawn behind it.
           *
           * Painting another colour over the artwork would create a third layer and a visible band.
           * Removing the artwork's own alpha instead reveals the single real page colour directly.
           *
           * Apply it to the artwork layer only. Anything that must stay legible — a caption, the
           * pagination — belongs outside this node, over the band rather than inside it.
           */
          fun Modifier.fadeIntoPage(height: Dp = HeroPageFade): Modifier =
              this
                  .graphicsLayer { compositingStrategy = CompositingStrategy.Offscreen }
                  .drawWithContent {
                      drawContent()
                      val fade = height.toPx().coerceAtMost(size.height)
                      if (fade <= 0f) return@drawWithContent
                      val top = size.height - fade
                      drawRect(
                          brush =
                              Brush.verticalGradient(
                                  colorStops = heroPageFadeMaskStops(),
                                  startY = top,
                                  endY = size.height,
                              ),
                          topLeft = Offset(0f, top),
                          size = Size(size.width, fade),
                          blendMode = BlendMode.DstOut,
                      )
                  }

          internal fun heroPageFadeMaskStops(): Array<Pair<Float, Color>> =
              arrayOf(
                  0f to Color.Transparent,
                  0.28f to Color.Black.copy(alpha = 0.10f),
                  0.58f to Color.Black.copy(alpha = 0.55f),
                  0.82f to Color.Black.copy(alpha = 0.94f),
                  0.90f to Color.Black,
                  1f to Color.Black,
              )

          '''
          hero = hero[:start] + fade_contract + hero[end:]
          hero_path.write_text(hero)

          # ---- Home: the exact sampled page colour must be the surface under the alpha mask.
          home_path = Path("composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt")
          home = home_path.read_text()
          home = home.replace("import com.yfuse.core.designsystem.heroReelScrim\n", "")
          home = home.replace("import com.yfuse.core.designsystem.pageTint\n", "")
          if "import com.yfuse.core.designsystem.heroTopScrim\n" not in home:
              anchor = "import com.yfuse.core.designsystem.heroMediaTypeLabel\n"
              if anchor not in home:
                  raise SystemExit("HomeScreen.kt: hero import anchor missing")
              home = home.replace(anchor, anchor + "import com.yfuse.core.designsystem.heroTopScrim\n", 1)
          home = re.sub(
              r"\n    val ground = pageTint\(heroAccent \?: Brand\.Primary\) // design-system: brand-identity\n",
              "\n",
              home,
              count=1,
          )
          home = home.replace(
              "modifier = Modifier.fillMaxSize().background(ground),",
              "modifier = Modifier.fillMaxSize(),",
              1,
          )
          home = re.sub(r"\n    val slideGround = pageTint\(artworkAccent\)\n", "\n", home, count=1)
          home = re.sub(
              r"\n            // The alpha mask reveals this slide's own ground\..*?\n            \.background\(slideGround\)",
              "",
              home,
              count=1,
              flags=re.S,
          )
          home = home.replace("heroReelScrim()", "heroTopScrim()")
          if "pageTint(" in home or "slideGround" in home or "heroReelScrim()" in home:
              raise SystemExit("HomeScreen.kt: stale page-tint transition remains")
          if "rememberArtworkPageColor(" not in home or "ArtworkPageTheme(" not in home:
              raise SystemExit("HomeScreen.kt: sampled page theme missing")
          home_path.write_text(home)

          # ---- Library: same one-surface contract; no per-page flat ground or duplicate extraction.
          library_path = Path("composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt")
          library = library_path.read_text()
          library = library.replace("import com.yfuse.core.designsystem.heroReelScrim\n", "")
          library = library.replace("import com.yfuse.core.designsystem.pageTint\n", "")
          if "import com.yfuse.core.designsystem.heroTopScrim\n" not in library:
              anchor = "import com.yfuse.core.designsystem.heroMediaTypeLabel\n"
              if anchor not in library:
                  raise SystemExit("LibraryHomeScreen.kt: hero import anchor missing")
              library = library.replace(anchor, anchor + "import com.yfuse.core.designsystem.heroTopScrim\n", 1)

          root_accent_pattern = re.compile(
              r"    val accent =\n        rememberAnimatedDominantColor\(\n            slideUrl,\n            Brand\.Primary, // design-system: brand-identity\n        \)\n",
          )
          root_accent = '''    val accent =
              rememberAnimatedArtworkAccent(
                  url = slideUrl,
                  fallback = Brand.Primary, // design-system: brand-identity
                  darkTheme = palette.isDark,
                  identity = slide?.id,
              )
          '''
          library, count = root_accent_pattern.subn(root_accent, library, count=1)
          if count != 1:
              raise SystemExit(f"LibraryHomeScreen.kt: expected one root accent replacement, found {count}")

          library = re.sub(
              r"\n    // The room the shelves sit in, taken from whatever the carousel is showing\..*?\n    val ground = pageTint\(accent\)\n",
              "\n",
              library,
              count=1,
              flags=re.S,
          )
          library = library.replace(
              "BoxWithConstraints(Modifier.fillMaxSize().background(ground)) {",
              "BoxWithConstraints(Modifier.fillMaxSize()) {",
              1,
          )

          ambient = '''                                        LivingPosterAmbient(
                                              urls = slideUrls,
                                              modifier = Modifier.fillMaxSize(),
                                          )'''
          ambient_new = '''                                        // Full-bleed phone artwork needs no second copy behind it: that copy
                                          // would leak through the alpha dissolve as a dark/saturated band.
                                          if (showSidePreview) {
                                              LivingPosterAmbient(
                                                  urls = slideUrls,
                                                  modifier = Modifier.fillMaxSize().fadeIntoPage(),
                                              )
                                          }'''
          if ambient not in library:
              raise SystemExit("LibraryHomeScreen.kt: ambient block not found")
          library = library.replace(ambient, ambient_new, 1)
          library = library.replace("beyondViewportPageCount = 1,", "beyondViewportPageCount = 0,", 1)

          per_page_accent_pattern = re.compile(
              r"\n                                            val animatedAccent =\n                                                rememberAnimatedDominantColor\(.*?\n                                                \)\n",
              re.S,
          )
          library, count = per_page_accent_pattern.subn("\n", library, count=1)
          if count != 1:
              raise SystemExit(f"LibraryHomeScreen.kt: expected one duplicate accent removal, found {count}")
          library = library.replace("accent = animatedAccent,", "accent = accent,", 1)

          library = re.sub(
              r"\n            // The mask below reveals this item's colour, including while two pager pages are\n            // simultaneously visible during a drag\.\n            \.background\(slideGround\)",
              "",
              library,
              count=1,
          )
          library = library.replace("heroReelScrim()", "heroTopScrim()")
          if "pageTint(" in library or "slideGround" in library or "rememberAnimatedDominantColor(" in library:
              raise SystemExit("LibraryHomeScreen.kt: stale derived page-colour logic remains")
          if "rememberArtworkPageColor(" not in library or "ArtworkPageTheme(" not in library:
              raise SystemExit("LibraryHomeScreen.kt: sampled page theme missing")
          library_path.write_text(library)
          PY

          git diff --check
          grep -q 'val HeroPageFade: Dp = 120.dp' composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/Hero.kt
          grep -q '0.90f to Color.Black' composeApp/src/commonMain/kotlin/com/yfuse/core/designsystem/Hero.kt
          grep -q 'rememberArtworkPageColor' composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt
          grep -q 'rememberArtworkPageColor' composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt
          grep -q 'ArtworkPageTheme' composeApp/src/commonMain/kotlin/com/yfuse/feature/home/HomeScreen.kt
          grep -q 'ArtworkPageTheme' composeApp/src/commonMain/kotlin/com/yfuse/feature/library/LibraryHomeScreen.kt

          rm .github/workflows/finalize-1.0.7-poster-transition.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): align exact 1.0.7 poster dissolve contract'
          git push origin HEAD:codex/restore-1.0.7-poster-transition
