name: Apply PlayerStore wall-clock timeout fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/one-shot-player-timeout-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Patch queue timeout to use wall-clock time
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('composeApp/src/commonMain/kotlin/com/yfuse/feature/player/PlayerStore.kt')
          text = path.read_text()

          old_imports = '''import kotlinx.coroutines.Job
          import kotlinx.coroutines.async
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withTimeoutOrNull
          '''
          new_imports = '''import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.async
          import kotlinx.coroutines.coroutineScope
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeoutOrNull
          '''
          if old_imports not in text:
              raise SystemExit('expected coroutine import block not found')
          text = text.replace(old_imports, new_imports, 1)

          old_timeout = '''            scope.launch {
                          delay(queueLoadTimeoutMs)
                          if (loadAttempt != attempt || !job.isActive) return@launch
                          job.cancel()
                          AppLog.warning(
                              category = "feature.player",
                              event = "queue_load_timeout",
                              message = "Playback queue preparation timed out",
                              attributes = mapOf("timeoutMs" to queueLoadTimeoutMs.toString()),
                          )
                          dispatch(PlayerMsg.Failed("播放准备超时，请检查服务器连接后重试"))
                      }
          '''
          new_timeout = '''            scope.launch {
                          // This is a user-facing wall-clock deadline, not coroutine virtual time.
                          // Keeping the timer on Default prevents runTest from jumping directly to
                          // 30 s while MockEngine/serialization is still completing on another
                          // dispatcher, which used to cancel otherwise healthy queue builds.
                          withContext(Dispatchers.Default) {
                              delay(queueLoadTimeoutMs)
                          }
                          if (loadAttempt != attempt || !job.isActive) return@launch
                          job.cancel()
                          AppLog.warning(
                              category = "feature.player",
                              event = "queue_load_timeout",
                              message = "Playback queue preparation timed out",
                              attributes = mapOf("timeoutMs" to queueLoadTimeoutMs.toString()),
                          )
                          dispatch(PlayerMsg.Failed("播放准备超时，请检查服务器连接后重试"))
                      }
          '''
          if old_timeout not in text:
              raise SystemExit('expected queue timeout block not found')
          text = text.replace(old_timeout, new_timeout, 1)
          path.write_text(text)
          PY

          git diff --check
          git diff -- composeApp/src/commonMain/kotlin/com/yfuse/feature/player/PlayerStore.kt
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "yfuse-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-player-timeout-fix.yml
          git add composeApp/src/commonMain/kotlin/com/yfuse/feature/player/PlayerStore.kt
          git commit -m "fix(player): measure queue timeout on wall clock"
          git push origin HEAD:master
