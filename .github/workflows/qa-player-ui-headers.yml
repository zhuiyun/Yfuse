name: Verify unobstructed player panels across both engines and phone widths
'on':
  push:
    branches:
    - codex/two-engines-cloud-seek-20261113
    paths:
    - .github/workflows/qa-player-ui-headers.yml
permissions:
  contents: read
  actions: read
env:
  QA_APP_SHA: e527c57b2667adbcc2a886020ab7d4c5cf0c20f6
  QA_BUILD_RUN: 43904816658
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Acquire built diagnostic baseline and retain known qualification failures
      env:
        API_TOKEN: ${{ github.token }}
      run: bash qa-power-ui/acquire-baseline.sh "$QA_BUILD_RUN" "$QA_APP_SHA"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: power-ui-baseline-input
        path: 'preview/composeApp-release.apk

          preview/provenance.txt

          preview/apk.sha256

          preview/baseline-build-run.json

          preview/baseline-build-jobs.json

          preview/baseline-limit.txt'
        retention-days: 10
    - name: Build visible editable-control instrumentation
      run: 'set -euo pipefail

        mkdir qa-driver

        cp qa-arm-matrix/Driver.java qa-volume/input-driver.java

        sed ''s|adb install -r driver.apk|cp driver.apk "$GITHUB_WORKSPACE/qa-driver/driver.apk"|''
        qa-volume/build-driver.sh > "$RUNNER_TEMP/driver.sh"

        bash "$RUNNER_TEMP/driver.sh"'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: power-ui-input-driver
        path: qa-driver/
        retention-days: 7
  player-ui:
    name: Player headers ${{ matrix.engine }} ${{ matrix.layout }}
    needs: acquire
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        engine:
        - YCore
        - SenPlayer
        layout:
        - normal
        - compact
    env:
      QA_ENGINE: ${{ matrix.engine }}
      QA_REQUIRE_CLEAR_PANELS: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: power-ui-baseline-input
        path: preview
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: power-ui-input-driver
        path: qa-driver
    - name: Verify runtime and prepare evidence tools
      run: 'set -euo pipefail

        mkdir -p results

        # apk.sha256 may also name unrelated build inputs; verify this exact app entry.

        (cd preview && grep ''composeApp-release.apk$'' apk.sha256 | sha256sum -c
        -)

        grep -Fx "app=$QA_APP_SHA" preview/provenance.txt

        cp preview/provenance.txt preview/apk.sha256 preview/baseline-build-*.json
        preview/baseline-limit.txt results/

        printf ''qa=%s\nrun=%s\n'' "$GITHUB_SHA" "$GITHUB_RUN_ID" > results/qa-provenance.txt

        sudo apt-get update -qq

        sudo apt-get install -y ffmpeg python3-pil

        '
    - name: Boot disposable cloud ARM64 Android
      run: bash qa-arm-dual/redroid.sh
    - name: Install exact candidate and UI evidence driver
      run: "set -euo pipefail\ntest \"$GITHUB_ACTIONS\" = true\nadb install -r -g\
        \ preview/composeApp-release.apk\nadb install -r qa-driver/driver.apk\nadb\
        \ shell wm size 720x1280\nif [ \"${{ matrix.layout }}\" = compact ]; then\n\
        \  adb shell wm density 320\n  adb shell settings put system font_scale 1.3\n\
        else\n  adb shell wm density 260\n  adb shell settings put system font_scale\
        \ 1.0\nfi\nadb shell settings put secure immersive_mode_confirmations confirmed\n\
        adb shell settings put secure accessibility_interactive_ui_timeout_ms 60000\n\
        adb shell wm dismiss-keyguard\ntouch /tmp/yfuse-tree-active\nadb shell getprop\
        \ > results/guest-properties.txt\ndocker inspect qa-android --format '{{.Image}}'\
        \ > results/cloud-image.txt\n"
    - name: Capture actual engine playback controls and popup pages
      run: /usr/bin/python3 qa-power-ui/player_ui.py
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: player-ui-headers-${{ matrix.engine }}-${{ matrix.layout }}
        path: results/
        retention-days: 14
