org.gradle.caching=false
org.gradle.configuration-cache=false

kotlin.code.style=official
# PlayerActivity contains the three playback backends' orchestration and now exceeds the
# Kotlin IR compiler's reliable 1.5 GB ceiling on clean builds. The current three-backend
# source set plus diagnostics needs 4 GB for a clean Kotlin 2.2 compilation.
kotlin.daemon.jvmargs=-Xmx4096M
# Signed release validation intentionally recompiles tests from the checked-out source so
# long-lived signing branches cannot surface deleted/renamed test classes from restored caches.
kotlin.incremental=false

android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

# Public Google Cast Custom Web Receiver application ID. This is intentionally checked in so
# local, CI, and production builds discover the same receiver and negotiate output capabilities.
yfuseCastReceiverApplicationId=E9107559

# Authorized one-off full-package signing build. Required by the production MDK distribution gate.
confirmMdkDistributionRights=true

# Ed25519 public key (base64 SubjectPublicKeyInfo) pinned for update-manifest signatures.
# Generate the pair with `openssl genpkey -algorithm ed25519 -out update-manifest.pem`,
# derive this value with `openssl pkey -in update-manifest.pem -pubout -outform DER | base64 -w0`,
# and store the PEM as the UPDATE_MANIFEST_SIGNING_KEY GitHub secret. See docs/android-release.md.
yfuse.updateManifestPublicKey=
