# Local and CI builds share the build cache and parallel project execution. Signed release
# packaging additionally disables Kotlin incremental compilation from the release entry points
# (scripts/build-release-packages.ps1 and the signed CI workflows pass -Pkotlin.incremental=false)
# so a long-lived signing branch cannot surface deleted/renamed test classes from restored caches;
# ordinary development builds keep incremental compilation.
org.gradle.caching=true
org.gradle.parallel=true
# Kept off until it is evaluated: AGP 9 plus the custom verification/packaging tasks in
# composeApp/build.gradle.kts and tvApp/build.gradle.kts read project state at execution time
# and have not been audited for configuration-cache compatibility.
org.gradle.configuration-cache=false

kotlin.code.style=official
# PlayerActivity contains the three playback backends' orchestration and now exceeds the
# Kotlin IR compiler's reliable 1.5 GB ceiling on clean builds. The current three-backend
# source set plus diagnostics needs 4 GB for a clean Kotlin 2.2 compilation.
kotlin.daemon.jvmargs=-Xmx4096M

android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8

# Public Google Cast Custom Web Receiver application ID. This is intentionally checked in so
# local, CI, and production builds discover the same receiver and negotiate output capabilities.
yfuseCastReceiverApplicationId=E9107559

# The production MDK distribution-rights acknowledgement (confirmMdkDistributionRights) is
# deliberately NOT stored here. It must be passed explicitly per release by the release owner:
# scripts/build-release-packages.ps1 -ConfirmMdkDistributionRights, or -PconfirmMdkDistributionRights=true
# from the signed CI workflows. See composeApp/build.gradle.kts (verifyProductionMdkRights).

# Optional Ed25519 public-key pin (base64 SubjectPublicKeyInfo) for update-manifest signatures.
# Leave empty to use standard updates with APK hash, size, package and certificate verification.
# Export the public key from the EXISTING update-manifest signing key; do not replace it.
# `openssl pkey -in update-manifest.pem -pubout -outform DER | base64 -w0`
# See docs/android-release.md for first-time setup and PowerShell commands.
# Optional local pin. CI derives and embeds the matching public key directly from the protected
# UPDATE_MANIFEST_SIGNING_KEY release secret, and verifies this value when it is provided.
yfuse.updateManifestPublicKey=
