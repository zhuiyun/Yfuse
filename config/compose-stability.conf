// Compose compiler stability configuration, read by every module that applies the Compose
// compiler plugin (wired in the root build.gradle.kts).
//
// A type listed here is treated as stable wherever it is used, so composables that take it can
// skip. That is a promise the compiler cannot check: list only types whose instances never change
// after construction, and never an interface that a mutable class may implement.
//
// Deliberately absent:
//  - kotlin.collections.List/Set/Map. A MutableList passed as a List would be covered too and
//    would silently stop recomposing. Annotate the state class that owns the list instead.
//  - kotlin.time.Duration and other value classes: the compiler infers them from their
//    underlying Long, so an entry changes nothing.
//  - kotlinx.collections.immutable: not a dependency, and the compiler knows its types already.
//  - android.graphics.Rect, Media3 Cue/Format, Painter, ImageBitmap: mutable or holding arrays.
//
// The syntax allows one fully qualified name per line, `*` for one package level, `**` for all
// levels below, and whole-line comments only.

// java.time documents every class in the package as immutable and thread-safe.
java.time.*
kotlin.time.Instant
java.util.UUID
